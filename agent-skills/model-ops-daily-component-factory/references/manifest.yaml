id: "pipeline/model-ops-daily-component-factory"
type: pipeline
version: "0.1.0"
name: "Model ops daily component factory"
description: "Runs a daily model-ops factory that expands model runtime, training, fine-tuning, Kubernetes, and federated reviewed-object sharing patterns into 1K+ staged component candidates with load-audit output."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["generation", "planning", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.model_ops"
tags: ["components", "model-ops", "training", "fine-tuning", "local-models", "kubernetes", "load-audit"]
created: "2026-05-26"
updated: "2026-05-26"

task: "Generate and load-audit a daily batch of model/runtime/training/federated-sharing component candidates without executing model training, downloading weights, contacting Kubernetes, or applying SQL."
pipeline_kind: "research_web.model_ops_daily_component_factory"
inputs:
  - name: "run_date"
    type: "string"
  - name: "output_dir"
    type: "string"
  - name: "target_count"
    type: "integer"
outputs:
  - name: "model_ops_daily_summary"
    type: "json"
  - name: "component_candidate_rows"
    type: "jsonl"
  - name: "load_audit"
    type: "json"
  - name: "candidate_load_sql"
    type: "sql"
defaults:
  knowledge_packs:
    - "knowledge-pack/model-runtime-training-component-patterns"
steps:
  - id: "load-model-ops-patterns"
    kind: "knowledge_pack"
    ref: "knowledge-pack/model-runtime-training-component-patterns"
    inputs:
      query: "model ops local runtime Kubernetes fine tuning federated reviewed object sharing"
      top_k: 20
  - id: "run-model-ops-daily-factory"
    kind: "tool"
    ref: "tool/model-ops-daily-runner"
    inputs:
      run_date: "$.inputs.run_date"
      output_dir: "$.inputs.output_dir"
      target_count: "$.inputs.target_count"
success_criteria:
  - kind: "deterministic"
    target: "$.run-model-ops-daily-factory.row_counts.normalized_object"
    op: ">="
    value: 1000
    severity: "high"
    label: "The model-ops daily factory emits at least 1,000 staged component candidates."
  - kind: "deterministic"
    target: "$.run-model-ops-daily-factory.load_audit.audit_status"
    op: "=="
    value: "staged_only"
    severity: "high"
    label: "The load audit remains side-effect free until operator approval."
  - kind: "semantic"
    target: "$.run-model-ops-daily-factory"
    must_cover:
      - "local model runtime"
      - "Kubernetes runtime"
      - "fine tuning"
      - "federated reviewed object sharing"
      - "load audit"
    similarity_threshold: 0.55
    severity: "medium"
    label: "The summary covers the model-ops expansion surface."
