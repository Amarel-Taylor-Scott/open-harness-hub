id: "pipeline/customer-escalation-quality-review"
type: pipeline
version: "0.1.0"
name: "Customer Escalation Quality review pipeline"
description: "End-to-end customer escalation quality review with redaction, grep triage, RAG grounding, harness review, rubric scoring, and audit trace."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["customer_success.escalation", "retail.support"]
capability: ["evaluation", "extraction", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["customer-escalation-quality", "use-case-expansion"]
created: "2026-05-24"
updated: "2026-05-24"
task: "Review customer escalation handling for response quality, ownership, policy adherence, and recovery plan."
pipeline_kind: "review"
inputs:
  - name: "packet"
    type: "string|object"
outputs:
  - name: "findings"
    type: "object[]"
  - name: "score"
    type: "number"
  - name: "evidence_gaps"
    type: "object[]"
defaults:
  persona: "persona/customer-escalation-reviewer"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/customer-escalation-quality-frameworks"]
  rule_packs: ["rule-pack/grep-customer-escalation-quality-flags", "rule-pack/rag-customer-escalation-quality-retrieval-policy"]
steps:
  - id: "structured_to_prose"
    kind: "processor"
    ref: "processor/structured-to-prose"
    inputs: { data: "$.inputs.packet" }
  - id: "redact_pii"
    kind: "processor"
    ref: "processor/redact-pii-text"
    inputs: { text: "$.steps.structured_to_prose.output.prose" }
  - id: "grep_flags"
    kind: "rule_pack"
    ref: "rule-pack/grep-customer-escalation-quality-flags"
    inputs: { text: "$.steps.redact_pii.output.text" }
  - id: "retrieve_context"
    kind: "rule_pack"
    ref: "rule-pack/rag-customer-escalation-quality-retrieval-policy"
    inputs: { query: "$.steps.grep_flags.output.fired", corpus: "knowledge-pack/customer-escalation-quality-frameworks", top_k: 8 }
  - id: "review_harness"
    kind: "harness"
    ref: "harness/customer-escalation-quality-review"
    inputs:
      packet: "$.steps.redact_pii.output.text"
      context: "$.steps.retrieve_context.output.passages"
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.review_harness.output.findings"
      rubric_ref: "rubric/customer-escalation-quality-quality-v1"
  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "customer-escalation-quality-review"
      applied_layers: ["privacy", "grep", "rag", "harness", "judge"]
success_criteria:
  - rubric: "rubric/customer-escalation-quality-quality-v1"
    threshold: 0.65
