id: "pipeline/mine-safety-incident-review"
type: pipeline
version: "0.1.0"
name: "Mine Safety Incident review pipeline"
description: "Benchmarkable mine safety incident review pipeline with normalization, grep, RAG, harness review, severity calibration, evidence gaps, and risk-register output."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["mining.surface", "mining.underground"]
capability: ["evaluation", "extraction", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["mine-safety-incident", "expansion-v4"]
created: "2026-05-24"
updated: "2026-05-24"
task: "Review mine safety incident packets for hazard controls, preshift evidence, training, equipment condition, and corrective action."
pipeline_kind: "review"
inputs:
  - name: "packet"
    type: "string|object"
outputs:
  - name: "findings"
    type: "object[]"
  - name: "score"
    type: "number"
  - name: "evidence_gaps"
    type: "object[]"
  - name: "risk_register_updates"
    type: "object[]"
defaults:
  persona: "persona/mine-safety-reviewer"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/mine-safety-incident-frameworks"]
  rule_packs: ["rule-pack/grep-mine-safety-incident-flags", "rule-pack/rag-mine-safety-incident-retrieval-policy"]
steps:
  - id: "structured_to_prose"
    kind: "processor"
    ref: "processor/structured-to-prose"
    inputs: { data: "$.inputs.packet" }
  - id: "redact_pii"
    kind: "processor"
    ref: "processor/redact-pii-text"
    inputs: { text: "$.steps.structured_to_prose.output.prose" }
  - id: "normalize_evidence"
    kind: "processor"
    ref: "processor/packet-evidence-normalizer"
    inputs: { trace: "$.steps.redact_pii.output", config: {} }
  - id: "grep_flags"
    kind: "rule_pack"
    ref: "rule-pack/grep-mine-safety-incident-flags"
    inputs: { text: "$.steps.redact_pii.output.text" }
  - id: "retrieve_context"
    kind: "rule_pack"
    ref: "rule-pack/rag-mine-safety-incident-retrieval-policy"
    inputs: { query: "$.steps.grep_flags.output.fired", corpus: "knowledge-pack/mine-safety-incident-frameworks", top_k: 12 }
  - id: "control_matrix"
    kind: "processor"
    ref: "processor/control-matrix-builder"
    inputs: { trace: "$.steps.retrieve_context.output", config: {} }
  - id: "review_harness"
    kind: "harness"
    ref: "harness/mine-safety-incident-review"
    inputs:
      packet: "$.steps.redact_pii.output.text"
      context: "$.steps.retrieve_context.output.passages"
      evidence: "$.steps.normalize_evidence.output.result"
      controls: "$.steps.control_matrix.output.result"
  - id: "dedupe_findings"
    kind: "processor"
    ref: "processor/finding-deduplicator"
    inputs: { trace: "$.steps.review_harness.output", config: {} }
  - id: "calibrate_severity"
    kind: "processor"
    ref: "processor/severity-calibrator"
    inputs: { trace: "$.steps.dedupe_findings.output.result", config: {} }
  - id: "extract_evidence_gaps"
    kind: "processor"
    ref: "processor/evidence-gap-extractor"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
  - id: "route_owners"
    kind: "processor"
    ref: "processor/remediation-owner-router"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
  - id: "check_citations"
    kind: "processor"
    ref: "processor/citation-span-checker"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.calibrate_severity.output.result"
      rubric_ref: "rubric/mine-safety-incident-quality-v1"
  - id: "redaction_audit"
    kind: "processor"
    ref: "processor/packet-redaction-audit"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
  - id: "risk_register"
    kind: "processor"
    ref: "processor/risk-register-updater"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
  - id: "summary"
    kind: "processor"
    ref: "processor/review-summary-composer"
    inputs: { trace: "$.steps.calibrate_severity.output.result", config: {} }
success_criteria:
  - rubric: "rubric/mine-safety-incident-quality-v1"
    threshold: 0.70
  - kind: "deterministic"
    target: "$.steps.redaction_audit.output.result.pass"
    op: "=="
    value: true
    severity: "high"
    label: "redaction audit passes"
  - kind: "deterministic"
    target: "$.steps.check_citations.output.result.pass"
    op: "=="
    value: true
    severity: "high"
    label: "citation span check passes"
