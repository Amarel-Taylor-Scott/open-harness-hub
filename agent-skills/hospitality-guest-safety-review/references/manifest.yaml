id: "pipeline/hospitality-guest-safety-review"
type: pipeline
version: "0.1.0"
name: "Hospitality Guest Safety review pipeline"
description: "End-to-end hospitality guest safety review with redaction, grep triage, RAG grounding, rubric scoring, and audit trace output."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["hospitality"]
capability: ["evaluation", "extraction", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["hospitality-guest-safety", "synthetic-expansion"]
created: "2026-05-24"
updated: "2026-05-24"
task: "Review hospitality incident packets for guest safety, duty-of-care evidence, escalation, and remediation tracking."
pipeline_kind: "review"
inputs:
  - name: "packet"
    type: "string|object"
outputs:
  - name: "findings"
    type: "object[]"
  - name: "score"
    type: "number"
  - name: "evidence_gaps"
    type: "object[]"
defaults:
  persona: "persona/hospitality-safety-reviewer"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/hospitality-guest-safety-frameworks"]
  rule_packs: ["rule-pack/grep-hospitality-guest-safety-flags", "rule-pack/rag-hospitality-guest-safety-retrieval-policy"]
steps:
  - id: "structured_to_prose"
    kind: "processor"
    ref: "processor/structured-to-prose"
    inputs: { data: "$.inputs.packet" }
  - id: "redact_pii"
    kind: "processor"
    ref: "processor/redact-pii-text"
    inputs: { text: "$.steps.structured_to_prose.output.prose" }
  - id: "grep_flags"
    kind: "rule_pack"
    ref: "rule-pack/grep-hospitality-guest-safety-flags"
    inputs: { text: "$.steps.redact_pii.output.text" }
  - id: "retrieve_context"
    kind: "rule_pack"
    ref: "rule-pack/rag-hospitality-guest-safety-retrieval-policy"
    inputs: { query: "$.steps.grep_flags.output.fired", corpus: "knowledge-pack/hospitality-guest-safety-frameworks", top_k: 8 }
  - id: "review_harness"
    kind: "harness"
    ref: "harness/hospitality-guest-safety-review"
    inputs:
      packet: "$.steps.redact_pii.output.text"
      context: "$.steps.retrieve_context.output.passages"
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.review_harness.output.findings"
      rubric_ref: "rubric/hospitality-guest-safety-quality-v1"
  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "hospitality-guest-safety-review"
      applied_layers: ["privacy", "grep", "rag", "harness", "judge"]
success_criteria:
  - rubric: "rubric/hospitality-guest-safety-quality-v1"
    threshold: 0.65
