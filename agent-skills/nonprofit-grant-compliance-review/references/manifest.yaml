id: "pipeline/nonprofit-grant-compliance-review"
type: pipeline
version: "0.1.0"
name: "Nonprofit Grant Compliance review pipeline"
description: "End-to-end nonprofit grant compliance review with redaction, grep triage, RAG grounding, rubric scoring, and audit trace output."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["nonprofit"]
capability: ["evaluation", "extraction", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["nonprofit-grant-compliance", "synthetic-expansion"]
created: "2026-05-24"
updated: "2026-05-24"
task: "Review nonprofit grant files for allowable costs, subrecipient monitoring, reporting deadlines, and restricted-fund controls."
pipeline_kind: "review"
inputs:
  - name: "packet"
    type: "string|object"
outputs:
  - name: "findings"
    type: "object[]"
  - name: "score"
    type: "number"
  - name: "evidence_gaps"
    type: "object[]"
defaults:
  persona: "persona/grant-compliance-analyst"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/nonprofit-grant-compliance-frameworks"]
  rule_packs: ["rule-pack/grep-nonprofit-grant-compliance-flags", "rule-pack/rag-nonprofit-grant-compliance-retrieval-policy"]
steps:
  - id: "structured_to_prose"
    kind: "processor"
    ref: "processor/structured-to-prose"
    inputs: { data: "$.inputs.packet" }
  - id: "redact_pii"
    kind: "processor"
    ref: "processor/redact-pii-text"
    inputs: { text: "$.steps.structured_to_prose.output.prose" }
  - id: "grep_flags"
    kind: "rule_pack"
    ref: "rule-pack/grep-nonprofit-grant-compliance-flags"
    inputs: { text: "$.steps.redact_pii.output.text" }
  - id: "retrieve_context"
    kind: "rule_pack"
    ref: "rule-pack/rag-nonprofit-grant-compliance-retrieval-policy"
    inputs: { query: "$.steps.grep_flags.output.fired", corpus: "knowledge-pack/nonprofit-grant-compliance-frameworks", top_k: 8 }
  - id: "review_harness"
    kind: "harness"
    ref: "harness/nonprofit-grant-compliance-review"
    inputs:
      packet: "$.steps.redact_pii.output.text"
      context: "$.steps.retrieve_context.output.passages"
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.review_harness.output.findings"
      rubric_ref: "rubric/nonprofit-grant-compliance-quality-v1"
  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "nonprofit-grant-compliance-review"
      applied_layers: ["privacy", "grep", "rag", "harness", "judge"]
success_criteria:
  - rubric: "rubric/nonprofit-grant-compliance-quality-v1"
    threshold: 0.65
