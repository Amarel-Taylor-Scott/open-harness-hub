id: "pipeline/cache-assisted-harness-composition"
type: pipeline
version: "0.1.0"
name: "Cache-assisted harness composition"
description: "Uses the Open Harness Hub object database as a trajectory-fragment cache: extract solved fragments, retrieve similar subproblems, compose candidates cheaply, verify them, and fall back to stronger models when needed."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["retrieval", "evaluation", "governance", "serving"]
modality: ["text", "structured", "code"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "volatile"
lifecycle_position: "cross_cutting.cache"
tags: ["trajectory-cache", "fragment-cache", "agent-traces", "cost-optimization", "model-routing"]
created: "2026-05-25"
updated: "2026-05-25"

task: "Retrieve and verify reusable trajectory fragments so recurring harness and pipeline subproblems can be served with less model inference."
pipeline_kind: "agent_loop"
inputs:
  - name: "request"
    type: "object"
  - name: "trace"
    type: "object"
  - name: "privacy_policy"
    type: "object"
  - name: "cost_policy"
    type: "object"
outputs:
  - name: "fragment_rows"
    type: "array"
  - name: "candidate_fragments"
    type: "array"
  - name: "composition"
    type: "object"
  - name: "cache_reuse_event"
    type: "json"
defaults:
  knowledge_packs:
    - "knowledge-pack/trajectory-fragment-cache-patterns"
steps:
  - id: "extract-fragments"
    kind: "tool"
    ref: "tool/trajectory-fragment-extractor"
    inputs:
      trace: "$.inputs.trace"
      privacy_policy: "$.inputs.privacy_policy"
  - id: "retrieve-fragments"
    kind: "tool"
    ref: "tool/fragment-cache-retriever"
    inputs:
      request_signature: "$.inputs.request.task_signature"
      query_text: "$.inputs.request.query_text"
  - id: "route-model"
    kind: "tool"
    ref: "tool/model-capability-router"
    inputs:
      cost_policy: "$.inputs.cost_policy"
  - id: "stitch-and-verify"
    kind: "tool"
    ref: "tool/cache-stitch-verify-composer"
    inputs:
      request: "$.inputs.request"
      candidates: "$.steps.retrieve-fragments.output.candidates"
  - id: "emit-index"
    kind: "tool"
    ref: "tool/index-record-emitter"
    inputs:
      subject_type: "trajectory_fragment"
success_criteria:
  - kind: "semantic"
    target: "$.composition"
    must_cover:
      - "retrieved fragments"
      - "cheap composition"
      - "verification"
      - "fallback model"
      - "privacy boundary"
    similarity_threshold: 0.55
    severity: "high"
    label: "Composition uses cache fragments with verification and fallback."
  - kind: "deterministic"
    target: "$.cache_reuse_event"
    op: "is_truthy"
    value: true
    severity: "medium"
    label: "Cache reuse event is emitted."
