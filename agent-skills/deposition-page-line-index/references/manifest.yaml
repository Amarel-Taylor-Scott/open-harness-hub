id: "pipeline/deposition-page-line-index"
type: pipeline
version: "0.1.0"
name: "Deposition transcript page:line index with cited topic digest + contradiction flags"
description: |
  Negative-space task: turning a long deposition transcript into a usable
  index for litigation. A bare LLM summarizes a deposition fluently but (a)
  fabricates or mis-attributes the page:line citations that make a digest
  admissible/usable, (b) loses the thread across hundreds of pages, and (c)
  cannot reliably flag where a witness contradicts an earlier answer. This
  pipeline extracts page-anchored text, chunks page-aware so every chunk keeps
  its page:line, retrieves topic-relevant testimony with hybrid + rerank, and
  produces a topic digest where EVERY assertion must carry a verbatim quote +
  its page:line — verified deterministically so an entry with an unsupported
  or unparseable citation fails the run rather than shipping.

  Capability lift is structural: the durable lift is citation fidelity (every
  index entry traces to a real page:line span) — a verification step, not a
  model capability that closes on the next release. Extraction, page-aware
  chunking, hybrid retrieval, rerank, and the citation-coverage check are
  freezable and cost no model tokens beyond the digest call.

  Bundle: High-precision legal RAG for regulated domains (taxonomy Bundle B) —
  page/structure-aware chunking to preserve citable anchors, hybrid BM25 +
  dense + rerank, cite-every-claim-or-abstain output, and a citation-coverage
  gate.
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["legal.litigation", "legal.compliance"]
capability: ["extraction", "retrieval", "verification", "summarization"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["document-media-intelligence", "deposition", "page-line", "litigation", "citation-fidelity", "contradiction", "structural-lift", "bundle-b"]
created: "2026-05-29"
updated: "2026-05-29"
task: |
  Given a deposition transcript PDF and a list of issue topics, produce a
  topic-indexed digest where every assertion is backed by a verbatim quote
  and its exact page:line citation, plus a list of intra-witness
  contradictions (each pointing to the two conflicting page:line spans). Fail
  if any index entry's citation cannot be resolved to a real page:line span.
pipeline_kind: "extract"
inputs:
  - name: "transcript_pdf"
    type: "string"
  - name: "issue_topics"
    type: "string[]"
outputs:
  - name: "topic_index"
    type: "object[]"
  - name: "cited_spans"
    type: "object[]"
  - name: "contradiction_flags"
    type: "object[]"
  - name: "concept_graph"
    type: "object"
  - name: "findings"
    type: "object[]"
defaults:
  persona: "persona/litigation-hold-reviewer"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/legal-litigation-hold-frameworks"]
  rule_packs: ["rule-pack/hybrid-retrieval-policy", "rule-pack/grep-prompt-injection-heuristics", "rule-pack/privacy-pii-text-en"]
steps:
  # --- INPUT FORMATTING: page-anchored text extraction (OCR fallback for scans) ---
  - id: "pdf_extract"
    kind: "processor"
    ref: "processor/pdf-extract-with-ocr-fallback"
    inputs: { pdf_path: "$.inputs.transcript_pdf", ocr_fallback_threshold_chars: 32 }
  # --- page/structure-aware chunking PRESERVES the page:line citable anchors ---
  - id: "page_aware_chunk"
    kind: "processor"
    ref: "processor/page-aware-chunker"
    inputs: { pages: "$.steps.pdf_extract.output.pages", target_tokens: 700, overlap: 100 }
  - id: "embed_local"
    kind: "processor"
    ref: "processor/local-embedder"
    inputs: { chunks: "$.steps.page_aware_chunk.output.chunks" }
  # --- KNOWLEDGE: hybrid BM25 + dense retrieval of topic-relevant testimony ---
  - id: "hybrid_retrieve"
    kind: "rule_pack"
    ref: "rule-pack/hybrid-retrieval-policy"
    inputs:
      query: "$.inputs.issue_topics"
      doc_vectors: "$.steps.embed_local.output.embeddings"
      docs: "$.steps.page_aware_chunk.output.chunks"
      top_k: 24
  # --- R3 rerank the merged candidates to high-precision top-k ---
  - id: "rerank"
    kind: "processor"
    ref: "processor/cross-encoder-reranker"
    inputs:
      query: "$.inputs.issue_topics"
      candidates: "$.steps.hybrid_retrieve.output.candidates"
      output_k: 8
  # --- P5 injection defense + PII redaction on retrieved spans before the model ---
  - id: "guard_chunks"
    kind: "rule_pack"
    ref: "rule-pack/grep-prompt-injection-heuristics"
    inputs: { text: "$.steps.rerank.output.ranked" }
  - id: "redact_chunks_pii"
    kind: "rule_pack"
    ref: "rule-pack/privacy-pii-text-en"
    inputs: { text: "$.steps.rerank.output.ranked" }
  # --- ACTION (model call): build the topic digest, REQUIRED to cite page:line ---
  - id: "build_index"
    kind: "harness"
    ref: "harness/text-safety-review"
    inputs:
      messages: |
        [{"role": "system", "content": "{{persona.litigation-hold-reviewer}}"},
         {"role": "user", "content": "Build a topic-indexed deposition digest from the retrieved transcript chunks ONLY. For EACH issue topic, list assertions; every assertion MUST carry the verbatim quote and its page:line citation taken from the chunk's anchor. Then flag any place the witness contradicts an earlier answer, citing BOTH conflicting page:line spans. If no chunk supports a topic, say so — never invent a citation."}]
      context: "$.steps.rerank.output.ranked"
  # --- POST: deterministic citation-coverage verification (the lift gate) ---
  - id: "verify_citation_coverage"
    kind: "processor"
    ref: "processor/citation-coverage"
    inputs: { response_markdown: "$.steps.build_index.output.text" }
  - id: "check_citations"
    kind: "processor"
    ref: "processor/citation-span-checker"
    inputs: { trace: "$.steps.build_index.output", config: {} }
  # --- concept graph over the indexed digest (issue ↔ testimony relations) ---
  - id: "concept_graph"
    kind: "processor"
    ref: "processor/concept-graph-extractor"
    inputs: { wiki_pages: "$.steps.build_index.output.text" }
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.build_index.output.text"
      rubric_ref: "rubric/legal-litigation-hold-quality-v1"
  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "deposition-page-line-index"
      applied_layers: ["pdf_ocr", "page_chunk", "local_embed", "hybrid_retrieve", "rerank", "injection_guard", "privacy", "index_harness", "citation_coverage", "citation_span_check", "concept_graph", "judge"]
success_criteria:
  - rubric: "rubric/legal-litigation-hold-quality-v1"
    threshold: 0.68
  - kind: "deterministic"
    label: "every index assertion is covered by a citation (no un-cited claim)"
    target: "$.steps.verify_citation_coverage.output.pass"
    op: "=="
    value: true
    severity: "critical"
  - kind: "deterministic"
    label: "every cited page:line resolves to a real transcript span"
    target: "$.steps.check_citations.output.result.pass"
    op: "=="
    value: true
    severity: "critical"
