id: "rule-pack/drug-interaction-severity"
type: rule-pack
version: "0.1.0"
name: "Drug interaction severity classifier (defensive; RxNorm / DrugBank-aligned)"
description: |
  Classifier rule pack for on-device medicine-label safety pipelines (e.g.
  MedLabel). Evaluates a pair (new_drug, existing_medication_list) against
  known interaction patterns drawn from public RxNorm interaction data and
  publicly documented DrugBank interaction categories. Emits a severity tier:

    none     — no known interaction in reference corpus.
    minor    — interaction documented but unlikely to cause harm at standard doses;
               note in warning.
    moderate — interaction may require dose adjustment or monitoring; recommend
               pharmacist review.
    severe   — contraindicated combination; high risk of adverse outcome; emit
               STOP override and mandatory "consult a doctor or pharmacist
               immediately" instruction.

  DEFENSIVE INGESTION CONTRACT:
  - This rule pack is a decision-support reference only. It does NOT replace
    pharmacist review, clinical judgement, or a regulated drug interaction
    database with full coverage.
  - Coverage is limited to the most clinically significant public-domain
    interaction pairs. Many drug combinations are NOT covered — absence of a
    finding is NOT a safety clearance.
  - Every pipeline consuming this rule pack MUST surface: "Drug interaction
    check is for information only. Always consult a qualified pharmacist or
    doctor before taking any medication. This tool does not provide medical
    advice."
  - Volatile facts (e.g., newly discovered interactions, updated dosing
    guidelines) require periodic corpus refresh. Mark freshness as 'volatile'.

  CAPABILITY LIFT (structural): a base language model asked to recall drug
  interactions will hallucinate or miss interactions because: (a) interaction
  data requires pairing across all n² combinations — a long-tail recall task
  the model cannot reliably perform; (b) the severe/contraindicated boundary
  must be deterministic, not sampled. This rule pack provides the lookup
  table outside the model. lift_reason: no_addressable_source (offline —
  cannot query RxNav API) + deterministic_guarantee (severity must be exact,
  not sampled); mechanism: context_length (full drug interaction matrix
  cannot fit in implicit model memory).

authors:
  - name: "Open Harness Hub contributors"
license: "Apache-2.0"
industry:   ["healthcare", "healthcare.pharmacy", "humanitarian"]
capability: ["classification", "safety_gating", "verification"]
modality:   ["structured", "text"]
lifecycle:  "experimental"
trust_boundary: "local"
freshness: "volatile"
created: "2026-05-28"
updated: "2026-05-28"

attribution:
  source_url: "https://www.nlm.nih.gov/research/umls/rxnorm/index.html"
  source_kind: "other"
  author: "RxNorm (NLM/NIH — public domain); DrugBank open data summary interactions (CC-BY-NC 4.0 for non-commercial research); MedLabel pattern (Gemma 4 Good Hackathon 2026)"
  license: "Apache-2.0"

links:
  source: "https://www.nlm.nih.gov/research/umls/rxnorm/index.html"
  additional: "https://go.drugbank.com/releases/latest"

tags:
  - "offline"
  - "on-device"
  - "drug-interaction"
  - "medicine-safety"
  - "rxnorm"
  - "drugbank"
  - "severity-classifier"
  - "deterministic"
  - "defensive"
  - "global-south"
  - "low-literacy"
  - "structural-lift"
  - "medlabel"

family: "classifier"
language: "en"
rules:
  - id: "severe_contraindicated_maoi_ssri"
    label: "MAOI + SSRI/SNRI (serotonin syndrome risk)"
    condition: "drug_class(new_drug) == 'maoi' AND any(drug_class(d) == 'ssri_snri' for d in existing_meds)"
    action: "assign_severity_severe"
    severity: "critical"
    category: "interaction.serotonin_syndrome"
    citation: "RxNorm interaction type: C1 contraindicated drug combination"

  - id: "severe_contraindicated_anticoagulant_nsaid"
    label: "Anticoagulant + NSAID (major bleeding risk)"
    condition: "drug_class(new_drug) == 'nsaid' AND any(drug_class(d) IN ['warfarin', 'doac'] for d in existing_meds)"
    action: "assign_severity_severe"
    severity: "critical"
    category: "interaction.major_bleed"
    citation: "RxNorm interaction type: C1; DrugBank category: major"

  - id: "severe_contraindicated_maoi_sympathomimetic"
    label: "MAOI + sympathomimetic (hypertensive crisis risk)"
    condition: "drug_class(new_drug) == 'sympathomimetic' AND any(drug_class(d) == 'maoi' for d in existing_meds)"
    action: "assign_severity_severe"
    severity: "critical"
    category: "interaction.hypertensive_crisis"
    citation: "RxNorm interaction type: C1 contraindicated drug combination"

  - id: "severe_qt_prolonging_combination"
    label: "Two QT-prolonging agents (torsades risk)"
    condition: "qt_risk(new_drug) == 'known' AND sum(qt_risk(d) == 'known' for d in existing_meds) >= 1"
    action: "assign_severity_severe"
    severity: "critical"
    category: "interaction.qt_prolongation"
    citation: "CredibleMeds AZCERT QTDrugs list (public reference)"

  - id: "moderate_statin_cyp3a4_inhibitor"
    label: "Statin + strong CYP3A4 inhibitor (myopathy risk)"
    condition: "drug_class(new_drug) == 'statin_cyp3a4_sensitive' AND any(cyp3a4_inhibitor_strength(d) == 'strong' for d in existing_meds)"
    action: "assign_severity_moderate"
    severity: "high"
    category: "interaction.myopathy_risk"
    citation: "FDA Drug Safety Communication on statin interactions"

  - id: "moderate_nsaid_antihypertensive"
    label: "NSAID + antihypertensive (BP elevation + renal risk)"
    condition: "drug_class(new_drug) == 'nsaid' AND any(drug_class(d) IN ['ace_inhibitor', 'arb', 'diuretic'] for d in existing_meds)"
    action: "assign_severity_moderate"
    severity: "medium"
    category: "interaction.bp_renal"
    citation: "DrugBank category: moderate"

  - id: "minor_noted"
    label: "Minor documented interaction — note only"
    condition: "interaction_known(new_drug, existing_meds) == 'minor'"
    action: "assign_severity_minor"
    severity: "low"
    category: "interaction.minor"

  - id: "no_interaction_found"
    label: "No interaction found in reference corpus"
    condition: "interaction_known(new_drug, existing_meds) == 'none'"
    action: "assign_severity_none"
    severity: "info"
    category: "interaction.none"
    note: "Absence of a finding is NOT a safety clearance — coverage is incomplete."
