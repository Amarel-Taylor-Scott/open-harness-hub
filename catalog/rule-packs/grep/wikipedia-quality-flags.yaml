id: rule-pack/grep-wikipedia-quality-flags
type: rule-pack
version: 0.1.0
name: Wikipedia article quality red-flag detectors (NPOV / V / OR / promo)
description: "Regex heuristics catching the most common WP:NPOV / WP:V / WP:OR /\n\
  WP:PROMO failure patterns in Wikipedia article text:\n\n - editorial voice (\"clearly\"\
  , \"obviously\", \"fortunately\")\n - weasel attributions (\"some say\", \"critics\
  \ argue\", \"many believe\")\n - peacock terms (\"renowned\", \"legendary\", \"\
  world-class\")\n - loaded labels (\"regime\", \"cult\", \"denialist\", \"terrorist\"\
  )\n - hedging markers (\"may\", \"could\", \"is said to\", \"reportedly\")\n - promotional\
  \ phrasing (\"award-winning\", \"pioneering\", \"industry-\n   leading\", \"first-of-its-kind\"\
  )\n - synth markers (sentence-initial \"Therefore\", \"Thus\", \"As a\n   result\"\
  \ without citation)\n - {{citation needed}} markers already present\n - primary-source\
  \ dump indicators (long quote blocks)\n - self-published source patterns (\"according\
  \ to [person's] blog\")\n\nFAST first-pass heuristics \u2014 they flag passages\
  \ for the\n`persona/wikipedia-quality-reviewer` to evaluate; they do not\ndetermine\
  \ policy violation.\n"
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- media
- media.editorial
- media.factcheck
capability:
- safety_gating
- classification
modality:
- text
lifecycle: experimental
trust_boundary: local
freshness: stable
tags:
- wikipedia
- npov
- weasel
- peacock
- promo
- synth
- grep
created: '2026-05-24'
updated: '2026-05-25'
family: grep
language: en
rules:
- id: editorial_voice_clearly
  pattern: (?i)\b(clearly|obviously|undoubtedly|certainly|of course|naturally)\b
  severity: medium
  category: npov.editorial_voice
- id: editorial_voice_value_judgment
  pattern: (?i)\b(fortunately|unfortunately|sadly|tragically|happily|importantly|crucially|notably)\b
  severity: medium
  category: npov.editorial_voice
- id: weasel_some_say
  pattern: (?i)\b(some|many|most|critics|supporters|experts|scholars|observers|commentators)
    (say|argue|believe|claim|maintain|contend|note|point out|have noted|have argued|have
    claimed|have suggested)\b
  severity: high
  category: npov.weasel_words
- id: weasel_it_is_said
  pattern: (?i)\b(it (is|was) (said|believed|claimed|reported|alleged|considered|thought)|widely
    (regarded|considered|believed)|often (called|considered|cited))\b
  severity: high
  category: npov.weasel_words
- id: peacock_renowned
  pattern: (?i)\b(renowned|legendary|world[- ]class|world[- ]famous|iconic|trailblazing|pioneering|visionary|cutting[-
    ]edge|state[- ]of[- ]the[- ]art|best[- ]in[- ]class|industry[- ]leading)\b
  severity: high
  category: promo.peacock_terms
- id: promo_award_winning
  pattern: (?i)\b(award[- ]winning|critically acclaimed|highly acclaimed|widely acclaimed|much[-
    ]praised|first[- ]of[- ]its[- ]kind|the only|the leading|the (top|premier|foremost)
    )\b
  severity: high
  category: promo.promotional_phrasing
- id: loaded_label_regime
  pattern: (?i)\b(regime|dictatorship|junta|cabal|clique)\b
  severity: medium
  category: npov.loaded_label
- id: loaded_label_terrorist
  pattern: (?i)\b(terrorist|terror group|jihadist|extremist|radical|militant|insurgent|rebel|freedom[-
    ]fighter|resistance)\b
  severity: medium
  category: npov.loaded_label
- id: loaded_label_cult
  pattern: (?i)\b(cult|sect|fringe|conspiracy theorist|denialist|denier|truther)\b
  severity: medium
  category: npov.loaded_label
- id: synth_therefore
  pattern: (?i)(?:^|\.\s+)(therefore|thus|consequently|as a result|hence|this (proves|shows|demonstrates|means))\b
  severity: high
  category: or.synth_marker
- id: synth_combination_however
  pattern: (?i)\bhowever,?\s+(this|these|that|those|the (above|preceding|foregoing))\s+(suggests?|implies?|indicates?|demonstrates?|proves?)\b
  severity: high
  category: or.synth_marker
- id: citation_needed_marker
  pattern: \{\{(citation needed|cn|fact|cite)\}\}
  severity: low
  category: v.citation_needed_present
- id: dead_link_marker
  pattern: \{\{(dead link|404)\}\}
  severity: medium
  category: v.dead_link_present
- id: self_published_blog
  pattern: (?i)\b(according to|as (stated|noted|written) on|via) (his|her|their|the
    [A-Z][a-zA-Z]+'s) (blog|personal website|tumblr|substack|medium post|twitter|facebook|instagram)\b
  severity: high
  category: rs.self_published_source
- id: predatory_journal_marker
  pattern: (?i)\b(omics|frontiers in [a-z]+|hindawi|sciencepg|scirp|world scientific
    news)\b
  severity: medium
  category: rs.predatory_publisher_to_verify
- id: press_release_as_source
  pattern: (?i)\b(press release|company announcement|corporate communications|company
    spokesperson) (states?|said|announced|claims?)\b
  severity: medium
  category: rs.press_release_as_source
- id: promo_we_us_our
  pattern: (?i)(?:^|\.\s+)(we|us|our|i|me|my)\b
  severity: medium
  category: promo.first_person_voice
- id: buzz_words_revolutionary
  pattern: (?i)\b(revolutionary|groundbreaking|game[- ]changing|disruptive|next[-
    ]generation|paradigm[- ]shifting|cutting[- ]edge|innovative|unique|exclusive|premium)\b
  severity: high
  category: promo.peacock_terms
- id: vague_attribution_studies_show
  pattern: (?i)\b(studies? (show|have shown|suggest|indicate|find)|research (shows?|indicates?|suggests?|finds?)|scientists
    (say|believe|claim|have found))\b(?!.{0,80}\[(?:cite|ref|source))
  severity: high
  category: v.vague_attribution_no_citation
- id: long_quote_block_marker
  pattern: (?:^|\n)>{1,3}\s+\S.{200,}
  severity: medium
  category: or.long_primary_quote
- id: wp_blp_contentious_unsourced
  pattern: (?i)\b(allegedly|reportedly|accused of|charged with|convicted of|sued for|investigated
    for|fired for|under investigation)\b
  severity: high
  category: blp.contentious_claim_check_sourcing
