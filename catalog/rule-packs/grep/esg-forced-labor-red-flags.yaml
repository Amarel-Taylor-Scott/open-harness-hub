id: rule-pack/grep-esg-forced-labor-red-flags
type: rule-pack
version: 0.2.0
name: ESG / forced-labor red-flag detectors (the 'S' of ESG)
description: "Heuristic regex detectors for the 11 ILO forced-labor indicators\n+\
  \ child labor + recruitment-fee abuse + tier-3/4 supply-chain\ntransparency gaps\
  \ + 12 high-risk corridors. Designed to be run\nover: supplier policy texts, supplier\
  \ self-assessments, worker\ngrievance transcripts (post-PII redaction), audit reports,\n\
  contract clauses.\n\nMulti-lingual core covering the major garment / electronics\
  \ /\nagriculture / construction labor corridors:\n - English (lead-company HQ language)\n\
  \ - \u7B80\u4F53\u4E2D\u6587 (China factories, Xinjiang corridor)\n - \u0939\u093F\
  \u0928\u094D\u0926\u0940 (India, Bangladesh garment, Sialkot sports goods)\n - \u09AC\
  \u09BE\u0982\u09B2\u09BE (Bangladesh garment, brick kilns)\n - \uD55C\uAD6D\uC5B4\
  \ (Korean supplier paperwork)\n - ti\u1EBFng Vi\u1EC7t (Vietnam garment + electronics)\n\
  \ - \u0E20\u0E32\u0E29\u0E32\u0E44\u0E17\u0E22 (Thailand seafood + electronics,\
  \ Mae Sot corridor)\n - bahasa Indonesia (palm oil + electronics)\n - Filipino /\
  \ Tagalog (BPO + electronics)\n - espa\xF1ol (Latin America agriculture, maquilas)\n\
  \ - portugu\xEAs (Brazil agriculture, beef supply chain)\n - fran\xE7ais (West Africa\
  \ cocoa)\n - \u0627\u0644\u0639\u0631\u0628\u064A\u0629 (Gulf states kafala system)\n\
  \nPair with `pipeline/supplier-policy-grading` (with the env + gov\npacks) for full\
  \ ESG coverage. These are FAST FIRST-PASS heuristics\nthat TRIGGER reviews \u2014\
  \ not authoritative determinations.\n"
authors:
- name: Open Harness Hub contributors
license: MIT
industry:
- esg
- supply_chain
- compliance
capability:
- safety_gating
- classification
modality:
- text
lifecycle: beta
trust_boundary: local
freshness: volatile
tags:
- esg
- ilo
- forced-labor
- modern-slavery
- supply-chain
- multilingual
created: '2026-05-19'
updated: '2026-05-25'
family: grep
rules:
- id: passport_retention
  pattern: "(?i)\\b(passport|id|identity document|document|\u8EAB\u4EFD\u8BC1|\u62A4\
    \u7167|\u092A\u093E\u0938\u092A\u094B\u0930\u094D\u091F|\u09AA\u09BE\u09B8\u09AA\
    \u09CB\u09B0\u09CD\u099F|\uC5EC\uAD8C|h\u1ED9 chi\u1EBFu|\u0E2B\u0E19\u0E31\u0E07\
    \u0E2A\u0E37\u0E2D\u0E40\u0E14\u0E34\u0E19\u0E17\u0E32\u0E07|paspor|pasaporte|passaporte|passeport|\u062C\
    \u0648\u0627\u0632)s?\\b.{0,40}?\\b(?:held by|retain(?:ed)? by|withheld|confiscat|kept\
    \ by|surrender(?:ed)? to|deposit(?:ed)? with|in safe[ -]?keeping|with (?:the )?(?:hr|manager|company|workshop|factory|employer)|on\
    \ file with)"
  severity: critical
  category: ilo.retention_of_identity_documents
- id: passport_retention_arabic_kafala
  pattern: "(?:\u0627\u062D\u062A\u062C\u0627\u0632 \u062C\u0648\u0627\u0632|\u0633\
    \u062D\u0628 \u062C\u0648\u0627\u0632|kafala|sponsorship system|tied to (?:sponsor|employer)|exit\
    \ visa.*sponsor|nitaqat)"
  severity: critical
  category: ilo.retention_of_identity_documents.kafala
- id: recruitment_fee_abuse
  pattern: (?i)(recruitment|placement|broker|agency|agent)[- ]?fee|deposit (?:before|prior
    to) (?:start|joining|employment)|charge.*(?:joining|placement)|debt.*recruit|recruitment[-
    ]?fee[- ]?repay
  severity: high
  category: ilo.debt_bondage
- id: wage_withholding
  pattern: (?i)wage(s)?\s+(?:held|withheld|not paid|delayed|deduct|garnish|advance.*recover)|pay.*withheld|salary.*deduct|deductions
    for\s+(?:housing|transport|recruitment|food|equipment)
  severity: high
  category: ilo.withholding_of_wages
- id: restricted_movement_dormitory
  pattern: (?i)(dormitory|hostel|compound|barrack)\b.{0,30}?(?:locked|guarded|fenced|restrict|exit
    forbidden|curfew|chained|fenced for safety)|cannot leave (?:the )?(?:dorm|hostel|compound|factory)|exit
    (?:must be|requires) approv|on[- ]?site\s+dormitory.{0,40}?(?:fenced|locked|guarded|restrict)
  severity: critical
  category: ilo.restriction_of_movement
- id: excessive_overtime
  pattern: (?i)(\d{1,3}|seventy|eighty|ninety|hundred)\s*(?:\+|plus)?\s*hour(s)?\s+(?:per|/)\s*(?:week|day)|overtime\s+(?:exceeds|over)\s+\d+|no
    day off|seven-day
  severity: medium
  category: ilo.excessive_overtime
- id: deceptive_recruitment
  pattern: (?i)(promised|told)\s+(?:job|salary|wage|role).*(?:different|other|not
    what)|misrepresent.*(?:job|wage|hours)|signed.*contract (?:in a |in another )(?:language|tongue)|did
    not understand (?:the )?contract
  severity: high
  category: ilo.deception
- id: child_labor
  pattern: "(?i)\\b(child|minor|under(-| )?age|under 1[5678]|under 16|under 18|14[-\
    \ ]year[- ]old|15[- ]year[- ]old)\\b.*(work|labour|labor|factory|shift|line)|\u7AE5\
    \u5DE5|\u092C\u093E\u0932[ -]?\u0936\u094D\u0930\u092E|\u09B6\u09BF\u09B6\u09C1\
    \u09B6\u09CD\u09B0\u09AE|trabajo infantil|trabalho infantil|travail des enfants|\u0639\
    \u0645\u0627\u0644\u0629 \u0627\u0644\u0623\u0637\u0641\u0627\u0644|tr\u1EBB em\
    \ l\xE0m vi\u1EC7c|\u0E41\u0E23\u0E07\u0E07\u0E32\u0E19\u0E40\u0E14\u0E47\u0E01"
  severity: critical
  category: ilo.child_labor
- id: threats_intimidation
  pattern: (?i)(threat|intimidat|coerc|punish|beat|hit|slap|abus).*(worker|labourer|laborer|staff|employee)|deport(ation)?\s+threat|family\s+(?:will
    be )?(?:threatened|harm)
  severity: critical
  category: ilo.intimidation_and_threats
- id: isolation_unfree_communication
  pattern: (?i)(?:no|forbidden|cannot|may not use|not allowed to use|prohibited from
    using) (?:phones?|mobiles?|cellphones?)|communication (?:monitor|control|restrict)|cannot
    contact (?:family|home|union)
  severity: high
  category: ilo.isolation
- id: abusive_living_conditions
  pattern: (?i)(unsanitary|unsafe|unventilated|no (?:water|toilet|food|heating|cooling)|infested|rat[-
    ]infested|cockroach)\s+(?:dormitory|hostel|housing|barrack|compound)
  severity: high
  category: ilo.abusive_working_and_living_conditions
- id: audit_gap_tier_3_4
  pattern: (?i)(unable to|cannot|could not)\s+(?:trace|verify|audit|confirm)\s+(?:them|tier[-
    ]?[34]|deep tier|sub[- ]?contract|sub[- ]?supplier|cotton (?:source|origin)|raw
    material (?:source|origin)|the source|the origin|grey cloth|raw material)
  severity: medium
  category: supply_chain.audit_gap_tier_3_4
- id: sourcing_high_risk_corridor
  pattern: "(?i)\\b(xinjiang|XUAR|\u65B0\u7586|uyghur|qaem shahr|sialkot|raipur|bhainsa|firozabad|mae\
    \ sot|prey veng|kafala|kefala|tema port|tarkwa|katanga|kolwezi|likasi|cox\\'s\
    \ bazar|ashulia|narayanganj|tampin|cameron highlands)\\b"
  severity: high
  category: supply_chain.high_risk_corridor
- id: uyghur_forced_labor_specific
  pattern: "(?i)(xpcc|xinjiang production and construction|aksu|hotan|kashgar|labor\
    \ transfer|poverty alleviation transfer|surplus labour|\u80BA\u5FC3\u75C5|UFLPA|withhold\
    \ release order|wro)"
  severity: critical
  category: supply_chain.uyghur_forced_labor
- id: cocoa_west_africa_child_labor
  pattern: "(?i)(cote d.ivoire|c\xF4te d.ivoire|ivory coast|ghana cocoa).*(?:child|minor|under[-\
    \ ]?age).*(?:harvest|farm|labor|labour|machete)|harkin[- ]?engel"
  severity: critical
  category: supply_chain.cocoa_child_labor
- id: seafood_thai_forced_labor
  pattern: (?i)(thai|thailand|samut sakhon|ranong).*(?:fishing|vessel|boat|trawler|peeling
    shed).*(?:migrant|burmese|cambodian|trapped|tied|locked)
  severity: critical
  category: supply_chain.thai_seafood
- id: abusive_overtime_consent
  pattern: (?i)(must|required to work|forced to work|compulsory)\s+(?:overtime|extra
    hours)(?!.{0,40}(voluntary|optional|opt[- ]?in|may decline))|cannot refuse (?:overtime|extra
    hours)|overtime\s+is\s+(?:mandatory|required|not voluntary)
  severity: high
  category: ilo.excessive_overtime.consent
- id: scale_expansion_v1_critical_signal_01
