id: rule-pack/grep-saas-launch-antipatterns
type: rule-pack
version: 0.1.0
name: SaaS launch landing-page anti-pattern detectors
description: 'Regex heuristics that catch the most common SaaS / micro-SaaS / AI-

  app launch landing-page failure patterns. Designed to be run over

  landing-page copy, tagline strings, feature lists, pricing pages,

  and "Show HN" / Product Hunt launch posts.


  Catches buzzword overload, generic ICP, hidden pricing, vague

  social proof, AI-as-tagline, broken proof-of-product, and the

  typical 2024-2026 AI-launch anti-patterns.


  FAST first-pass heuristics. Pair with `persona/saas-launch-critic`

  for full review.

  '
authors:
- name: Open Harness Hub contributors
license: MIT
industry:
- software
- creative
- cross_industry
capability:
- safety_gating
- classification
modality:
- text
lifecycle: experimental
trust_boundary: local
freshness: stable
tags:
- saas
- launch
- product-hunt
- marketing
- grep
- antipattern
created: '2026-05-24'
updated: '2026-05-25'
family: grep
language: en
rules:
- id: tagline_ai_powered
  pattern: (?i)\b(AI[- ]powered|powered by AI|AI[- ]driven|AI[- ]first|AI[- ]native|GPT[-
    ]powered|Claude[- ]powered|LLM[- ]powered)\b
  severity: high
  category: tagline.ai_as_value_prop
- id: tagline_revolutionize
  pattern: (?i)\b(revolutionize|transform|reimagine|reinvent|redefine|disrupt|democratize|supercharge|unlock|empower)\b\s+(your|the)?\s*(workflow|business|team|process|productivity|growth|operations)\b
  severity: high
  category: tagline.buzzword_verb
- id: tagline_platform_for
  pattern: (?i)\b(platform|solution|software|tool|app|service|system) for\s+(your|all|every|the
    modern|the future of)\b
  severity: medium
  category: tagline.vague_for_who
- id: icp_for_everyone
  pattern: (?i)\bfor (teams|businesses|companies|organizations|individuals) of (any|all|every)
    (size|industry|type)\b
  severity: high
  category: icp.no_specific_persona
- id: icp_kitchen_sink
  pattern: (?i)\bfor\s+(marketers?,?\s+){1,}(developers?|designers?|founders?|product
    managers?|sales|engineers?)\b
  severity: high
  category: icp.persona_kitchen_sink
- id: feature_smart_intelligent
  pattern: (?i)\b(smart|intelligent|automated|automatic|self[- ]driving|auto[- ])\s+\w{3,}\b
  severity: medium
  category: value_prop.capability_not_outcome
- id: feature_seamless_effortless
  pattern: (?i)\b(seamless|seamlessly|effortless|effortlessly|with one click|in seconds|zero[-
    ]friction|frictionless)\b
  severity: medium
  category: value_prop.handwave_adverb
- id: pricing_contact_us
  pattern: (?i)\bcontact\s+(us|sales|our team)\s+for\s+(pricing|a quote|details)\b
  severity: medium
  category: pricing.contact_sales_hidden
- id: pricing_starting_at
  pattern: (?i)\bstarting at\b(?!.{0,50}\$\d|\d+ ?\$)
  severity: medium
  category: pricing.starting_at_no_anchor
- id: pricing_no_dollar_sign
  pattern: (?i)\b(pricing|plans|tiers|subscriptions)\b(?!.{0,500}\$\d)
  severity: low
  category: pricing.no_visible_dollar_amount_check
- id: social_proof_trusted_by
  pattern: (?i)\b(trusted by|loved by|used by|join over) \d{1,3}[,.]?\d{0,3}\+? (?:companies|teams|users|customers|businesses|developers)\b
  severity: low
  category: social_proof.aggregate_number_verify_date
- id: social_proof_world_class
  pattern: (?i)\b(trusted by (the )?(world's|industry'?s)? (best|leading|top|fastest[-
    ]growing))\b
  severity: high
  category: social_proof.peacock
- id: demo_join_waitlist
  pattern: (?i)\b(join (the |our )?waitlist|join early access|get early access|request
    access|coming soon|launching soon)\b
  severity: high
  category: demo.waitlist_no_product
- id: demo_request_demo
  pattern: (?i)\b(request a demo|book a demo|schedule a demo|talk to (sales|us|an
    expert))\b
  severity: medium
  category: demo.no_self_serve
- id: comparison_only_competitor
  pattern: (?i)\b(the (only|first|best|leading|premier)|there'?s no other) (?:tool|product|platform|solution)\b
  severity: high
  category: competitive.competitive_blindness
- id: comparison_no_mention
  pattern: (?i)\b(vs\.?|versus|compared to|compare to|alternative to) ([A-Z][a-zA-Z]+)\b
  severity: low
  category: competitive.competitor_mention_verify
- id: buzz_word_revolutionary
  pattern: (?i)\b(revolutionary|groundbreaking|game[- ]changing|disruptive|next[-
    ]generation|paradigm[- ]shift|cutting[- ]edge|state[- ]of[- ]the[- ]art|world[-
    ]class)\b
  severity: high
  category: buzzword.peacock_terms
- id: buzz_word_modern
  pattern: (?i)\b(modern|future[- ]ready|future[- ]proof|next[- ]gen)\s+(workplace|company|team|business|workflow|stack)\b
  severity: medium
  category: buzzword.modern_workplace
- id: ai_specific_gpt_wrapper
  pattern: (?i)\b(built (on|with|using) (GPT[- ]?[345]|Claude|Gemini|Llama|Mistral))\b
  severity: high
  category: ai_specific.model_as_differentiator
- id: ai_specific_custom_gpt
  pattern: (?i)\b(custom GPT|GPT for [A-Z]|specialized GPT|fine[- ]tuned GPT)\b
  severity: high
  category: ai_specific.custom_gpt_wrapper
- id: ai_specific_no_accuracy
  pattern: (?i)\b(AI|GPT|LLM|model)\b(?!.{0,500}\b(accuracy|hallucination|evaluation|benchmark|F1|precision|recall|human[-
    ]in[- ]the[- ]loop|reviewed by)\b)
  severity: medium
  category: ai_specific.high_stakes_no_accuracy_disclosure
- id: onboarding_get_started_vague
  pattern: (?i)>\s*(get started|start now|try it free|sign up|register)\s*<
  severity: low
  category: onboarding.cta_no_promise
- id: trial_credit_card_required
  pattern: (?i)\b(\d{1,2})[- ]day (?:free )?trial\b.{0,150}\b(credit card|payment)
    (required|needed)\b
  severity: high
  category: trial.cc_required_friction
- id: guarantee_money_back
  pattern: (?i)\b(money[- ]back|satisfaction) guarantee\b(?!.{0,200}\b\d+ days?\b)
  severity: medium
  category: guarantee.terms_unclear
- id: vague_outcome_save_time
  pattern: (?i)\bsave (you )?(hours|time|countless hours|so much time)\b(?!.{0,80}\b\d+%?\b)
  severity: medium
  category: value_prop.vague_time_save_no_number
- id: vague_outcome_increase_x
  pattern: (?i)\b(increase|boost|grow|improve|enhance|maximize) (your )?(revenue|sales|conversions?|productivity|efficiency|ROI|growth)\b(?!.{0,80}\b\d+%?\b)
  severity: medium
  category: value_prop.vague_outcome_no_number
- id: scale_expansion_v1_critical_signal_01
