id: rule-pack/grep-greenwashing-flags
type: rule-pack
version: 0.1.0
name: Greenwashing & vague-sustainability claim detectors
description: "Regex heuristics flagging common greenwashing patterns in\nsustainability\
  \ disclosures, marketing materials, and product\nclaims. Aligned to:\n\n - UK CMA\
  \ Green Claims Code (2021)\n - EU Empowering Consumers for the Green Transition\
  \ Directive\n   (2024/825)\n - EU Green Claims Directive (proposal 2023/0085)\n\
  \ - FTC Green Guides (16 CFR Part 260)\n - Competition Bureau Canada Environmental\
  \ Claims Guidance\n - SBTi Net-Zero Standard\n\nCatches: vague aspirational language\
  \ without methodology, \"net-\nzero\" claims without scope/baseline/offset disclosure,\
  \ comparative\nclaims without benchmark, future-tense commitments without interim\n\
  milestone, cherry-picked baselines, outdated assurance, hidden\ntrade-offs, irrelevant\
  \ claims (e.g. \"CFC-free\" for a product class\nwhere CFCs were banned 30 years\
  \ ago).\n\nFAST first-pass heuristics. Pair with\n`persona/esg-pillar-analyst` for\
  \ framework-aligned interpretation.\n"
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- esg
- esg.csrd
- sustainability
- climate
- media
- media.factcheck
capability:
- safety_gating
- classification
modality:
- text
lifecycle: experimental
trust_boundary: local
freshness: stable
tags:
- esg
- greenwashing
- net-zero
- cma-green-claims
- ftc-green-guides
- grep
created: '2026-05-24'
updated: '2026-05-25'
family: grep
language: en
rules:
- id: net_zero_no_scope
  pattern: (?i)\b(net[- ]?zero|carbon[- ]?neutral|climate[- ]?neutral|carbon[- ]?negative|carbon[-
    ]?free)\b(?!.{0,400}\b(scope ?[123]|inventory|protocol|methodology|baseline|GHG
    protocol)\b)
  severity: critical
  category: greenwashing.net_zero_unsubstantiated
- id: net_zero_no_target_year
  pattern: (?i)\b(net[- ]?zero|carbon[- ]?neutral)\b(?!.{0,200}\b(20[2-7]\d|by 20[2-7]\d)\b)
  severity: high
  category: greenwashing.net_zero_no_target_year
- id: offset_no_disclosure
  pattern: (?i)\b(offset|carbon credit|VCM|voluntary carbon market|nature-based solutions|REDD\+)\b(?!.{0,300}\b(verified|VCS|gold
    standard|ACR|CAR|methodology|vintage|registry)\b)
  severity: high
  category: greenwashing.offset_unsubstantiated
- id: vague_eco_friendly
  pattern: (?i)\b(eco[- ]?friendly|environmentally[- ]friendly|green|sustainable|natural|earth[-
    ]friendly|planet[- ]friendly|nature[- ]friendly|kind to (the )?(earth|planet|environment))\b(?!.{0,200}\b(certified|standard|methodology|criteria|verified)\b)
  severity: high
  category: greenwashing.vague_aspirational
- id: future_commit_no_milestone
  pattern: (?i)\bby 20(4|5|6)\d\b(?!.{0,300}\b(interim|milestone|20[23]\d (target|goal)|annual
    reduction)\b)
  severity: high
  category: greenwashing.distant_target_no_interim
- id: best_in_class_no_benchmark
  pattern: (?i)\b(best[- ]in[- ]class|industry[- ]leading|world[- ]leading|category[-
    ]leader|gold standard|the (most|cleanest|greenest) )\b(?!.{0,200}\b(benchmark|peer|comparison|ranked|rated)\b)
  severity: high
  category: greenwashing.comparative_no_benchmark
- id: cherry_picked_baseline
  pattern: (?i)\b(reduced?|cut|lowered)\b.{0,80}\bby \d{1,3}%\b(?!.{0,200}\b(baseline|since
    20[01]\d|from 20[01]\d)\b)
  severity: medium
  category: greenwashing.no_baseline
- id: outdated_assurance
  pattern: (?i)\b(audited|assured|verified|certified) (?:by [A-Z][a-zA-Z& ]+ )?(in
    |as of )?(20(1\d|20|21))\b
  severity: high
  category: greenwashing.outdated_assurance
- id: no_assurance_marker
  pattern: (?i)\b(self[- ]reported|self[- ]declared|company-reported|management estimates?)\b
  severity: medium
  category: esg.no_third_party_assurance
- id: scope3_excluded
  pattern: (?i)\bscope\s*3\b.{0,200}\b(excluded|not included|out of scope|de minimis|immaterial)\b
  severity: high
  category: esg.scope3_exclusion_check_materiality
- id: irrelevant_claim_cfc
  pattern: (?i)\b(CFC[- ]?free|chlorofluorocarbon[- ]?free|ozone[- ]friendly)\b
  severity: medium
  category: greenwashing.irrelevant_claim
- id: hidden_tradeoff_palm_oil
  pattern: (?i)\b(palm oil|palm kernel oil|elaeis)\b(?!.{0,300}\b(RSPO|certified sustainable|deforestation[-
    ]free|EUDR|segregated|mass balance)\b)
  severity: high
  category: greenwashing.hidden_tradeoff_palm_oil
- id: renewable_no_RECs
  pattern: (?i)\b(100%|fully|completely) renewable\b(?!.{0,200}\b(REC|guarantee of
    origin|GO|PPA|directly procured|certified)\b)
  severity: high
  category: greenwashing.renewable_no_provenance
- id: biodegradable_no_standard
  pattern: (?i)\b(biodegradable|compostable|recyclable|reusable)\b(?!.{0,200}\b(ASTM|D6400|D6868|EN
    13432|TUV OK compost|how2recycle|standard|certified)\b)
  severity: medium
  category: greenwashing.recyclability_no_standard
- id: diverse_no_metric
  pattern: (?i)\b(diverse|inclusive|equitable|representative) (workforce|leadership|board|team)\b(?!.{0,200}\b(\d{1,3}%|percent|ratio|EEO-1|gender
    pay gap)\b)
  severity: medium
  category: greenwashing.vague_DEI_claim
- id: human_rights_no_framework
  pattern: (?i)\b(respect (for )?human rights|human rights (policy|commitment|programme))\b(?!.{0,300}\b(UNGP|UN
    Guiding Principles|OECD MNE|ILO|due diligence|salience assessment|grievance mechanism)\b)
  severity: medium
  category: greenwashing.vague_human_rights
- id: sbti_no_validation
  pattern: "(?i)\\b(science[- ]based target|SBTi[- ]aligned|1\\.5\xB0C aligned|Paris[-\
    \ ]aligned)\\b(?!.{0,200}\\b(validated|approved|registered|committed to|signatory)\\\
    b)"
  severity: high
  category: greenwashing.sbti_unvalidated
