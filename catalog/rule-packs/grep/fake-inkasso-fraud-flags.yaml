id: rule-pack/grep-fake-inkasso-fraud-flags
type: rule-pack
version: 0.1.0
name: Fake-Inkasso fraud-detection GREP pack (Verbraucherzentrale 10-indicator taxonomy)
description: "GREP detectors for the 10 Verbraucherzentrale Fake-Inkasso\nindicators.\
  \ Used by `pipeline/bill-info-extract-fraud-detect-recommend`\nas a deterministic\
  \ FIRST PASS before the LLM-based fraud-detect\ncall \u2014 fires hard-rule indicators\
  \ that the LLM call then weights\n+ classifies.\n\nSourced from Sviatoslav Grabovsky's\
  \ Bill_info AI (Bill_info AI on\nHugging Face Spaces) which uses these indicators\
  \ across both the\nGemma 4 26B fraud-detect call AND a deterministic business_rules\n\
  layer.\n"
authors:
- name: Open Harness Hub contributors (port of Bill_info AI)
license: MIT
industry:
- bureaucracy_translation
- bureaucracy_translation.fraud_screening
- humanitarian
- humanitarian.refugee
capability:
- safety_gating
- classification
modality:
- text
lifecycle: beta
trust_boundary: local
freshness: volatile
tags:
- fake-inkasso
- verbraucherzentrale
- fraud-detection
- germany
- refugee-protection
created: '2026-05-21'
updated: '2026-05-25'
family: grep
rules:
- id: foreign_iban_non_dach
  pattern: (?i)\b(?:IBAN[:\s]*)?(?:PL|CZ|SK|LV|LT|EE|HU|RO|BG|HR|SI|GR|MT|CY|TR|UA|RU|BY|RS|MK|AL|BA|ME|MD)\d{2}\s*[A-Z0-9
    ]{8,30}
  severity: critical
  category: fake_inkasso.iban.foreign_non_dach
- id: private_person_recipient
  pattern: "(?i)(?:empf\xE4nger|recipient|payee|payment\\s+to)[:\\s]+(?:herr|frau|mr|mrs|ms)\\\
    s+[A-Z\xC4\xD6\xDC][a-z\xE4\xF6\xFC\xDF]+\\s+[A-Z\xC4\xD6\xDC][a-z\xE4\xF6\xFC\
    \xDF]+(?!.{0,200}(?:gmbh|ag|kg|ohg|ug|gbr|inkasso\\s+(?:gmbh|ag|company|firma)))"
  severity: critical
  category: fake_inkasso.recipient.private_person
- id: legal_threats_first_letter
  pattern: "(?i)(?:gerichtsvollzieher|gerichtliche\\s+schritte|zwangsvollstreckung|schufa[-\
    \ ]?eintrag|haftbefehl|pf\xE4ndung)(?!.{0,300}(?:zweite\\s+mahnung|letzte\\s+mahnung|nach\\\
    s+der\\s+dritten|mahnbescheid\\s+vom))"
  severity: critical
  category: fake_inkasso.legal_threats.no_prior_mahnung
- id: extreme_deadline_24_72h
  pattern: "(?i)(?:zahlungsfrist|frist|deadline|bis\\s+sp\xE4testens)[:\\s]+(?:24|48|72)\\\
    s*(?:stunden|hours|h\\b)|innerhalb\\s+(?:von\\s+)?(?:24|48|72)\\s*(?:stunden|hours)"
  severity: critical
  category: fake_inkasso.deadline.extreme_24_72h
- id: missing_handelsregister
  pattern: "(?i)inkasso(?:firma|gmbh|ag|dienst)[\\s\\S]{0,500}?(?!.{0,400}(?:hrb\\\
    s*\\d+|hra\\s*\\d+|handelsregister|amtsgericht\\s+\\w+|rdg[- ]?registriert|aufsichtsbeh\xF6\
    rde))"
  severity: medium
  category: fake_inkasso.missing_handelsregister
- id: unclear_creditor
  pattern: "(?i)(?:gl\xE4ubiger|creditor|original[- ]?creditor)[:\\s]*(?:n[\\.\\/]?a|unbekannt|nicht\\\
    s+angegeben|\\s*[-_]+\\s*$|\\s*\\?+\\s*$)"
  severity: medium
  category: fake_inkasso.unclear_creditor
- id: dubious_excess_fees
  pattern: "(?i)(?:bearbeitungsgeb\xFChr|express[- ]?versand|express[- ]?versandkosten|sondergeb\xFC\
    hr|expressbearbeitung|sofort[- ]?geb\xFChr)[:\\s]+(?:\u20AC|EUR)?\\s*(?:[1-9]\\\
    d{2,}|[2-9]\\d{1})"
  severity: medium
  category: fake_inkasso.dubious_excess_fees
- id: phantom_company_name
  pattern: (?i)(?:forderungsmanagement|inkassodienst|rechtsabteilung|forderungsstelle|mahnstelle)(?!\s+\w+\s+(?:gmbh|ag|kg))
  severity: medium
  category: fake_inkasso.phantom_company_name
- id: premium_phone_number
  pattern: (?i)(?:tel(?:efon)?|phone|hotline)[:\s]+(?:0?900\s?\d+|0?180\s?\d+|\+49[-
    ]?900[- ]?\d+)
  severity: medium
  category: fake_inkasso.premium_phone
- id: letzte_mahnung_first_letter
  pattern: "(?i)\\bletzte\\s+mahnung\\b|\\bfinal\\s+(?:reminder|notice)\\b|\\bsofortige\\\
    s+(?:zahlung|ma\xDFnahmen)\\b"
  severity: medium
  category: fake_inkasso.pressure_tactics
- id: missing_aufsichtsbehoerde
  pattern: "(?i)inkasso[\\s\\S]{0,500}?(?!.{0,400}aufsichtsbeh\xF6rde\\s+(?:oberlandesgericht|olg|landesjustiz))"
  severity: low
  category: fake_inkasso.missing_aufsichtsbehoerde
