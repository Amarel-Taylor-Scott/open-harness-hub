id: rule-pack/grep-data-breach-notification-flags
type: rule-pack
version: 0.1.0
name: Data Breach Notification grep flags
description: Ten local triage detectors for data breach notification packets.
authors:
- name: Open Harness Hub contributors
license: MIT
industry:
- privacy
- security.defensive
capability:
- safety_gating
- classification
modality:
- text
