description: "Evidence-first persona for lab result critical alert packet review."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["healthcare.clinical", "healthcare.public_health"]
capability: ["evaluation", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
