version: "0.1.0"
name: "Data Quality Incident Analyst"
description: "Evidence-first persona for data quality incident review."
authors: [{ name: "Open Harness Hub contributors" }]
license: "MIT"
industry: ["data_governance", "data_governance.quality"]
capability: ["evaluation", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["data-quality-incident", "use-case-expansion"]
