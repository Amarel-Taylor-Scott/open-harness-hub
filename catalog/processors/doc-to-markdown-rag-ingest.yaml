license: "MIT"
industry:   ["ai", "cross_industry", "education", "legal"]
capability: ["extraction", "research", "retrieval", "format_conversion"]
modality:   ["text", "structured"]
lifecycle:  "experimental"
lifecycle_position: "pre_api"
trust_boundary: "local"
created: "2026-05-28"
updated: "2026-05-28"

attribution:
  source_url: "https://github.com/google-gemini/gemma-cookbook"
  source_kind: "github"
  author: "Trove no-code local agentic gem framework (Gemma community); PyMuPDF (AGPL-3.0 / commercial dual license); python-docx (MIT)"
  license: "MIT"

tags:
  - "on-device"
  - "offline"
  - "rag"
  - "document-ingest"
  - "markdown"
  - "pdf"
  - "docx"
  - "auto-summary"
  - "chunking"
  - "bm25"
  - "per-task-scope"
  - "trove"
  - "no-code"
