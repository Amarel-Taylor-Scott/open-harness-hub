process_kind: "extract.doc_to_rag"
deterministic: false
idempotent: true
streaming: false
latency_budget_ms: 60000

inputs:
  - name: "document_path"
    type: "string"
  - name: "task_id"
    type: "string"
  - name: "chunk_size_tokens"
    type: "integer"
  - name: "chunk_stride_tokens"
    type: "integer"
  - name: "model_adapter_ref"
    type: "string"
  - name: "dense_embed"
    type: "boolean"
  - name: "embedding_adapter_ref"
    type: "string"
outputs:
  - name: "markdown_path"
    type: "string"
  - name: "summary"
    type: "string"
  - name: "chunk_count"
    type: "integer"
  - name: "scope_id"
    type: "string"
  - name: "index_record_id"
    type: "string"

side_effects: "write"
on_error: "raise"

implementations:
  - kind: "callable"
    path: "scripts.processors.doc_to_markdown_rag_ingest.run"
    language: "python"
