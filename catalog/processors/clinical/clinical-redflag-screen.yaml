- freezable
- governed
created: '2026-05-29'
updated: '2026-05-29'
process_kind: gate.clinical_redflag
deterministic: true
idempotent: true
streaming: false
inputs:
- name: note
  type: object
- name: vitals
  type: object
outputs:
