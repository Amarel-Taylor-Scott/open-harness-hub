id: processor/clinical-abstention-gate
type: processor
version: 0.1.0
name: Clinical abstention gate
description: 'Block a clinical answer when the documented/retrieved evidence is insufficient to support
  it, routing to ''insufficient evidence — clinician review'' instead of guessing. The cite-or-abstain
  contract that converts retrieval into safe, governed clinical decision-support.


  Clinical decision-SUPPORT component — DEFENSIVE only: grounds on a governed corpus, fires a deterministic
  gate, and/or routes to a clinician; never autonomous medical advice. Lift is measured at the pipeline
  level.'
authors:
- name: Open Harness Hub contributors
license: MIT
industry:
- healthcare
capability:
- safety_gating
- governance
modality:
- text
- structured
lifecycle: experimental
trust_boundary: local
tags:
- clinical
- decision-support
- deterministic-gate
- freezable
- governed
created: '2026-05-29'
updated: '2026-05-29'
process_kind: gate.evidence_sufficiency
deterministic: true
idempotent: true
streaming: false
inputs:
- name: answer
  type: object
- name: evidence
  type: object
outputs:
- name: sufficient
  type: object
- name: reason
  type: object
side_effects: none
on_error: raise
implementations:
- kind: callable
  path: scripts.processors.clinical.clinical_abstention_gate.run
  language: python
