id: processor/rrf-fusion
type: processor
version: 0.1.0
name: Reciprocal Rank Fusion
description: 'Merge multiple retrieval legs by reciprocal rank (k≈60) — no score normalization, robust
  across incompatible BM25/cosine scales, no labels needed. The default fusion; switch to convex combination
  once ≥50 labeled query-doc pairs exist. Deterministic (freezable).


  Retrieval/prompt taxonomy step R3 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- cross_industry
- ai
capability:
- reranking
modality:
- text
- structured
lifecycle: experimental
trust_boundary: local
tags:
- retrieval-taxonomy
- step-r3
- rag
- freezable
created: '2026-05-29'
updated: '2026-05-29'
process_kind: rerank.reciprocal_rank_fusion
deterministic: true
idempotent: true
streaming: false
inputs:
- name: ranked_lists
  type: object
- name: k
  type: object
outputs:
- name: fused_list
  type: object
side_effects: none
on_error: raise
implementations:
- kind: callable
  path: scripts.processors.retrieval.rrf_fusion.run
  language: python
