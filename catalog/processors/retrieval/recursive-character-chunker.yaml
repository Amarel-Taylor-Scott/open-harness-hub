id: processor/recursive-character-chunker
type: processor
version: 0.1.0
name: Recursive-character chunker
description: 'Split a document along a separator hierarchy (paragraph→sentence→word) into ~256–512-token
  chunks with ~10–15% overlap. The robust general-purpose default; respects structure better than fixed-size,
  no model cost (freezable).


  Retrieval/prompt taxonomy step R2 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- cross_industry
- ai
capability:
- format_conversion
modality:
- text
- structured
lifecycle: experimental
trust_boundary: local
tags:
- retrieval-taxonomy
- step-r2
- rag
- freezable
created: '2026-05-29'
updated: '2026-05-29'
process_kind: chunk.recursive
deterministic: true
idempotent: true
streaming: false
inputs:
- name: document
  type: object
- name: chunk_size
  type: object
- name: overlap
  type: object
outputs:
- name: chunks
  type: object
side_effects: none
on_error: raise
implementations:
- kind: callable
  path: scripts.processors.retrieval.recursive_character_chunker.run
  language: python
