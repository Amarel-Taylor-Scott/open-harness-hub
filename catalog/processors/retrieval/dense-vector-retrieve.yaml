- rag
- model-assisted
created: '2026-05-29'
updated: '2026-05-29'
process_kind: retrieve.dense_vector
deterministic: false
idempotent: true
streaming: false
inputs:
- name: query
  type: object
- name: index
  type: object
- name: top_k
  type: object
outputs:
- name: candidates
  type: object
