id: processor/dense-vector-retrieve
type: processor
version: 0.1.0
name: Dense bi-encoder retrieve (ANN)
description: 'Embed the query and ANN-search (HNSW/IVF) a dense vector index for paraphrase/synonymy recall
  BM25 misses. Sub-ms semantic recall; single-vector bottleneck on exact tokens. Pair with a lexical leg
  (hybrid).


  Retrieval/prompt taxonomy step R1 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
