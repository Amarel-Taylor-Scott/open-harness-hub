id: processor/cross-encoder-reranker
type: processor
version: 0.1.0
name: Cross-encoder reranker
description: 'Jointly encode query+doc to rescore the fused top-50→100 and keep the top-5 — the single
  highest-precision lever in the pipeline (~40%+ recall@k / MRR lift); cost is bounded by candidate count,
  not corpus size. Open-weight (bge-reranker-v2-m3) is commercial-safe.


  Retrieval/prompt taxonomy step R3 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
authors:
- name: Open Harness Hub contributors
license: MIT
industry:
- cross_industry
- ai
capability:
- reranking
modality:
- text
- structured
lifecycle: experimental
trust_boundary: local
tags:
- retrieval-taxonomy
- step-r3
- rag
- model-assisted
created: '2026-05-29'
updated: '2026-05-29'
process_kind: rerank.cross_encoder
deterministic: false
idempotent: true
streaming: false
inputs:
- name: query
  type: object
- name: candidates
  type: object
- name: top_n
  type: object
outputs:
- name: reranked
  type: object
side_effects: read
on_error: raise
implementations:
- kind: callable
  path: scripts.processors.retrieval.cross_encoder_reranker.run
  language: python
