id: "processor/semantic-dedup"
type: processor
version: "0.1.0"
name: "Semantic dedup against live catalog (SimHash + Jaccard)"
description: |
  Cheap, no-LLM dedup pass that catches near-duplicates of existing
  live-catalog components before sending a draft to the LLM judge.

  Two complementary signals:
   - SimHash on (name + description) shingles — 64-bit fingerprint; Hamming
     distance ≤ 3 = "likely duplicate."
   - Jaccard on (industry ∪ capability ∪ modality ∪ tags ∪ slug tokens) —
     structural fit; ≥ 0.60 = "likely duplicate."

  BOTH must agree for `is_duplicate: true`. If only one fires, returns
  `is_near_match: true` for curator review.

  Critical at 2000x scale: without it, the same Wikipedia articles
  (re-walked at different depths, in different languages, from different
  categories) collapse into thousands of redundant drafts.
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry:   ["software", "ai", "cross_industry"]
capability: ["classification", "verification"]
modality:   ["text", "structured"]
lifecycle:  "experimental"
trust_boundary: "local"
tags: ["meta", "factory", "dedup", "simhash", "jaccard", "cheap"]
created: "2026-05-24"
updated: "2026-05-24"

process_kind: "verify.semantic_dedup"
deterministic: true
idempotent: true
streaming: false
latency_budget_ms: 500

inputs:
  - name: "draft_manifest"
    type: "object"
  - name: "live_corpus"
    type: "object[]"
  - name: "only_same_type"
    type: "boolean"
outputs:
  - name: "is_duplicate"
    type: "boolean"
  - name: "is_near_match"
    type: "boolean"
  - name: "best_match_id"
    type: "string"
  - name: "best_match_hamming"
    type: "integer"
  - name: "best_match_jaccard"
    type: "number"
  - name: "top_5"
    type: "object[]"

side_effects: "read"
on_error: "raise"

implementations:
  - kind: "callable"
    path: "scripts.processors.semantic_dedup.run"
    language: "python"
