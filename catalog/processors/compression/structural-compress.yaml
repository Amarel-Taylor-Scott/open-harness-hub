id: processor/structural-compress
type: processor
version: 0.1.0
name: Structural compression (Tree-sitter)
description: Strip function/method bodies, keep signatures + structure (Repomix / Tree-sitter style) —
  ~70% token reduction on code, structure-lossless. The 'compressed' tier's structural flavor; pairs with
  the learned flavor (retrieval/llmlingua-compress). Ships a measured fidelity delta (verify/compression-fidelity-check).
