id: "processor/offline-fallback-gate"
type: processor
version: "0.1.0"
name: "Offline fallback gate (connectivity check → local Knowledge Corpus)"
description: |
  If-Statement / gate processor: checks network connectivity (DNS probe +
  optional latency ping) and, when offline, rewrites the pipeline step to
  consume a local Knowledge Corpus instead of making a cloud API call.
  Emits a gate_decision (offline | online) so downstream processors and
  audit logs know which branch executed.

  CAPABILITY LIFT (structural): this is the architectural gate that makes
  any pipeline offline-capable. Without it, connectivity loss silently
  fails the whole pipeline. The gate enforces an explicit, verifiable
  branch rather than letting a timeout propagate. lift_reason:
  no_addressable_source (cloud endpoint unavailable when gate fires);
  deterministic_guarantee (the decision is a deterministic connectivity
  check, not an LLM sample).

authors:
  - name: "Open Harness Hub contributors"
license: "Apache-2.0"
industry:   ["ai", "education", "healthcare.public_health", "cross_industry"]
capability: ["routing", "safety_gating", "governance"]
modality:   ["structured", "text"]
lifecycle:  "experimental"
lifecycle_position: "pre_api"
trust_boundary: "local"
created: "2026-05-28"
updated: "2026-05-28"

attribution:
  source_url: "https://github.com/google-gemini/gemma-cookbook"
  source_kind: "github"
  author: "Gemma offline-mode demos (Google Gemma community)"
  license: "Apache-2.0"

tags:
  - "offline"
  - "gate"
  - "if-statement"
  - "fallback"
  - "connectivity"
  - "local-corpus"
  - "structural-lift"
  - "deterministic"

process_kind: "gate.cost_ceiling"
deterministic: true
idempotent: true
streaming: false
latency_budget_ms: 200

inputs:
  - name: "probe_host"
    type: "string"
  - name: "probe_timeout_ms"
    type: "integer"
  - name: "online_step_ref"
    type: "string"
  - name: "offline_corpus_ref"
    type: "string"
outputs:
  - name: "gate_decision"
    type: "string"
  - name: "selected_step_ref"
    type: "string"
  - name: "latency_ms"
    type: "integer"
  - name: "probe_host_reached"
    type: "boolean"

side_effects: "read"
on_error: "fallback"
retry:
  max_attempts: 1
  backoff: "none"

implementations:
  - kind: "callable"
    path: "scripts.processors.offline_fallback_gate.run"
    language: "python"
