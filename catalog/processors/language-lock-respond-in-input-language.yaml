    type: "string"
  - name: "system_prompt"
    type: "string"
  - name: "detection_confidence_threshold"
    type: "number"
  - name: "fallback_language"
    type: "string"
outputs:
  - name: "detected_language"
    type: "string"
  - name: "detection_confidence"
    type: "number"
  - name: "patched_system_prompt"
    type: "string"
  - name: "lock_applied"
    type: "boolean"

side_effects: "none"
on_error: "fallback"

