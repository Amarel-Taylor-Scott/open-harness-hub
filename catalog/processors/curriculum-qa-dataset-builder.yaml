process_kind: "extract.pdf_to_dataset"
deterministic: false
idempotent: true
streaming: false
latency_budget_ms: 120000

inputs:
  - name: "pdf_path"
    type: "string"
  - name: "language_hint"
    type: "string"
  - name: "chunk_size_tokens"
    type: "integer"
  - name: "chunk_stride_tokens"
    type: "integer"
  - name: "max_qa_pairs_per_chunk"
    type: "integer"
  - name: "model_adapter_ref"
    type: "string"
  - name: "output_path"
    type: "string"
outputs:
  - name: "output_jsonl_path"
    type: "string"
  - name: "total_chunks"
    type: "integer"
  - name: "total_qa_pairs"
    type: "integer"
  - name: "dropped_pairs"
    type: "integer"
  - name: "coverage_pages"
    type: "integer"

side_effects: "write"
on_error: "raise"

implementations:
  - kind: "callable"
    path: "scripts.processors.curriculum_qa_dataset_builder.run"
    language: "python"
