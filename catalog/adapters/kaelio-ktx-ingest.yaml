capability: ["format_conversion", "extraction", "retrieval", "governance"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "external"
tags: ["candidate", "wrap", "kaelio", "ktx", "semantic-layer", "context-files"]
created: "2026-06-11"
updated: "2026-06-11"

transport: "callable"
capabilities: ["warehouse_mapping", "semantic_layer_build", "wiki_ingestion", "reconciliation_reports"]
auth: "byok"
cost_model: "self_hosted"
endpoint: "local://ktx/ingest"
default_model: "none"

provenance:
