id: "adapter/deepeval-metrics"
type: adapter
version: "0.1.0"
name: "DeepEval metrics library (eval Actions source)"
description: |
  Wraps Confident AI's DeepEval (YC W25, OSS) as a source of
  candidate eval Actions: G-Eval, faithfulness, answer relevancy,
  hallucination, RAGAS-style metrics — runnable as harness steps. LLM-judged
  metrics are themselves model outputs: scores are recorded as candidate
  signals with judge provenance, never as the promotion gate's truth —
  deterministic gates own promotion.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "cross_industry"]
capability: ["evaluation"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "external"
tags: ["candidate", "wrap", "deepeval", "evals", "metrics"]
created: "2026-06-11"
updated: "2026-06-11"

transport: "callable"
capabilities: ["llm_judged_metrics", "rag_metrics", "test_runner"]
auth: "byok"
cost_model: "self_hosted"
endpoint: "pypi://deepeval"
default_model: "none"

provenance:
  collected_through: "yc-context-landscape research 2026-06-11 (4-agent verified sweep)"
  sources:
    - "docs/strategy/yc-context-landscape-2026-06.md"
