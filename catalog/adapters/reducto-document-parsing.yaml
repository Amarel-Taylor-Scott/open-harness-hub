name: "Reducto document intelligence (regulated-document parsing)"
description: |
  Wraps Reducto (YC W24, $108M raised, Fortune-10 finance/healthcare
  deployments) as a parsing-provider candidate one step upstream of the
  verification rail: complex PDFs/scans/tables → structured extractions.
  They parse; Baltor corroborates, signs, and manages fact lifecycle.
  Competitive watch: a future Reducto "verified extraction" feature would
  collide — differentiation is the portable receipt + multi-source
  corroboration, not the parse.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
