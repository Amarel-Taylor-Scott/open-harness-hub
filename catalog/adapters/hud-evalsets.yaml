name: "Hud computer-use evalsets (environment/harness source)"
description: |
  Wraps Hud (YC W25) public evalsets and RL environments for
  browser/computer-use agents as candidate harness/environment sources for
  the registry. Environments are sandboxed candidates behind ports (the
  rl-env-synthesis pattern); results ingest as evidence with environment
  version hashes, never as direct promotion truth.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
