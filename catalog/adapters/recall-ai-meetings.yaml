id: "adapter/recall-ai-meetings"
type: adapter
version: "0.1.0"
name: "Recall.ai meeting recordings API (conversational context source)"
description: |
  Wraps Recall.ai (YC W20, 3,000+ companies) as a conversational-
  context SOURCE candidate: meeting bots → recordings/transcripts/metadata
  via one API. Transcripts enter as source_records under consent/provenance
  governance; PII review queues are mandatory before any downstream use
  (sensitive-domain law).
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
