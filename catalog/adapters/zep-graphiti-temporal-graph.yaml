id: "adapter/zep-graphiti-temporal-graph"
type: adapter
version: "0.1.0"
name: "Zep Graphiti temporal knowledge graph (fact validity windows)"
description: |
  Wraps Graphiti (Zep, YC W24) as a candidate temporal-graph memory
  backend: bi-temporal fact tracking — when a fact became valid and when it
  was invalidated — is the closest external mechanism to Baltor's CDC/fact-
  lifecycle rail. Upstream invalidates facts heuristically from new data;
  under Baltor the promote/revoke decision stays with the governed
  verification rail, and Graphiti is storage + candidate signals only.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "cross_industry"]
capability: ["memory", "extraction", "retrieval"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "external"
tags: ["candidate", "wrap", "zep", "graphiti", "temporal", "memory"]
created: "2026-06-11"
updated: "2026-06-11"

transport: "callable"
capabilities: ["temporal_facts", "entity_graph", "hybrid_retrieval"]
auth: "byok"
cost_model: "self_hosted"
endpoint: "pypi://graphiti-core"
default_model: "none"

