id: "pipeline/ph-str-disposition-screening"
type: pipeline
version: "0.1.0"
name: "PH suspicious-transaction disposition screening (sanctions-first)"
description: |
  Walk a Philippine AML alert (transaction bundle + customer profile +
  counterparties) through a sanctions-first gate, then deterministic
  FATF/AMLA typology scoring, then a cited disposition recommendation —
  close, monitor, enhanced due diligence, STR-style DRAFT, or sanctions
  escalation. It NEVER files an STR and never asserts intent; it produces
  an analyst-ready, cited recommendation with the matched indicators.

  Negative space: a bare model, given an alert, fluently invents a
  disposition with no provenance, no sanctions check, and no typology
  evidence — exactly the failure that makes "just ask the model"
  unsafe for AML. Here the sanctions check is a deterministic tool that
  short-circuits to escalation on a hit; the typology evidence is a
  deterministic classifier; the model only composes the cited narrative
  draft under a cite-or-abstain contract. The sanctions-first ordering
  (a hit halts BEFORE any disposition is drafted) is the control a base
  model has no notion of.

  Reference / educational only — synthetic alerts, governed corpora; a
  drafting aid for a BSA/compliance officer, not a filing. Bundle:
  Agentic/governed review — sanctions-first Conditional gate + cited
  model call + deterministic verify.
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["finance", "finance.aml", "finance.kyc"]
capability: ["classification", "verification", "retrieval", "safety_gating", "governance"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "cross_cutting.alert_review"
freshness: "volatile"
tags: ["ph-aml", "str", "sar-style-draft", "sanctions-first", "fatf-typologies", "disposition", "negative-space"]
created: "2026-05-29"
updated: "2026-05-29"

task: |
  Given an AML alert, run a sanctions-first gate, score the transaction
  sequence against FATF/AMLA typologies, and recommend a disposition
  (close / monitor / enhanced_due_diligence / str_style_draft /
  sanctions_escalation) with cited indicators and a narrative DRAFT —
  halting to escalation on any sanctions hit, never filing an STR.
pipeline_kind: "classify"

inputs:
  - name: "alert_id"
    type: "string"
  - name: "alert_payload"
    type: "object"
    schema: "narrative, trigger_rule, amount_php"
  - name: "customer_profile"
    type: "object"
    schema: "normalized_name, account_id, customer_type, expected_activity"
  - name: "transactions"
    type: "TransactionEdge[]"
  - name: "counterparties"
    type: "Entity[]"

outputs:
  - name: "sanctions_hits"
    type: "object[]"
  - name: "typology_matches"
    type: "object[]"
  - name: "disposition_recommendation"
    type: "enum[close, monitor, enhanced_due_diligence, str_style_draft, sanctions_escalation]"
  - name: "analyst_narrative_draft"
    type: "markdown"
  - name: "missing_evidence"
    type: "object[]"

defaults:
  persona: "persona/aml-analyst"
  model_adapter: "adapter/ollama-default"
  knowledge_packs:
    - "knowledge-pack/fatf-typologies-sample"
    - "knowledge-pack/aml-red-flags-extended"
    - "knowledge-pack/sanctions-list-shape"
  rule_packs:
    - "rule-pack/financial-pii-en"
    - "rule-pack/sanctions-screening"
    - "rule-pack/aml-typologies-fatf"

steps:
  - id: "redact_pii"
    kind: "harness"
    ref: "harness/redact-pii-text"
    inputs:
      text: "$.inputs.alert_payload.narrative"

  - id: "canonicalize_customer"
    kind: "processor"
    ref: "processor/name-canonicalize"
    inputs:
      name: "$.inputs.customer_profile.normalized_name"

  # Conditional GATE (sanctions-first): runs before any disposition drafting
  - id: "sanctions_screen"
    kind: "tool"
    ref: "tool/sanctions-check"
    inputs:
      normalized_name: "$.steps.canonicalize_customer.output.canonical_name"
      lists: ["ofac_sdn", "un_consolidated", "eu_consolidated", "institution_pep"]
      threshold: 0.92

  # Transaction-graph context (2-hop counterparty exposure)
  - id: "graph_query"
    kind: "tool"
    ref: "tool/transaction-graph-query"
    inputs:
      seed_account: "$.inputs.customer_profile.account_id"
      direction: "both"
      max_hops: 2
      time_window_days: 90

  # Deterministic typology scoring (freezable, the evidence the model cites)
  - id: "typology_score"
    kind: "rule_pack"
    ref: "rule-pack/aml-typologies-fatf"
    inputs:
      text: "$.steps.redact_pii.output.redacted_text"

  # R1: FATF typology text + enumerated red flags (governed corpus)
  - id: "retrieve_fatf"
    kind: "knowledge_pack"
    ref: "knowledge-pack/fatf-typologies-sample"
    inputs:
      query: "$.steps.redact_pii.output.redacted_text"
      top_k: 6

  - id: "retrieve_redflags"
    kind: "knowledge_pack"
    ref: "knowledge-pack/aml-red-flags-extended"
    inputs:
      query: "$.steps.redact_pii.output.redacted_text"
      top_k: 6

  # Action: Model Call — sanctions-first cited disposition + narrative DRAFT (never a filing); cite-or-abstain
  - id: "draft_disposition"
    kind: "harness"
    ref: "harness/aml-investigation"
    inputs:
      messages: |
        [{"role": "user", "content": "Recommend a disposition: close, monitor, enhanced_due_diligence, str_style_draft, or sanctions_escalation. If any sanctions hit is present, the disposition MUST be sanctions_escalation and you must halt — do not draft a routine disposition. Otherwise, cite each typology match to a retrieved FATF/red-flag reference, list missing evidence explicitly, and compose an analyst narrative DRAFT. Never assert intent and never state that an STR has been or will be filed. Cite every claim or abstain."}]
      context:
        - "$.steps.sanctions_screen.output.matches"
        - "$.steps.graph_query.output"
        - "$.steps.typology_score.output.fired"
        - "$.steps.retrieve_fatf.output.docs"
        - "$.steps.retrieve_redflags.output.docs"

  - id: "extract_evidence_gaps"
    kind: "processor"
    ref: "processor/evidence-gap-extractor"
    inputs:
      trace: "$.steps.draft_disposition.output"
      config: {}

  - id: "check_citations"
    kind: "processor"
    ref: "processor/citation-span-checker"
    inputs:
      trace: "$.steps.draft_disposition.output"
      config: {}

  # Stop / End: any sanctions hit halts to escalation queue
  - id: "escalate"
    kind: "processor"
    ref: "processor/escalate-human-review"
    when: "$.steps.sanctions_screen.output.matches != []"
    inputs:
      case_id: "$.inputs.alert_id"
      reason: "Sanctions hit on AML alert — mandatory escalation before any routine disposition"
      severity: "critical"
      payload: "$.steps.draft_disposition.output"

  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "ph-str-disposition-screening"
      applied_layers: ["privacy", "sanctions", "rag", "heuristic", "harness"]

success_criteria:
  - rubric: "rubric/aml-investigation-v1"
    threshold: 0.80
  - kind: "deterministic"
    target: "$.steps.check_citations.output.result.pass"
    op: "=="
    value: true
    severity: "critical"
    label: "Every typology match cited in the disposition traces to a retrieved reference span."
  - kind: "regex"
    target: "$.outputs.analyst_narrative_draft"
    pattern: "(has been filed|will be filed|we have filed|STR filed)"
    must_match: false
    severity: "critical"
    label: "The narrative draft never claims an STR was or will be filed (drafting aid only)."
