id: "pipeline/ph-inward-remittance-corridor-screening"
type: pipeline
version: "0.1.0"
name: "PH inward remittance corridor + counterparty-bank screening"
description: |
  Screen an inbound cross-border remittance into a Philippine account
  (e.g. an OFW remittance corridor) for three risks at once: (1) the
  ordering / intermediary BANK is identifiable and valid via its SWIFT
  BIC, (2) the originating corridor / jurisdiction is high-risk, and
  (3) the remittance pattern matches a structuring / rapid-pass-through
  typology — producing a cited risk disposition.

  Negative space: a bare model cannot validate a SWIFT BIC or resolve it
  to a bank + country, cannot say which corridors are high-risk for PH
  inbound flows, and cannot score a deposit series against a structuring
  threshold — these are a deterministic BIC validator, a governed
  corridor corpus, and a deterministic typology classifier respectively.
  The model only assembles the cited disposition. Structuring across a
  series of sub-threshold deposits is the canonical pattern a single-
  transaction view (and a base model) misses.

  Reference / educational only — synthetic remittance inputs, governed
  corridor snapshots; not a payment-blocking system. Bundle: Standard
  hybrid RAG + deterministic tool legs (BIC, typology) feeding one
  governed model call.
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["finance", "finance.aml", "payments.wires"]
capability: ["verification", "classification", "retrieval", "safety_gating"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "volatile"
tags: ["ph-aml", "remittance", "ofw-corridor", "swift-bic", "structuring", "negative-space"]
created: "2026-05-29"
updated: "2026-05-29"

task: |
  Given an inbound PH remittance (amount, ordering bank BIC, origin
  country, recent deposit history), validate the counterparty bank via
  BIC, assess corridor risk, score the deposit series for structuring /
  rapid pass-through, and emit a cited risk disposition. Halt to
  escalation on a sanctions hit or a high-severity structuring match.
pipeline_kind: "classify"

inputs:
  - name: "remittance"
    type: "object"
    schema: "amount_php, ordering_bank_bic, origin_country_iso2, value_date, narrative"
  - name: "beneficiary"
    type: "object"
    schema: "normalized_name, account_ref, expected_monthly_volume"
  - name: "recent_deposits"
    type: "object[]"
    schema: "amount_php, value_date"

outputs:
  - name: "counterparty_bank"
    type: "object"
  - name: "corridor_risk"
    type: "object"
  - name: "structuring_indicators"
    type: "object[]"
  - name: "risk_disposition"
    type: "enum[low, monitor, enhanced_due_diligence, halt_and_escalate]"
  - name: "disposition_rationale"
    type: "markdown"

defaults:
  persona: "persona/aml-analyst"
  model_adapter: "adapter/ollama-default"
  knowledge_packs:
    - "knowledge-pack/high-risk-corridors-and-sectors"
    - "knowledge-pack/aml-red-flags-extended"
  rule_packs:
    - "rule-pack/financial-pii-en"
    - "rule-pack/sanctions-screening"
    - "rule-pack/aml-typologies-fatf"

steps:
  - id: "redact_pii"
    kind: "harness"
    ref: "harness/redact-pii-text"
    inputs:
      text: "$.inputs.remittance.narrative"

  - id: "normalize_origin"
    kind: "processor"
    ref: "processor/iso-country-normalize"
    inputs:
      value: "$.inputs.remittance.origin_country_iso2"

  # Deterministic: validate the ordering-bank BIC and resolve to bank + country
  - id: "validate_bic"
    kind: "tool"
    ref: "tool/swift-bic-validator"
    inputs:
      bic_code: "$.inputs.remittance.ordering_bank_bic"

  - id: "canonicalize_beneficiary"
    kind: "processor"
    ref: "processor/name-canonicalize"
    inputs:
      name: "$.inputs.beneficiary.normalized_name"

  # Sanctions-first gate on the beneficiary
  - id: "sanctions_screen"
    kind: "tool"
    ref: "tool/sanctions-check"
    inputs:
      normalized_name: "$.steps.canonicalize_beneficiary.output.canonical_name"
      lists: ["ofac_sdn", "un_consolidated", "eu_consolidated"]
      threshold: 0.92

  # R1: corridor risk for the resolved origin country (governed corpus)
  - id: "retrieve_corridor"
    kind: "knowledge_pack"
    ref: "knowledge-pack/high-risk-corridors-and-sectors"
    inputs:
      query: "$.steps.normalize_origin.output.iso_country_name"
      top_k: 5

  # Deterministic structuring / rapid-pass-through typology over the deposit series (freezable)
  - id: "structuring_score"
    kind: "rule_pack"
    ref: "rule-pack/aml-typologies-fatf"
    inputs:
      text: "$.steps.redact_pii.output.redacted_text"

  # R1: enumerated remittance red flags
  - id: "retrieve_redflags"
    kind: "knowledge_pack"
    ref: "knowledge-pack/aml-red-flags-extended"
    inputs:
      query: "$.steps.redact_pii.output.redacted_text"
      top_k: 6

  # Action: Model Call — assemble cited disposition from the deterministic legs; cite-or-abstain
  - id: "assemble_disposition"
    kind: "harness"
    ref: "harness/aml-investigation"
    inputs:
      messages: |
        [{"role": "user", "content": "Assemble a remittance risk disposition (low, monitor, enhanced_due_diligence, or halt_and_escalate). Use the BIC validation result for the counterparty bank, the corridor reference for jurisdiction risk, and the structuring typology results for the deposit pattern. Cite each risk factor to a retrieved reference or the tool output, or abstain. If a sanctions hit is present or a high-severity structuring indicator fired, recommend halt_and_escalate. Do not assert intent."}]
      context:
        - "$.steps.validate_bic.output"
        - "$.steps.sanctions_screen.output.matches"
        - "$.steps.retrieve_corridor.output.docs"
        - "$.steps.structuring_score.output.fired"
        - "$.steps.retrieve_redflags.output.docs"
        - "$.inputs.recent_deposits"

  - id: "check_citations"
    kind: "processor"
    ref: "processor/citation-span-checker"
    inputs:
      trace: "$.steps.assemble_disposition.output"
      config: {}

  - id: "escalate"
    kind: "processor"
    ref: "processor/escalate-human-review"
    when: "$.steps.sanctions_screen.output.matches != [] || $.steps.structuring_score.output.max_severity == 'high'"
    inputs:
      case_id: "$.inputs.beneficiary.account_ref"
      reason: "Sanctions hit or high-severity structuring pattern on inbound PH remittance"
      severity: "high"
      payload: "$.steps.assemble_disposition.output"

  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "ph-inward-remittance-corridor-screening"
      applied_layers: ["privacy", "sanctions", "rag", "heuristic", "harness"]

success_criteria:
  - rubric: "rubric/aml-investigation-v1"
    threshold: 0.78
  - kind: "deterministic"
    target: "$.steps.check_citations.output.result.pass"
    op: "=="
    value: true
    severity: "high"
    label: "Every risk factor in the disposition traces to a retrieved reference or tool output."
  - kind: "deterministic"
    target: "$.steps.validate_bic.output.is_valid"
    op: "=="
    value: true
    severity: "medium"
    label: "The ordering-bank BIC is structurally valid (else the remittance is flagged for data repair)."
