id: "pipeline/deal-desk-discounting-review"
type: pipeline
version: "0.1.0"
name: "Deal Desk Discounting review pipeline"
description: "End-to-end deal desk discounting review with redaction, grep triage, RAG grounding, harness review, rubric scoring, and audit trace."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["sales_ops.discounting", "legal.contract"]
capability: ["evaluation", "extraction", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "api.review"
freshness: "stable"
tags: ["deal-desk-discounting", "use-case-expansion"]
created: "2026-05-24"
updated: "2026-05-24"
task: "Review discount and commercial exception packets for approval authority, margin impact, and precedent risk."
pipeline_kind: "review"
inputs:
  - name: "packet"
    type: "string|object"
outputs:
  - name: "findings"
    type: "object[]"
  - name: "score"
    type: "number"
  - name: "evidence_gaps"
    type: "object[]"
defaults:
  persona: "persona/deal-desk-reviewer"
  model_adapter: "adapter/ollama-default"
  knowledge_packs: ["knowledge-pack/deal-desk-discounting-frameworks"]
  rule_packs: ["rule-pack/grep-deal-desk-discounting-flags", "rule-pack/rag-deal-desk-discounting-retrieval-policy"]
steps:
  - id: "structured_to_prose"
    kind: "processor"
    ref: "processor/structured-to-prose"
    inputs: { data: "$.inputs.packet" }
  - id: "redact_pii"
    kind: "processor"
    ref: "processor/redact-pii-text"
    inputs: { text: "$.steps.structured_to_prose.output.prose" }
  - id: "grep_flags"
    kind: "rule_pack"
    ref: "rule-pack/grep-deal-desk-discounting-flags"
    inputs: { text: "$.steps.redact_pii.output.text" }
  - id: "retrieve_context"
    kind: "rule_pack"
    ref: "rule-pack/rag-deal-desk-discounting-retrieval-policy"
    inputs: { query: "$.steps.grep_flags.output.fired", corpus: "knowledge-pack/deal-desk-discounting-frameworks", top_k: 8 }
  - id: "review_harness"
    kind: "harness"
    ref: "harness/deal-desk-discounting-review"
    inputs:
      packet: "$.steps.redact_pii.output.text"
      context: "$.steps.retrieve_context.output.passages"
  - id: "grade"
    kind: "processor"
    ref: "processor/llm-judge"
    inputs:
      candidate: "$.steps.review_harness.output.findings"
      rubric_ref: "rubric/deal-desk-discounting-quality-v1"
  - id: "audit"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "deal-desk-discounting-review"
      applied_layers: ["privacy", "grep", "rag", "harness", "judge"]
success_criteria:
  - rubric: "rubric/deal-desk-discounting-quality-v1"
    threshold: 0.65
