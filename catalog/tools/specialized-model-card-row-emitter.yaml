id: "tool/specialized-model-card-row-emitter"
type: tool
version: "0.1.0"
name: "Specialized model card row emitter"
description: "Emits canonical source_record, normalized_object, entity, dedupe, label, dimension, embedding, index, and review-ticket JSONL row families from specialized model-card scan jobs."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["healthcare", "finance", "legal", "software.devops", "media", "security", "privacy", "government", "cross_industry"]
capability: ["extraction", "classification", "retrieval", "evaluation", "routing", "governance", "embedding"]
modality: ["structured", "text", "image"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "stable"
lifecycle_position: "cross_cutting.factory"
tags: ["huggingface", "model-cards", "row-families", "jsonl", "bulk-load", "pgvector"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    jobs:
      type: array
      items:
        type: object
    output_dir:
      type: string
    excluded_scopes:
      type: array
      items:
        type: string
  required: ["jobs"]
returns:
  type: object
  properties:
    output_dir:
      type: string
    row_counts:
      type: object
    row_family_paths:
      type: object
    warnings:
      type: array
      items:
        type: string
side_effects: "write"
examples:
  - input:
      jobs:
        - job_id: "job/specialized-model-card/prosusai-finbert/04-task_context_normalize/shard/demo"
          job_type: "task_context_normalize"
          source_record_id: "source/specialized-model-card/prosusai-finbert"
      excluded_scopes: ["insurance"]
    output:
      row_counts:
        normalized_object: 2
        index_record: 12
implementations:
  - kind: "callable"
    path: "scripts.factory.specialized_model_card_rows.export_model_card_rows"
    language: "python"
  - kind: "mcp"
    path: "mcp/factory.emit_specialized_model_card_rows"

