id: "tool/use-case-seed-embedding-bucket-exporter"
type: tool
version: "0.1.0"
name: "Use case seed embedding bucket exporter"
description: "Emits deterministic object_embedding stubs and embedding_bucket dimensions for cross-domain use-case seeds so comparison and embedding workers can shard cheaply."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "finance", "legal", "media", "creative", "energy", "healthcare", "cross_industry"]
capability: ["retrieval", "classification", "governance", "evaluation"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "stable"
tags: ["use-case-seeds", "object-embeddings", "embedding-buckets", "pgvector", "comparison-blocking"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    seeds:
      type: array
      items:
        type: object
    output_dir:
      type: string
    excluded_scopes:
      type: array
      items:
        type: string
  required: ["seeds"]
returns:
  type: object
  properties:
    object_embeddings:
      type: array
      items:
        type: object
    embedding_bucket_dimensions:
      type: array
      items:
        type: object
    row_counts:
      type: object
side_effects: "write"
examples:
  - input:
      seeds:
        - id: "oil-gas-operations-knowledge-pipeline"
          domain: "oil_gas"
          risk_tier: "high"
      excluded_scopes: ["insurance"]
    output:
      row_counts:
        object_embedding: 1
        dimension_value: 7
implementations:
  - kind: "callable"
    path: "scripts.factory.use_case_seed_rows.export_seed_rows"
    language: "python"
  - kind: "mcp"
    path: "mcp/factory.export_use_case_seed_embedding_buckets"
