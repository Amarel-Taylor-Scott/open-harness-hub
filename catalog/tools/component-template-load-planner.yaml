id: "tool/component-template-load-planner"
type: tool
version: "0.1.0"
name: "Component template load planner"
description: "Exports generated component pipeline templates as CSV plus a psql load script for Postgres template and template-step tables without connecting to the database."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["planning", "routing", "serving", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["components", "pipeline-template", "postgres", "bulk-load", "review-gate"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    template_paths:
      type: array
      items:
        type: string
    output_dir:
      type: string
    load_sql_name:
      type: string
  required: ["template_paths"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    template_count:
      type: integer
    template_step_count:
      type: integer
    files:
      type: object
side_effects: "write"
examples:
  - input:
      template_paths:
        - "dist/source-surface-scan-partitions/seed/component-pipeline-templates/human-exploitation-photo-description-cheap.json"
      output_dir: "dist/source-surface-scan-partitions/seed/component-template-load"
    output:
      ok: true
      template_count: 1
      template_step_count: 8
implementations:
  - kind: "callable"
    path: "scripts.db.component_template_load_plan.create_component_template_load_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.component_template_load_plan"
