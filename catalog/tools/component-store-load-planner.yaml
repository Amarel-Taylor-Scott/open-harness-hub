id: "tool/component-store-load-planner"
type: tool
version: "0.1.0"
name: "Component store load planner"
description: "Exports component and subcomponent candidate JSONL as CSV plus a psql load script for Postgres candidate tables without connecting to the database."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["governance", "serving", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["components", "subcomponents", "postgres", "bulk-load", "csv", "candidate-store"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    component_store_plan:
      type: string
    output_dir:
      type: string
    load_sql_name:
      type: string
  required: ["component_store_plan"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    component_candidate_count:
      type: integer
    subcomponent_candidate_count:
      type: integer
    source_component_link_count:
      type: integer
    files:
      type: object
side_effects: "write"
examples:
  - input:
      component_store_plan: "dist/source-surface-scan-partitions/seed/component-store/component-store-plan.json"
      output_dir: "dist/source-surface-scan-partitions/seed/component-store-load"
    output:
      ok: true
      component_candidate_count: 620
      subcomponent_candidate_count: 18600
implementations:
  - kind: "callable"
    path: "scripts.db.component_store_load_plan.create_component_store_load_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.component_store_load_plan"
