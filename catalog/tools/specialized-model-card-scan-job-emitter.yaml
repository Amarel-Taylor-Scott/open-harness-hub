id: "tool/specialized-model-card-scan-job-emitter"
type: tool
version: "0.1.0"
name: "Specialized model card scan job emitter"
description: "Converts specialized model signal rows into queue-ready object-factory jobs for model-card discovery, metadata parsing, task-context normalization, dataset/eval linking, dedupe, indexing, and review."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["healthcare", "finance", "legal", "software.devops", "media", "security", "privacy", "government", "cross_industry"]
capability: ["retrieval", "extraction", "classification", "evaluation", "routing", "governance", "embedding"]
modality: ["text", "image", "structured"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "volatile"
lifecycle_position: "pre_api.ingest"
tags: ["huggingface", "model-cards", "object-factory", "worker-jobs", "specialized-models", "queue-ready"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    model_signals:
      type: array
      items:
        type: object
    output_dir:
      type: string
    tenant_id:
      type: string
    scan_policy:
      type: object
    excluded_scopes:
      type: array
      items:
        type: string
  required: ["model_signals"]
returns:
  type: object
  properties:
    output_dir:
      type: string
    model_signal_count:
      type: integer
    shard_count:
      type: integer
    job_count:
      type: integer
    job_counts_by_type:
      type: object
    files:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string
side_effects: "write"
examples:
  - input:
      model_signals:
        - id: "specialized-model-signal/prosus-finbert-financial-sentiment"
          source_model_id: "ProsusAI/finbert"
          task_shape: "financial-text-sentiment-classification"
      scan_policy:
        cadence: "weekly"
        max_records_per_model_signal: 100
        max_usd_per_model_signal: 0.75
      excluded_scopes: ["insurance"]
    output:
      model_signal_count: 1
      shard_count: 1
      job_count: 9
      job_counts_by_type:
        model_repo_discovery: 1
        publish_review: 1
implementations:
  - kind: "callable"
    path: "scripts.factory.specialized_model_card_scan_jobs.emit_specialized_model_card_scan_jobs"
    language: "python"
  - kind: "mcp"
    path: "mcp/factory.emit_specialized_model_card_scan_jobs"

