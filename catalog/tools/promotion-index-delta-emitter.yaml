id: "tool/promotion-index-delta-emitter"
type: tool
version: "0.1.0"
name: "Promotion index delta emitter"
description: "Emits partition manifests and replayable quality, facet, and cost index deltas from promotion-decision JSONL shards."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["evaluation", "governance", "retrieval", "serving"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.indexing"
tags: ["promotion", "index-delta", "quality-index", "facet-index", "cost-index", "incremental-build"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    input_path:
      type: string
    partition_id:
      type: string
    output_dir:
      type: string
    run_id:
      type: string
    source_surface_id:
      type: string
    tenant_id:
      type: string
  required: ["input_path", "partition_id", "output_dir"]
returns:
  type: object
  properties:
    partition_manifest_path:
      type: string
    index_delta_path:
      type: string
    partition_manifest:
      type: object
    deltas_emitted:
      type: integer
side_effects: "write"
examples:
  - input:
      input_path: "catalog/knowledge-packs/data/promotion-index-delta-patterns/promotion-decisions.jsonl"
      partition_id: "promotion/task-marketplace/000001"
      output_dir: "dist/promotion-index-deltas/task-marketplace"
    output:
      partition_manifest_path: "dist/promotion-index-deltas/task-marketplace/partition-manifest.json"
      index_delta_path: "dist/promotion-index-deltas/task-marketplace/promotion-index-deltas.jsonl"
      partition_manifest:
        partition_id: "promotion/task-marketplace/000001"
        object_count: 2
      deltas_emitted: 6
implementations:
  - kind: "callable"
    path: "scripts.factory.promotion_delta_emitter.emit_promotion_index_delta"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.factory.promotion_delta_emitter"
