id: "tool/postgres-object-count-sql"
type: tool
version: "0.1.0"
name: "Postgres object count SQL"
description: "Runs the canonical SQL count report against Postgres so manifests, generated objects, embeddings, labels, dimensions, and index rows are counted as separate metric families."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["governance", "retrieval", "serving", "evaluation"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["postgres", "pgvector", "object-counts", "metrics"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    database_url:
      type: string
      description: "Postgres connection string supplied by the runtime."
    sql_path:
      type: string
      default: "db/postgres/object_count_report.sql"
returns:
  type: object
  properties:
    rows:
      type: array
      items: { type: object }
side_effects: "read"
examples:
  - input:
      sql_path: "db/postgres/object_count_report.sql"
    output:
      rows:
        - object_family: "generated_object"
          relation_name: "normalized_object"
          row_count: 100000
implementations:
  - kind: "shell"
    command: "psql \"$DATABASE_URL\" -f db/postgres/object_count_report.sql"
