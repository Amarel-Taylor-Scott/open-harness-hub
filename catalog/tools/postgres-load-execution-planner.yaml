id: "tool/postgres-load-execution-planner"
type: tool
version: "0.1.0"
name: "Postgres load execution planner"
description: "Emits a side-effect-free command plan for initializing Postgres/pgvector, applying a generated load.sql, exporting committed counts, and auditing staged versus committed rows."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["governance", "retrieval", "serving", "evaluation", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["postgres", "pgvector", "load-execution", "render", "docker-compose", "object-counts"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    load_plan_manifest:
      type: string
    execution_summary:
      type: string
    target:
      type: string
      enum: ["local_docker", "render", "managed_postgres"]
    database_url_env:
      type: string
    compose_file:
      type: string
    schema_file:
      type: string
    count_sql:
      type: string
    committed_counts_output:
      type: string
    load_audit_output:
      type: string
    output:
      type: string
    run_id:
      type: string
  required: ["load_plan_manifest"]
returns:
  type: object
  properties:
    target:
      type: string
    readiness:
      type: object
    files:
      type: object
    commands:
      type: array
      items:
        type: object
    safety_notes:
      type: array
      items:
        type: string
side_effects: "write"
examples:
  - input:
      load_plan_manifest: "dist/source-surface-scan-partitions/seed/load-plan/load-plan-manifest.json"
      execution_summary: "dist/source-surface-scan-partitions/seed/execution-summary.json"
      output: "dist/source-surface-scan-partitions/seed/postgres-load-execution-plan.json"
    output:
      target: "local_docker"
      readiness:
        preflight_ok: true
      commands:
        - step: "start_local_pgvector"
implementations:
  - kind: "callable"
    path: "scripts.db.postgres_load_execution_plan.build_postgres_load_execution_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.postgres_load_execution_plan"
