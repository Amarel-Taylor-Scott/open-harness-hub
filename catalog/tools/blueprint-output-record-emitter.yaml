id: "tool/blueprint-output-record-emitter"
type: tool
version: "0.1.0"
name: "Blueprint output record emitter"
description: "Emits normalized records from a local sentence-to-pipeline route matrix, including model-route records, prompt-prefix cache profiles, pricing stubs, eval arms, deployment line items, verified-fact dependencies, and review routing rules."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "software.devops", "government", "finance", "humanitarian", "cross_industry"]
capability: ["format_conversion", "planning", "routing", "governance", "retrieval"]
modality: ["text", "image", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "volatile"
tags: ["local-demo", "normalized-objects", "blueprint-records", "indexing", "pricing", "verified-facts"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    prompt:
      type: string
    task_parse:
      type: object
    route_matrix:
      type: object
    ab_plan:
      type: object
    verified_fact_dependencies:
      type: array
      items:
        type: object
    emit_private:
      type: boolean
      description: "When false, do not emit raw private prompt text into public records."
  required: ["task_parse", "route_matrix"]
returns:
  type: object
  properties:
    normalized_objects:
      type: array
      items:
        type: object
    review_tickets:
      type: array
      items:
        type: object
    warnings:
      type: array
      items:
        type: string
side_effects: "none"
examples:
  - input:
      prompt: "Build a cheap image plus text triage pipeline."
      task_parse:
        task_type: "image_text_triage"
        modalities: ["image", "text"]
        risk_tier: "high"
      route_matrix:
        matrix_id: "route-matrix-example"
        options:
          - name: "cheap"
      emit_private: false
    output:
      normalized_objects:
        - object_type: "model_route_record"
          route_name: "cheap"
      review_tickets:
        - reason: "High-risk generated blueprint requires review before publication."
      warnings: ["Raw prompt text was not emitted."]
implementations:
  - kind: "callable"
    path: "scripts.blueprints.local_sentence_demo.emit_blueprint_output_records"
    language: "python"
  - kind: "mcp"
    path: "mcp/blueprints.emit_output_records"
