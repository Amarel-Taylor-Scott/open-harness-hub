id: "tool/anthropic-claude-agent-sdk"
type: tool
version: "0.1.0"
name: "Anthropic Claude Agent SDK"
description: |
  The official Anthropic SDK for building custom Claude-powered agents with
  structured tool use, multi-turn conversation management, prompt caching,
  and first-class support for the Model Context Protocol (MCP). Provides
  Python and TypeScript clients covering: synchronous and streaming message
  calls, tool/function definitions with typed schemas, vision and document
  inputs, token-usage tracking, batching, and native MCP server/client
  adapters. The canonical integration layer for any pipeline component that
  calls Claude models.

  Unlike third-party harnesses, the Agent SDK is maintained by Anthropic,
  versioned with stable semver, and ships with an official support SLA. Use
  this as the base transport for building custom agents rather than wrapping
  the HTTP API directly.
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry:   ["ai", "cross_industry"]
capability: ["agent_loop", "tool_use", "planning"]
modality:   ["text", "code", "structured"]
lifecycle:  "stable"
trust_boundary: "external"
tags:
  - "anthropic"
  - "claude"
  - "sdk"
  - "agent"
  - "official"
  - "mcp"
  - "tool-use"
  - "prompt-caching"
created: "2026-05-26"
updated: "2026-05-26"
attribution:
  source_url: "https://github.com/anthropics/anthropic-sdk-python"
  source_kind: "github"
  author: "Anthropic"

parameters:
  type: object
  properties:
    op:
      type: string
      enum: ["messages_create", "messages_stream", "messages_batch", "tool_call", "mcp_connect"]
      description: "SDK operation to invoke."
    model:
      type: string
      description: "Claude model identifier (e.g. claude-sonnet-4-6, claude-opus-4-5)."
    messages:
      type: array
      description: "Conversation history in Anthropic message format."
      items:
        type: object
        properties:
          role:    { type: "string", enum: ["user", "assistant"] }
          content: {}
    tools:
      type: array
      description: "Tool definitions conforming to the Anthropic tool-use schema."
      items:
        type: object
    system:
      type: string
      description: "System prompt."
    max_tokens:
      type: integer
      description: "Maximum tokens to generate."
      default: 4096
    stream:
      type: boolean
      description: "Whether to use streaming (op=messages_stream)."
      default: false
  required: ["op", "model", "messages"]
returns:
  type: object
  properties:
    message:
      type: object
      description: "Anthropic Message object with content blocks, stop_reason, usage."
    stream_events:
      type: array
      description: "Ordered stream events (op=messages_stream)."
      items:
        type: object
    tool_results:
      type: array
      description: "Parsed tool-use results when the response contains tool_use blocks."
      items:
        type: object
        properties:
          tool_name: { type: "string" }
          input:     { type: "object" }
          result:    {}
    usage:
      type: object
      properties:
        input_tokens:          { type: "integer" }
        output_tokens:         { type: "integer" }
        cache_read_tokens:     { type: "integer" }
        cache_creation_tokens: { type: "integer" }
side_effects: "external_call"
examples:
  - input:
      op: "messages_create"
      model: "claude-sonnet-4-6"
      system: "You are a catalog component writer for Open Harness Hub."
      messages:
        - role: "user"
          content: "Draft a one-sentence description for a fuzzy-dedupe tool."
      max_tokens: 128
    output:
      message:
        id: "msg_abc123"
        content: [{ type: "text", text: "A fuzzy-dedupe tool clusters candidate rows by content similarity, collapsing near-duplicates before index load." }]
        stop_reason: "end_turn"
      usage: { input_tokens: 48, output_tokens: 24, cache_read_tokens: 0, cache_creation_tokens: 0 }
implementations:
  - kind: "callable"
    path: "anthropic.Anthropic.messages.create"
    language: "python"
  - kind: "callable"
    path: "Anthropic.messages.create"
    language: "typescript"
  - kind: "http"
    url: "https://api.anthropic.com/v1/messages"
  - kind: "mcp"
    path: "anthropic-mcp-client"
