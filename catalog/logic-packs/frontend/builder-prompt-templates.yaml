id: "logic-pack/builder-prompt-templates"
type: logic-pack
version: "0.1.0"
name: "Builder Prompt Templates"
description: |
  Prompt templates and response policies for every LLM call made inside the
  conversational pipeline builder. Covers intent extraction, component-retrieval
  framing, pipeline assembly explanation, cost narration, and refine-loop
  re-entry. Prompts are stored as data so they can be versioned, A/B tested,
  and swapped without code changes.
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "cross_industry"]
capability: ["dialogue", "planning", "retrieval", "generation", "reasoning"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "hub"
freshness: "stable"
tags: ["prompt-templates", "builder", "conversational", "frontend", "response-policy"]
created: "2026-05-26"
updated: "2026-05-26"

content_types:
  - "prompt_template"
  - "response_policy"
  - "system_instruction"

files:
  - path: "logic/frontend/builder-prompt-templates/intent-extraction.yaml"
    format: "yaml"
  - path: "logic/frontend/builder-prompt-templates/component-retrieval-framing.yaml"
    format: "yaml"
  - path: "logic/frontend/builder-prompt-templates/assembly-explanation.yaml"
    format: "yaml"
  - path: "logic/frontend/builder-prompt-templates/response-policies.yaml"
    format: "yaml"
