industry:   ["ai", "software.devops", "cross_industry"]
capability: ["agent_loop", "planning", "tool_use", "governance"]
modality:   ["text", "structured"]
lifecycle:  "stable"
trust_boundary: "mixed"
tags: ["agents", "production", "twelve-factor", "control-flow", "reliability"]
created: "2026-05-26"
updated: "2026-05-26"
attribution:
  source_url: "https://github.com/humanlayer/12-factor-agents"
  source_kind: "github"
  author: "HumanLayer"

paper_url: "https://github.com/humanlayer/12-factor-agents"
paper_citation: "HumanLayer, 12-Factor Agents (open methodology)"
reference_implementations:
  - { url: "https://github.com/humanlayer/12-factor-agents", language: "typescript", framework: "12-factor-agents methodology + examples", notes: "verify upstream license before redistributing any code; this pattern is a reference, not a copy" }

structural_shape:
  - "intent -> structured tool calls (factor 1, 4)"
  - "owned, versioned prompts + engineered context window (factor 2, 3)"
  - "deterministic control flow in code; LLM steps at chosen points (factor 8)"
  - "unified, replayable state as a (state,event)->state reducer (factor 5, 12)"
  - "human escalation + launch/pause/resume as first-class actions (factor 6, 7)"
  - "small focused agents, triggerable from anywhere (factor 10, 11)"
  - "errors compacted back into context for recovery (factor 9)"

when_to_use:
  - "Building an agent that real customers or auditors will depend on"
  - "An autonomous-loop prototype is unreliable and hard to debug"
  - "You need replayable, testable runs and explicit human-in-the-loop points"

when_not_to_use:
  - "A throwaway prototype or one-shot script where engineering rigor is overkill"
  - "A single deterministic transform with no genuine LLM judgment step"

variants:
  - "Stateless-reducer core with an external durable event log"
  - "Micro-agent mesh (factor 10) coordinated by an orchestrator pipeline"

counter_patterns:
  - "anti-over-prompting-as-crutch (leaning on a giant prompt instead of owned control flow)"
  - "the 'one big autonomous loop' agent that owns its own control flow opaquely"

implementing_pipelines: []
implementing_processors: []

tradeoffs:
  latency:        "neutral — structure adds little overhead, often reduces retries"
  cost:           "lower — owned context + small agents cut tokens vs a god-agent"
  quality:        "higher reliability and debuggability in production"
  complexity:     "more upfront engineering than a naive agent loop"
  explainability: "high — explicit state, control flow, and escalation points"
