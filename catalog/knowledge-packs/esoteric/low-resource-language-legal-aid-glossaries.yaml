name: Low Resource Language Legal Aid Glossaries
description: 'Capability-lift knowledge pack for an esoteric area LLMs handle poorly.
  Gap: models mistranslate legal/administrative terms in under-resourced languages,
  producing dangerous errors in rights, eligibility, and procedure Grounded in community-validated
  bilingual legal glossaries + UNTERM + national legal-aid bodies (reusable w/ attribution)
  via keyword retrieval. Lift: low data coverage (under-resourced languages) = valley;
  exact term mappings verifiable and token-efficient (substitute long phrases)'
