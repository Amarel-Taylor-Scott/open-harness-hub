facts:
  - "A task-specific model is evidence that someone invested in labels, data, metrics, and domain context for a narrow capability."
  - "Model card context can become reusable primitives even when the hub does not host or call the model weights."
  - "The most reusable fields are task shape, label schema, datasets, eval metrics, limitations, intended use, and model lineage."
