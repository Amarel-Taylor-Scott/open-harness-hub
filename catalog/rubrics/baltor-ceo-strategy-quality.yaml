id: "rubric/baltor-ceo-strategy-quality"
type: rubric
version: "0.1.0"
name: "Baltor CEO strategy quality"
description: "CEO rubric for strategic focus, product-market fit, differentiation, and sequencing."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["software", "ai_governance"]
capability: ["evaluation", "planning", "governance"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["baltor", "ceo", "strategy", "product-market-fit"]
created: "2026-06-02"
updated: "2026-06-02"
dimensions:
  - id: "wedge_clarity"
    label: "Strategy prioritizes trusted engineering context packs before broad platform claims"
    weight: 0.22
    scale: "0.0-1.0"
    evidence_required: "Messaging, roadmap, and MVP scope center on ticket/PR/MR/review packs and fragile-context freshness."
  - id: "buyer_and_user_alignment"
    label: "Developer, reviewer, platform, security, and executive value are connected to one measurable workflow"
    weight: 0.18
    scale: "0.0-1.0"
    evidence_required: "ICP, buyer, user, approver, activation, and outcome metrics are explicit."
  - id: "differentiation"
    label: "Differentiation is defensible against coding agents, enterprise search, MCP gateways, and internal RAG"
    weight: 0.18
    scale: "0.0-1.0"
    evidence_required: "Source handles, freshness, context trace, source precedence, and cross-agent pack contracts are foregrounded."
  - id: "sequencing_discipline"
    label: "Roadmap defers platform, ontology, industry, model-routing, and LoRA complexity until paid demand warrants it"
    weight: 0.16
    scale: "0.0-1.0"
    evidence_required: "MVP in-scope/out-of-scope list and 90-day validation gates are documented."
  - id: "market_timing"
    label: "Strategy ties Baltor to current agent adoption, developer trust gaps, MCP risk, and governance pressure"
    weight: 0.13
    scale: "0.0-1.0"
    evidence_required: "Market evidence and customer discovery notes support the timing claim."
  - id: "business_model_path"
    label: "There is a credible path from design partner to paid pilot to expansion"
    weight: 0.13
    scale: "0.0-1.0"
    evidence_required: "Pilot pricing, success metrics, conversion gates, and expansion packaging are present."
scoring_method: "weighted_sum"
