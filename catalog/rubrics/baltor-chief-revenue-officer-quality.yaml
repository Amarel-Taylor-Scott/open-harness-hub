id: "rubric/baltor-chief-revenue-officer-quality"
type: rubric
version: "0.1.0"
name: "Baltor Chief Revenue Officer quality"
description: "Chief Revenue Officer rubric for packaging, pricing, sales proof, and expansion readiness."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["software", "sales_ops"]
capability: ["evaluation", "planning"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["baltor", "revenue", "pricing", "go-to-market"]
created: "2026-06-02"
updated: "2026-06-02"
dimensions:
  - id: "clear_paid_wedge"
    label: "Offer sells trusted engineering context packs, not an abstract platform"
    weight: 0.22
    scale: "0.0-1.0"
    evidence_required: "Sales materials focus on ticket/PR packs, fragile context freshness, source handles, and audit."
  - id: "measurable_roi"
    label: "Buyer can measure cycle-time, review churn, agent correction, token/tool-call, or security approval improvements"
    weight: 0.20
    scale: "0.0-1.0"
    evidence_required: "Pilot plan includes baseline, success metrics, reporting cadence, and conversion thresholds."
  - id: "packaging_ladder"
    label: "Packaging supports developer kit, team packs, enterprise gateway, and regulated tier expansion"
    weight: 0.16
    scale: "0.0-1.0"
    evidence_required: "SKU boundaries, included features, upsell path, and buyer persona are documented."
  - id: "sales_cycle_fit"
    label: "Deployment and proof avoid long enterprise procurement before value is demonstrated"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "Design-partner and paid-pilot motion can start read-only with limited repos and sources."
  - id: "competitive_story"
    label: "Positioning clearly complements coding agents, enterprise search, code intelligence, and MCP gateways"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "Battlecards explain why Baltor owns context packs, freshness, source trace, and cross-agent delivery."
  - id: "expansion_signals"
    label: "Product emits signals that support renewal and expansion"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "Usage by repos, teams, packs, sources, positive feedback, and blocked stale context are tracked."
scoring_method: "weighted_sum"
