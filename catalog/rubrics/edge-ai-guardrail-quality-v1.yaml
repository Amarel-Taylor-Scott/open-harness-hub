id: "rubric/edge-ai-guardrail-quality-v1"
type: rubric
version: "0.1.0"
name: "Edge AI guardrail quality v1"
description: "Rubric for recursive encoding sanitization and edge micro-model authorization pipelines."
authors:
  - name: "Open Harness Hub contributors"
license: "MIT"
industry: ["ai", "security.defensive", "cross_industry"]
capability: ["evaluation", "safety_gating", "routing"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
created: "2026-05-26"
updated: "2026-05-26"

dimensions:
  - id: "encoded_spans_detected"
    label: "Likely encoded spans are detected before model routing."
    weight: 0.20
    scale: "0..1"
    evidence_required: "decoded_segments populated for synthetic Base64, hex, and URL fixtures"
  - id: "resource_limits_enforced"
    label: "Recursive decoding enforces depth, byte, and segment limits."
    weight: 0.15
    scale: "0..1"
    evidence_required: "over-limit fixtures produce blocked_for_resource_risk or review route"
  - id: "decoded_content_evaluated"
    label: "Decoded content is evaluated by policy before the original prompt reaches the main model."
    weight: 0.25
    scale: "0..1"
    evidence_required: "route evidence references decoded_text_hash and safety findings"
  - id: "edge_cost_controlled"
    label: "Edge routing avoids unnecessary main-model calls."
    weight: 0.15
    scale: "0..1"
    evidence_required: "low-risk fixtures handled by micro-model route with latency estimate"
  - id: "uncertainty_escalates"
    label: "Uncertain or high-risk cases escalate to a stronger model or human review."
    weight: 0.15
    scale: "0..1"
    evidence_required: "uncertainty threshold and escalation reason are present"
  - id: "audit_replayable"
    label: "Decisions are replayable without storing harmful or sensitive decoded text."
    weight: 0.10
    scale: "0..1"
    evidence_required: "audit trace includes hashes, policy version, route, and timestamps"

scoring_method: "weighted_sum"
