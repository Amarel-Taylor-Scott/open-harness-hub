id: "rubric/baltor-business-operating-readiness-quality"
type: rubric
version: "0.1.0"
name: "Baltor business operating readiness quality"
description: "Hierarchical rubric for customer value, operating model, revenue readiness, cost control, implementation readiness, and expansion risk."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["software", "sales_ops", "customer_success", "finance"]
capability: ["evaluation", "planning", "governance", "verification"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "stable"
tags: ["baltor", "business-readiness", "customer-value", "operations", "revenue"]
created: "2026-06-02"
updated: "2026-06-02"
dimensions:
  - id: "1.1"
    label: "Customer problem: target users can name the context-quality, source-trust, stale-context, or governance pain in their own workflow"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review interview notes, workflow walkthroughs, lost-time examples, and buyer/user quotes."
  - id: "1.2"
    label: "Customer problem: the wedge is concrete enough to sell as trusted context packs for tickets, PRs, repos, incidents, or reviews"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check positioning, demo flow, pack examples, and design-partner use cases."
  - id: "1.3"
    label: "Customer problem: the system focuses on syncing raw context, processing it, finding fragile information, and keeping it current"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review product scope, roadmap, and features that are intentionally left to downstream systems."
  - id: "2.1"
    label: "Value proof: context packs reduce context-gathering time or agent correction time"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Inspect before/after timing, pilot telemetry, developer feedback, and agent task transcripts."
  - id: "2.2"
    label: "Value proof: source handles and freshness labels increase review trust"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review reviewer feedback, sourced vs unsourced pack comparisons, and expansion logs."
  - id: "2.3"
    label: "Value proof: fragile-information detection catches stale, conflicting, informal, or risky assumptions"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check fragile-context reports, conflict examples, stale warnings, and avoided-error narratives."
  - id: "2.4"
    label: "Value proof: governance and audit reduce security review friction for agent rollout"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review security stakeholder feedback, audit exports, policy demos, and approval timelines."
  - id: "3.1"
    label: "Adoption: developers can use Baltor through existing agent, CLI, IDE, PR, or CI workflows"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check MCP tools, CLI commands, PR comments, CI checks, and no-new-UI usage paths."
  - id: "3.2"
    label: "Adoption: first useful pack can be generated quickly after connector access"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review setup logs, connector requirements, initial pack time, and onboarding checklist."
  - id: "3.3"
    label: "Adoption: users can give lightweight feedback on usefulness, missing context, stale context, and wrong claims"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Inspect feedback UI/tooling, event schema, and how feedback changes future packs."
  - id: "4.1"
    label: "Operating model: connector setup, source scoping, permission mapping, and pack templates are repeatable"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review implementation checklist, runbooks, templates, and support handoff."
  - id: "4.2"
    label: "Operating model: support can diagnose missing, stale, overbroad, too-small, unauthorized, or slow packs"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check support dashboards, traces, failure taxonomy, and customer-facing diagnostics."
  - id: "4.3"
    label: "Operating model: customer success has success metrics, review cadence, and expansion triggers"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review pilot plan, weekly review format, success thresholds, and expansion playbook."
  - id: "5.1"
    label: "Revenue: paid pilot package has clear scope, buyer, timeline, deliverables, and conversion path"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Inspect pilot offer, commercial terms, target buyer, success criteria, and renewal/expansion terms."
  - id: "5.2"
    label: "Revenue: packaging separates developer kit, team packs, enterprise governance, and regulated deployment"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review packaging ladder, feature boundaries, pricing metric, and upgrade path."
  - id: "5.3"
    label: "Revenue: competitive story avoids being a generic enterprise search or coding-agent product"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check positioning against Rovo, Glean, Sourcegraph, Augment, Copilot, Cursor, Claude Code, and MCP gateways."
  - id: "6.1"
    label: "Cost: pack generation unit economics are measurable by source fetches, tokens, embeddings, reranks, compression, and storage"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review cost ledger, pack-level unit cost, model tier use, cache hit rates, and gross margin estimates."
  - id: "6.2"
    label: "Cost: expensive capabilities are gated by risk, customer value, uncertainty, and freshness needs"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Inspect routing policy, rerank depth, model escalation, refresh priority, and budget controls."
  - id: "6.3"
    label: "Cost: architecture supports cloud portability and procurement-friendly deployment"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Check deployment options, managed service alternatives, private deployment path, and vendor-risk notes."
  - id: "7.1"
    label: "Risk: roadmap avoids overbuilding broad context-fabric capabilities before proving the trusted-pack wedge"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Review roadmap sequencing, out-of-scope list, and evidence required before building larger platform features."
  - id: "7.2"
    label: "Risk: security, privacy, connector access, incumbent bundling, and developer bypass risks have owners and mitigations"
    weight: 0.04
    scale: "0.0-1.0"
    evidence_required: "Inspect risk register, owner list, mitigation plan, and review cadence."
scoring_method: "weighted_sum"
