# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# Run from repo root: docker compose -f deploy/docker-compose.deploy.yml up
# Worker fleet: --profile workers (scaled manually here; KEDA on k8s / controller on Fly).
# depends_on mailbox→identity omitted: runtime seam (best-effort/on-demand) that would form a start-order cycle; compose depends_on is ordering only.
name: aidoneright
services:
  identity:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.identity_local_service", "--serve"]
    environment:
      MAILBOX_INGEST_URL: "http://mailbox:9428"
      OH_BIND_HOST: "0.0.0.0"
    volumes: [identity_state:/app/dist/identity]
    depends_on: ["mailbox"]
    restart: unless-stopped
  registry:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.registry_local_service"]
    environment:
      AIDR_IDENTITY_BASE: "http://identity:9410"
      OH_BIND_HOST: "0.0.0.0"
    volumes: [registry_state:/app/dist/registry]
    depends_on: ["identity"]
    restart: unless-stopped
  events:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.events_local_service"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
    volumes: [events_state:/app/dist/analytics]
    restart: unless-stopped
  receipt:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "scripts/receipt_local_service.py"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
    volumes: [receipt_state:/app/dist/local-services-state]
    restart: unless-stopped
  state:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "scripts/state_local_service.py"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
    volumes: [state_state:/app/dist/local-services-state]
    restart: unless-stopped
  mailbox:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "scripts/mailbox_local_service.py"]
    environment:
      AIDR_IDENTITY_BASE: "http://identity:9410"
      OH_BIND_HOST: "0.0.0.0"
    volumes: [mailbox_state:/app/dist/email-outbox]
    restart: unless-stopped
  teleon-runtime:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "scripts/teleon_local_runtime.py"]
    environment:
      AIDR_IDENTITY_BASE: "http://identity:9410"
      OH_BIND_HOST: "0.0.0.0"
    volumes: [teleon_runtime_state:/app/dist/local-services-state]
    depends_on: ["identity"]
    restart: unless-stopped
  baltor-backend:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "scripts/baltor_admin_demo_server.py", "--port", "9301"]
    environment:
      ADMIN_DEMO_UPLOAD_DIR: "/app/dist/local-services-state/admin-demo-uploads"
      BALTOR_DURABLE_DB: "/app/dist/local-services-state/durable.db"
      BALTOR_QUEUE_HEALTH_HISTORY: "/app/dist/local-services-state/baltor-queue-health-history.jsonl"
      CONTEXT_WORKER_LEDGER: "/app/dist/local-services-state/context-workers-ledger.jsonl"
      OH_BIND_HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379/0"
    volumes: [baltor_backend_state:/app/dist/local-services-state]
    restart: unless-stopped
  web-openhubforai:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.showcase", "--port", "8000"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
      OH_PRODUCT: "openhubforai"
      OH_SEAM_ANALYTICS_BASE: "http://events:9420"
      OH_SEAM_IDENTITY_BASE: "http://identity:9410"
      OH_SEAM_LIVEOPS_BASE: "http://baltor-backend:9301"
      OH_SEAM_MAILBOX_BASE: "http://mailbox:9428"
      OH_SEAM_REGISTRY_BASE: "http://registry:9423"
      OH_SEAM_TELEON_RUNTIME_BASE: "http://teleon-runtime:9430"
    ports: ["8000:8000"]
    depends_on: ["baltor-backend", "events", "identity", "mailbox", "registry", "teleon-runtime"]
    restart: unless-stopped
  web-baltor:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.showcase", "--port", "8001"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
      OH_PRODUCT: "baltor"
      OH_SEAM_ANALYTICS_BASE: "http://events:9420"
      OH_SEAM_IDENTITY_BASE: "http://identity:9410"
      OH_SEAM_LIVEOPS_BASE: "http://baltor-backend:9301"
      OH_SEAM_MAILBOX_BASE: "http://mailbox:9428"
      OH_SEAM_REGISTRY_BASE: "http://registry:9423"
      OH_SEAM_TELEON_RUNTIME_BASE: "http://teleon-runtime:9430"
    ports: ["8001:8001"]
    depends_on: ["baltor-backend", "events", "identity", "mailbox", "registry", "teleon-runtime"]
    restart: unless-stopped
  web-context:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.showcase", "--port", "8002"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
      OH_PRODUCT: "context-is-everything"
      OH_SEAM_ANALYTICS_BASE: "http://events:9420"
      OH_SEAM_IDENTITY_BASE: "http://identity:9410"
      OH_SEAM_LIVEOPS_BASE: "http://baltor-backend:9301"
      OH_SEAM_MAILBOX_BASE: "http://mailbox:9428"
      OH_SEAM_REGISTRY_BASE: "http://registry:9423"
      OH_SEAM_TELEON_RUNTIME_BASE: "http://teleon-runtime:9430"
    ports: ["8002:8002"]
    depends_on: ["baltor-backend", "events", "identity", "mailbox", "registry", "teleon-runtime"]
    restart: unless-stopped
  web-teleon:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python3", "-m", "scripts.showcase", "--port", "8003"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
      OH_PRODUCT: "teleon"
      OH_SEAM_ANALYTICS_BASE: "http://events:9420"
      OH_SEAM_IDENTITY_BASE: "http://identity:9410"
      OH_SEAM_LIVEOPS_BASE: "http://baltor-backend:9301"
      OH_SEAM_MAILBOX_BASE: "http://mailbox:9428"
      OH_SEAM_REGISTRY_BASE: "http://registry:9423"
      OH_SEAM_TELEON_RUNTIME_BASE: "http://teleon-runtime:9430"
    ports: ["8003:8003"]
    depends_on: ["baltor-backend", "events", "identity", "mailbox", "registry", "teleon-runtime"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
    volumes: [redis_state:/data]
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      OH_BIND_HOST: "0.0.0.0"
      PGDATA: "/data/pgdata"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    volumes: [postgres_state:/data]
    profiles: [phase2]
    restart: unless-stopped
  worker:
    build: { context: .., dockerfile: Dockerfile }
    command: ["python", "-m", "scripts.foundry.worker", "--serve"]
    environment:
      OH_BIND_HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379/0"
    profiles: [workers]
    depends_on: ["redis"]
    restart: unless-stopped
volumes:
  baltor_backend_state:
  events_state:
  identity_state:
  mailbox_state:
  postgres_state:
  receipt_state:
  redis_state:
  registry_state:
  state_state:
  teleon_runtime_state:
