// mode: 'signin' | 'signup' | 'forgot' — self-navigating via the kit's hash router
function OhAuth({ brand, mode }) {
  const signup = mode === 'signup';
  const forgot = mode === 'forgot';
  const [sent, setSent] = React.useState(false);
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [name, setName] = React.useState('');
  const [err, setErr] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const bn = brand.name + (brand.tld || '');
  const realm = window.OHIdentity ? window.OHIdentity.realmOf(brand) : (brand.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');

  // WIRED to the real identity service (scripts/identity_local_service.py). Honest: if the service
  // is unreachable we fall to the in-tab preview path (flagged), never faking a real session.
  async function submitAuth() {
    setErr('');
    if (!email || email.indexOf('@') < 0) { setErr('Enter a valid work email.'); return; }
    if (pass.length < 8) { setErr('Use a passphrase of at least 8 characters.'); return; }
    // Preview path (no client or service down): flag it so the dashboard shows the preview
    // banner — never let an unsaved preview look like a real, persisted sign-up.
    const enterPreview = () => { try { sessionStorage.setItem('oh-preview', '1'); } catch (e) {} navigate('/dashboard'); };
    if (!window.OHIdentity) { enterPreview(); return; }
    setBusy(true);
    let live = false;
    try { live = await window.OHIdentity.available(); } catch (e) {}
    if (!live) { setBusy(false); enterPreview(); return; } // preview path — identity service down
    try {
      const r = signup ? await window.OHIdentity.signup(realm, email, pass) : await window.OHIdentity.login(realm, email, pass);
      setBusy(false);
      if (r && r.ok) { try { sessionStorage.removeItem('oh-preview'); } catch (e) {} navigate('/dashboard'); }  // real session — clear any stale preview flag
      else { setErr((r && r.error) || 'Authentication failed (this brand may not have a live realm yet).'); }
    } catch (e) { setBusy(false); setErr('Service error — please try again.'); }
  }
  const SEAM = 'Social sign-in is coming soon — use your email to continue.';

  return (
    <div className="ohs-auth">
      <div className="oh-card ohs-auth-card">
        <div className="ohs-auth-logo"><OhLogo brand={brand} /></div>
        {forgot ? (
          sent ? (
            <>
              <h1>Check your email</h1>
              <div className="sub">If an account exists for that address, a reset link is on its way (rendered to the local outbox in preview).</div>
              <button className="oh-btn oh-btn--primary" onClick={() => navigate('/signin')}>Back to sign in</button>
            </>
          ) : (
            <>
              <h1>Reset your password</h1>
              <div className="sub">Enter your email and we’ll send you a reset link.</div>
              <label className="oh-field"><span>Work email</span><input type="email" placeholder="you@company.com" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
              <button className="oh-btn oh-btn--primary" onClick={() => setSent(true)}>Send reset link</button>
              <div className="ohs-auth-alt"><a onClick={() => navigate('/signin')}>← Back to sign in</a></div>
            </>
          )
        ) : (
          <>
            <h1>{signup ? 'Create your account' : 'Welcome back'}</h1>
            <div className="sub">{signup ? `Start building on ${bn}.` : `Sign in to ${bn}.`}</div>
            <div className="ohs-oauth">
              <button className="ohs-oauth-btn" disabled title={SEAM} style={{ opacity: .55, cursor: 'not-allowed' }}>◑ Continue with Google</button>
              <button className="ohs-oauth-btn" disabled title={SEAM} style={{ opacity: .55, cursor: 'not-allowed' }}>⎔ Continue with GitHub</button>
            </div>
            <div className="ohs-divider">or</div>
            {signup && <label className="oh-field"><span>Name</span><input placeholder="Ada Lovelace" value={name} onChange={(e) => setName(e.target.value)} /></label>}
            <label className="oh-field"><span>Work email</span><input type="email" placeholder="you@company.com" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submitAuth(); }} /></label>
            <label className="oh-field">
              <span className="ohs-field-row"><span>Password</span>{!signup && <a className="ohs-forgot" onClick={() => navigate('/forgot')}>Forgot?</a>}</span>
              <input type="password" placeholder="••••••••" value={pass} onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submitAuth(); }} />
            </label>
            {err && <div className="ohs-auth-err" style={{ color: 'var(--danger, #c0392b)', fontSize: '12.5px', margin: '2px 0 6px' }}>{err}</div>}
            <button className="oh-btn oh-btn--primary" disabled={busy} onClick={submitAuth}>{busy ? (signup ? 'Creating…' : 'Signing in…') : (signup ? 'Create account' : 'Sign in')}</button>
            <div className="ohs-auth-alt">
              {signup ? 'Already have an account? ' : 'New here? '}
              <a onClick={() => navigate(signup ? '/signin' : '/signup')}>{signup ? 'Sign in' : 'Create one'}</a>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// keys: [{name, prefix, created, lastUsed}]
function OhApiKeys({ keys }) {
  const fixtures = keys || [
    { name: 'Production', prefix: 'sk_live_9f2c', created: 'Mar 4, 2026', lastUsed: '2h ago' },
    { name: 'CI', prefix: 'sk_live_3b71', created: 'Feb 1, 2026', lastUsed: '1d ago' },
    { name: 'Local dev', prefix: 'sk_test_a1f0', created: 'Jan 12, 2026', lastUsed: '3w ago' },
  ];
  // Live seam (same honesty contract as OhAuth): "+ Create key" mints a REAL key through the
  // realm identity service when this origin holds a real realm session; signed out or service
  // down → an honest note, never a fabricated key. The raw key is shown exactly once (the
  // service never persists it — oh-identity.js mintKey). Fixture rows are design data; minted
  // rows are real and individually revocable.
  const realm = React.useMemo(() => {
    try {
      for (let i = 0; i < localStorage.length; i += 1) {
        const k = localStorage.key(i);
        if (k && k.indexOf('oh-session-') === 0) {
          const s = JSON.parse(localStorage.getItem(k) || 'null');
          if (s && s.session_id) return k.slice('oh-session-'.length);
        }
      }
    } catch (e) {}
    return null;
  }, []);
  const [minted, setMinted] = React.useState([]);
  const [reveal, setReveal] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [note, setNote] = React.useState('');
  const mint = async () => {
    if (busy) return;
    if (!window.OHIdentity || !realm) {
      setNote('Sign in first — keys are minted against your real account (no simulated keys).');
      return;
    }
    setBusy(true); setNote('');
    try {
      const r = await window.OHIdentity.mintKey(realm, ['read']);
      if (r && r.status === 201 && r.body && r.body.api_key) {
        setReveal(r.body.api_key);
        setMinted((m) => [{ id: r.body.key_id, name: 'Minted via console', prefix: r.body.prefix || r.body.api_key.slice(0, 12), created: 'just now', lastUsed: '—', real: true }, ...m]);
      } else {
        setNote((r && r.body && r.body.error) || 'mint failed — no key was created');
      }
    } catch (e) { setNote('identity service unreachable — no key was created'); }
    setBusy(false);
  };
  const revoke = async (k) => {
    try {
      const r = await window.OHIdentity.revokeKey(realm, k.id);
      if (r && (r.status === 200 || r.status === 202)) setMinted((m) => m.filter((x) => x.id !== k.id));
    } catch (e) {}
  };
  const list = [...minted, ...fixtures];
  return (
    <div className="ohs-page">
      <OhPageHead eyebrow="Developers" title="API keys" sub="Create and manage the keys your agents authenticate with."
        actions={<button className="oh-btn oh-btn--primary" disabled={busy} onClick={mint}>{busy ? 'Creating…' : '+ Create key'}</button>} />
      {reveal && (
        <div className="oh-card oh-card--pad" style={{ marginBottom: 18 }}>
          <div className="ohs-meter-row"><span>New key minted — copy it now; it is shown only once.</span><span className="mono">{realm}</span></div>
          <div className="ohs-hint mono" style={{ userSelect: 'all', wordBreak: 'break-all' }}>{reveal}</div>
        </div>

      {note && <div className="ohs-hint mono" style={{ marginBottom: 12 }}>{note}</div>}
      <div className="oh-card oh-card--pad">
        <table className="oh-table">
          <thead><tr><th>Name</th><th>Key</th><th>Created</th><th>Last used</th><th></th></tr></thead>
          <tbody>
            {list.map((k, i) => (
              <tr key={k.real ? k.id : 'fx' + i}>
                <td>{k.name}{k.real && <span className="oh-badge oh-badge--verified oh-badge--sm" style={{ marginLeft: 8 }}>real</span>}</td>
                <td className="mono">{k.prefix}••••••••</td>

    ['concepts', 'Core concepts', `The objects you’ll work with in ${B.name}.`, [

      ['h2', 'Provenance'], ['p', 'A signed origin chain you can verify by hash — the audit trail behind every artifact.'],
    ]],

      ['code', 'curl https://api.' + (B.name.toLowerCase()) + (B.tld || '') + '/v1/ping \\\n  -H "Authorization: Bearer $CIE_API_KEY"'],

      <header className="ohs-docs-top">

        </a>
        <nav className="ohs-docs-nav">{TABS.map(([k, l]) => <a key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</a>)}</nav>
        <span className="ohs-spacer" />

            <p className="ohs-docs-p mono">Authorization: Bearer &lt;token&gt;</p>

        </div>
      )}
    </div>

}

// ---------- experiments + tracking (thin React layer over window.OHExp) ----------
// usage: const [variant, { track }] = useExperiment('hero', ['A','B','C']);
// fires an exposure on mount; `track('cta_click', {…})` records a conversion with the variant.
function useExperiment(key, variants, opts) {
  const E = (typeof window !== 'undefined') && window.OHExp;
  if (E && variants) E.define(key, variants, opts);
  const first = variants && variants[0];
  const fallback = first && (first.id || first);
  const [v, setV] = React.useState(() => (E ? E.variant(key) : fallback) || fallback);
  React.useEffect(() => {
    if (!E) return undefined;
    E.exposure(key);
    return E.onChange((k) => { if (k == null || k === key) setV(E.variant(key)); });
  }, [key]);
  const track = React.useCallback((ev, props) => { if (E) E.track(ev, Object.assign({ experiment: key, variant: v }, props || {})); }, [key, v]);
  const assign = React.useCallback((id) => { if (E) E.assign(key, id); }, [key]);
  return [v, { track, assign }];
}

// floating dev panel: force variants, watch live exposure/conversion counts. Renders
// nothing if oh-experiments.js isn't loaded. Drop one <OhExperimentsPanel/> per site.
function OhExperimentsPanel() {
  const E = (typeof window !== 'undefined') && window.OHExp;
  const [open, setOpen] = React.useState(false);
  const [, force] = React.useReducer((x) => x + 1, 0);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!E) return undefined;
    const offC = E.onChange(() => force()); const offT = E.onTrack(() => force());
    return () => { offC(); offT(); };
  }, []);
  React.useEffect(() => {
    if (!open) return undefined;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('pointerdown', onDoc, true); document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDoc, true); document.removeEventListener('keydown', onKey); };
  }, [open]);
  if (!E) return null;
  const exps = E.experiments();
  const events = E.events();
  const statsFor = (key) => {
    const rows = {};
    events.forEach((ev) => {
      const variant = ev.exp ? ev.exp[key] : null; if (variant == null) return;
      rows[variant] = rows[variant] || { exp: 0, conv: 0 };
      if (ev.event === '$exposure') rows[variant].exp += 1; else rows[variant].conv += 1;
    });
    return rows;
  };
  return (
    <div className={'ohx' + (open ? ' open' : '')} ref={ref}>
      {open && (
        <div className="ohx-panel" role="dialog" aria-label="Experiments and tracking">
          <div className="ohx-head"><span>Experiments &amp; tracking</span><button className="ohx-x" onClick={() => E.reset()} title="Reset assignments + events">reset</button></div>
          {!exps.length && <div className="ohx-empty">No experiments registered on this page.</div>}
          {exps.map((x) => {
            const st = statsFor(x.key);
            return (
              <div className="ohx-exp" key={x.key}>
                <div className="ohx-exp-h"><span className="k">{x.key}</span>{x.overridden && <span className="ohx-tag">forced</span>}</div>
                <div className="ohx-variants">
                  {x.variants.map((id) => {
                    const s = st[id] || { exp: 0, conv: 0 };
                    const rate = s.exp ? Math.round((s.conv / s.exp) * 100) : 0;
                    return (
                      <button key={id} className={'ohx-var' + (x.assigned === id ? ' on' : '')} onClick={() => E.assign(x.key, id)}>
                        <span className="vid">{id}</span>
                        <span className="vmetrics mono">{s.exp}·{s.conv} <b>{rate}%</b></span>
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
          <div className="ohx-foot mono">exposures · conversions · rate · visitor {E.visitorId().slice(0, 10)} · {events.length} events</div>
        </div>
      )}
      <button className="ohx-trigger" aria-expanded={open} onClick={() => setOpen((o) => !o)} title="Experiments & tracking">
        <span className="g" aria-hidden="true">⚗</span><span className="lbl">Experiments</span>
      </button>
    </div>
  );
}

// ---------- command palette (⌘K) ----------
// commands: [{ label, href, icon?, group?, onSelect? }]  OR derive via fromNav().
// Self-contained: opens on ⌘K / Ctrl-K and on a window 'oh-cmdk' event (so a search box can
// dispatch it). Fuzzy-filters by label, keyboard up/down/enter/esc, tracks selection via OHExp.
OhCommandK.fromNav = function (nav, groups) {
  const out = [];
  (nav || []).forEach(([href, icon, label]) => out.push({ label, href, icon, group: 'Navigate' }));
  (groups || []).forEach((g) => (g.items || []).forEach(([href, icon, label]) => out.push({ label, href, icon, group: g.label })));
  return out;
};
function OhCommandK({ commands, placeholder, label }) {
  const list = commands || [];
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState('');
  const [i, setI] = React.useState(0);
  React.useEffect(() => {
    const onEvt = () => setOpen(true);
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setOpen((o) => !o); }
    };
    window.addEventListener('oh-cmdk', onEvt); window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('oh-cmdk', onEvt); window.removeEventListener('keydown', onKey); };
  }, []);
  React.useEffect(() => { if (open) { setQ(''); setI(0); } }, [open]);
  const ql = q.trim().toLowerCase();
  const filtered = ql ? list.filter((c) => c.label.toLowerCase().includes(ql) || (c.group || '').toLowerCase().includes(ql)) : list;
  const pick = (idx) => {
    const c = filtered[idx]; if (!c) return;
    try { if (window.OHExp) window.OHExp.track('cmdk_select', { label: c.label, href: c.href, query: q }); } catch (e) {}
    setOpen(false);
    if (c.onSelect) c.onSelect(); else if (c.href) navigate(c.href);
  };
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setI((n) => Math.min(n + 1, filtered.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setI((n) => Math.max(n - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(i); }
    else if (e.key === 'Escape') { e.preventDefault(); setOpen(false); }
  };
  if (!open) return null;
  let lastGroup = null;
  return (
    <div className="ohk-overlay" onClick={() => setOpen(false)}>
      <div className="ohk-modal" role="dialog" aria-label="Command palette" onClick={(e) => e.stopPropagation()}>
        <div className="ohk-input">
          <span className="ohk-mag" aria-hidden="true">⌕</span>
          <input autoFocus placeholder={placeholder || 'Search or jump to…'} value={q}
            onChange={(e) => { setQ(e.target.value); setI(0); }} onKeyDown={onKey} />
          <span className="oh-kbd">esc</span>
        </div>
        <div className="ohk-list">
          {filtered.map((c, idx) => {
            const head = c.group && c.group !== lastGroup ? c.group : null; lastGroup = c.group;
            return (
              <React.Fragment key={(c.href || c.label) + idx}>
                {head && <div className="ohk-group">{head}</div>}
                <div className={'ohk-item' + (idx === i ? ' on' : '')} onMouseEnter={() => setI(idx)} onClick={() => pick(idx)}>
                  {c.icon && <span className="ohk-ic" aria-hidden="true">{c.icon}</span>}
                  <span className="ohk-label">{c.label}</span>
                  {idx === i && <span className="oh-kbd ohk-enter">↵</span>}
                </div>
              </React.Fragment>
            );
          })}
          {!filtered.length && <div className="ohk-empty">No matches for “{q}”</div>}
        </div>
        <div className="ohk-foot mono">{label || 'Jump to anything'} · ↑↓ to move · ↵ to open</div>
      </div>
    </div>
  );
}

// turn a pasted "role: text" transcript into engine messages (role inferred; default user)
function parseSession(text) {
  return String(text || '').split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
    const m = line.match(/^(user|agent|assistant|tool|system)\s*:\s*(.*)$/i);
    if (!m) return { role: 'user', content: line };
    const r = m[1].toLowerCase();
    return { role: r === 'agent' ? 'assistant' : r, content: m[2] };
  });
}

// the observer engine's finding types → the demo's display label + severity
const FINDING_LABELS = {
  reinvention: 'Reinvention', stack_reinvention: 'Reinvention', product_reinvention: 'Reinvention',
  reinvention_cluster: 'Reinvention', footgun: 'Risky command', oversized_context: 'Wasted context',
  duplicate_context: 'Wasted context', adversarial: 'Question the assumption', shortcut: 'Repeated action',
  guidance: 'Convention', alternative: 'Missed cheaper path',
};
function mapServerFinding(f) {
  const conf = typeof f.confidence === 'number' ? f.confidence : 0.5;
  const sev = conf >= 0.85 ? 'high' : conf >= 0.6 ? 'medium' : 'low';
  const label = FINDING_LABELS[f.type] || String(f.type || 'Finding').replace(/_/g, ' ');
  const text = [f.message, f.suggestion].filter(Boolean).join(' — ');
  return { type: label, sev, conf, text: text || f.message || '' };
}

// the live demo: paste a session (or load the example) → POST it to the observer backend
// (/api/observer/review) and render the REAL governed findings. On any error (no backend reachable,
// non-2xx, bad payload) fall back to the built-in client-side preview so the demo never breaks.
function ReviewDemo() {
  const [text, setText] = React.useState('');
  const [reviewed, setReviewed] = React.useState(false);
  const [busy, setBusy] = React.useState(false);
  const [findings, setFindings] = React.useState([]);
  const [source, setSource] = React.useState('live'); // 'live' = real backend · 'preview' = fallback
  const fileRef = React.useRef(null);

  // manual upload: read a transcript FILE (.jsonl/.json/.txt/.md, Claude Code or Codex) into the box; it then
  // reviews exactly like a paste. Read-only, in-browser — the file is never uploaded anywhere.
  const onUpload = React.useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setText(String(reader.result || '')); setReviewed(false); };
    reader.readAsText(file);
    e.target.value = '';   // allow re-selecting the same file
  }, []);

  const runReview = React.useCallback(async () => {
    const messages = parseSession(text || SESSION_EXAMPLE);
    setBusy(true);
    try {
      const res = await fetch('/api/observer/review', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      if (!res.ok) throw new Error('observer backend status ' + res.status);
      const data = await res.json();
      const report = Array.isArray(data.report) ? data.report : [];
      setFindings(report.map(mapServerFinding).sort((a, b) => b.conf - a.conf));
      setSource('live');
    } catch (e) {
      // backend unreachable/unhealthy → keep the demo alive with the client-side preview
      setFindings(FINDINGS.slice().sort((a, b) => b.conf - a.conf));
      setSource('preview');
    } finally {
      setBusy(false);
      setReviewed(true);
    }
  }, [text]);

  const note = source === 'preview'
    ? 'Preview review (the observer backend was not reachable). Installed, AIDevObserver reviews your real sessions on your machine.'
    : (findings.length
        ? 'Live review from the observer engine on this machine. Every finding is a governed suggestion you triage — nothing is stored.'
        : 'Live review from the observer engine — no findings on this session. It looks clean.');

  return (
    <div className="ado-demo">
      <div className="oh-card oh-card--pad ado-demo-in">
        <label className="ado-demo-label" htmlFor="ado-session">Paste or upload an AI coding session</label>
        <textarea id="ado-session" className="ado-demo-ta" rows={8} value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder={'Paste a transcript (Claude Code or Codex), upload a .jsonl / .txt file, or load the example.'} />
        <input ref={fileRef} type="file" accept=".jsonl,.json,.txt,.md,.log" style={{ display: 'none' }} onChange={onUpload} />
        <div className="ado-demo-actions">
          <button className="oh-btn oh-btn--ghost" onClick={() => fileRef.current && fileRef.current.click()}>Upload a transcript</button>
          <button className="oh-btn oh-btn--ghost" onClick={() => { setText(SESSION_EXAMPLE); setReviewed(false); }}>Load the example</button>
          <button className="oh-btn oh-btn--primary" disabled={busy} onClick={runReview}>{busy ? 'Reviewing…' : 'Review the session →'}</button>
        </div>
      </div>
      {reviewed && (
        <div className="oh-card oh-card--pad ado-demo-out">
          <div className="ado-demo-out-h">
            <span className="ado-demo-out-t">Review</span>
            <span className="oh-badge oh-badge--sm mono">{findings.length} findings · ranked</span>
          </div>
          {findings.length > 0 ? (
            <div className="ado-findings">
              {findings.map((f, i) => <FindingRow f={f} key={f.type + '-' + i} />)}
            </div>
          ) : (
            <div className="ado-demo-note mono">No findings — this session looks clean.</div>
          )}
          <div className="ado-demo-note mono">{note}</div>
        </div>
      )}
    </div>
  );
}

// list is OhTable. It talks to the REAL observer backend over the same-origin seam (/api/observer/*), the exact

const APP_NAV = [
  ['/app', '◉', 'Review'],
  ['/app/sessions', '≡', 'Sessions'],

function shortId(id) { const s = String(id || ''); return s.length > 14 ? s.slice(0, 8) + '…' + s.slice(-3) : s; }
function relTime(sec) {
  if (!sec) return '—';
  const s = Math.max(0, Date.now() / 1000 - sec);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24); if (d < 30) return d + 'd ago';
  return new Date(sec * 1000).toLocaleDateString();
}

// /app → Review (the paste-a-session demo, reused inside the shell)
function AppReview() {
  return (
    <>

// /app/sessions → the discovered local Claude Code sessions, in an OhTable. Picking one reviews it.
function AppSessions({ onReview, busyPath }) {
  const [rows, setRows] = React.useState(null);   // null = loading, [] = none
  const [err, setErr] = React.useState(false);
  React.useEffect(() => {
    let live = true;
    fetch('/api/observer/sessions')
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((d) => { if (live) setRows(Array.isArray(d.sessions) ? d.sessions : []); })
      .catch(() => { if (live) { setErr(true); setRows([]); } });
    return () => { live = false; };
  }, []);
  const cols = [
    { key: 'session_id', label: 'Session', sortable: true, sortValue: (r) => r.session_id,
      render: (r) => <span className="mono">{shortId(r.session_id)}</span> },
    { key: 'project', label: 'Project', sortable: true },
    { key: 'mtime', label: 'Modified', sortable: true, sortValue: (r) => r.mtime, render: (r) => relTime(r.mtime) },
    { key: '_act', label: '', align: 'right', render: (r) => (
      <button className="oh-btn oh-btn--ghost oh-btn--sm" disabled={busyPath === r.path}
        onClick={(e) => { e.stopPropagation(); onReview(r); }}>{busyPath === r.path ? 'Reviewing…' : 'Review →'}</button>) },
  ];
  const empty = err
    ? 'The observer service is not reachable. Start it with: python3 scripts/observer_local_service.py --serve'
    : 'No local sessions found yet. Start a Claude Code session in this project, or paste one on the Review page.';
  return (
    <>
      <OhPageHead eyebrow="Sessions" title="Local AI coding sessions"
        sub="AIDevObserver discovers your Claude Code sessions for this project. Pick one to review. Read only — discovery reads file metadata, never the transcript content." />
      {rows === null ? <div className="ohl-empty">Loading sessions…</div>
        : <OhTable cols={cols} rows={rows} rowKey={(r) => r.path} onRow={(r) => onReview(r)} empty={empty} />}
    </>
  );
}

// /app/findings → the most recent review's findings, ranked. Honest when the service was unreachable.

// a worked agentic loop (a thrashing, then footgun-ending, run) the Agentic screen supervises
const AGENTIC_EXAMPLE = [
  { action: 'run pytest tests/importer', ok: false, error: 'ImportError: no module named csvkit' },
  { action: 'run pytest tests/importer', ok: false, error: 'ImportError: no module named csvkit' },
  { action: 'run pytest tests/importer', ok: false, error: 'ImportError: no module named csvkit' },
  { action: 'pip install csvkit && git push --force origin main', ok: true },
];

// /app/agentic → supervise an AUTONOMOUS agent loop (not a human session): POST it to the observer agentic
// endpoint and render the verdict + loop-shape findings. On an unreachable backend, a client-side preview.
function AppAgentic() {
  const [run, setRun] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [source, setSource] = React.useState('live');

  const supervise = React.useCallback(async () => {
    setBusy(true);
    try {
      const res = await fetch('/api/observer/agentic', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ steps: AGENTIC_EXAMPLE, goal: 'fix the importer test suite', budget: { max_steps: 8 } }),
      });
      if (!res.ok) throw new Error('observer backend status ' + res.status);
      setRun(await res.json()); setSource('live');
    } catch (e) {
      setRun({ report: [
        { type: 'agentic_loop', confidence: 0.9, message: 'the same action ran 3 times in a row (thrash) starting at step 0', suggestion: 'break the loop: change the approach, or stop and surface the blocker' },
        { type: 'footgun', confidence: 0.85, message: 'a force-push to a shared branch can destroy history', suggestion: 'use a protected push or a feature branch instead' },
        { type: 'agentic_repeated_failure', confidence: 0.82, message: 'the same failure recurred 3 times: importerror', suggestion: 'stop retrying the same failing path; escalate or change strategy' },
      ], summary: { steps: 4, failures: 3, findings: 3, verdict: 'stalled_or_runaway' }, serves_truth: false });
      setSource('preview');
    } finally { setBusy(false); }
  }, []);

  const findings = run ? (run.report || []).map(mapServerFinding).sort((a, b) => b.conf - a.conf) : [];
  const s = run ? (run.summary || {}) : {};
  return (
    <>
      <OhPageHead eyebrow="Agentic runs" title="Supervise an autonomous agent loop"
        sub="AIDevObserver watches autonomous agent loops (a flywheel / worker / any agent runner), not just human sessions. It flags thrash, stalls, repeated failures, budget overruns, and goal drift — and recommends a halt on a runaway. Read only — it never kills a process." />
      <div className="ado-demo-actions" style={{ marginBottom: 14 }}>
        <button className="oh-btn oh-btn--primary" disabled={busy} onClick={supervise}>{busy ? 'Supervising…' : 'Supervise the example run →'}</button>
      </div>
      {run && (
        <>
          <OhRollup items={[
            ['Verdict', s.verdict || '—'],
            ['Steps', s.steps != null ? s.steps : '—'],
            ['Failures', s.failures != null ? s.failures : '—'],
            ['Source', source === 'live' ? 'live engine' : 'preview'],
          ]} />
          <div className="ado-findings">{findings.map((f, i) => <FindingRow f={f} key={f.type + '-' + i} />)}</div>
        </>
      )}
    </>
  );
}

function ObserverApp({ route, theme, onToggle }) {
  const [report, setReport] = React.useState(null);
  const [source, setSource] = React.useState('live');
  const [session, setSession] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [busyPath, setBusyPath] = React.useState(null);

  // review a DISCOVERED session by its transcript path (the engine reads the file server-side). On an
  // unreachable backend we stay honest: the transcript is never in the browser, so we report "not reviewed"
  // rather than inventing findings (the paste demo, which HAS the text, keeps its own preview fallback).
  const runReview = React.useCallback(async (sess) => {
    setBusyPath(sess.path); setError(null);
    try {
      const res = await fetch('/api/observer/review', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript_path: sess.path }),
      });
      if (!res.ok) throw new Error('observer backend status ' + res.status);
      const data = await res.json();
      setReport(data); setSource('live'); setSession(sess.session_id);
    } catch (e) {
      setReport(null);
      setError('The observer service was not reachable, so this session was not reviewed. Discovery is metadata only — the transcript is never read in the browser.');
      setSession(sess.session_id);
    } finally { setBusyPath(null); navigate('/app/findings'); }
  }, []);

  const sub = (route || '').replace(/^\/app\/?/, '');
  let screen;
  if (sub === 'sessions') screen = <AppSessions onReview={runReview} busyPath={busyPath} />;
  else if (sub === 'findings') screen = <AppFindings report={report} source={source} session={session} error={error} />;
  else if (sub === 'agentic') screen = <AppAgentic />;
  else if (sub === 'settings') screen = <AppSettings />;
  else screen = <AppReview />;

  // exact-match the index route so "Review" is not also active on /app/sessions etc.
  const isActive = (h) => (h === '/app' ? (route === '/app' || route === '/app/') : (route === h || route.startsWith(h + '/')));
  const foot = (
    <>
      <button className="oh-btn oh-btn--ghost oh-btn--sm" style={{ width: '100%', justifyContent: 'center' }}
        onClick={() => navigate('/')}>← Back to site</button>
      <div className="ohs-side-foot-row">
        <span className="mono" style={{ fontSize: 11, color: 'var(--fg-muted)' }}>Read only</span>
        {onToggle && <OhThemeToggle theme={theme} onToggle={onToggle} />}
      </div>
    </>
  );

  return (
    <div className={'oh dir-s theme-' + theme + ' oh-site ado'} style={{ '--accent': ACCENT }}>
      <OhLayout variant="sidebar" brand={BRAND} sidebar={APP_NAV} route={route} isActive={isActive}
        foot={foot} theme={theme} onToggle={onToggle}>
        {screen}
      </OhLayout>
    </div>
  );
}

/* ===================== root ===================== */
function App() {
  const route = useHashRoute();
  const [theme, toggle] = useSiteTheme('aidevobserver-theme');
  const inApp = (route || '').replace(/^\//, '').startsWith('app');
  // marketing routes (/how, /runs, /demo, /trust) scroll to the section; the app routes (/app…) render the shell
  React.useEffect(() => {
    if (inApp) { window.scrollTo(0, 0); return; }
    const id = (route || '').replace(/^\//, '');
    if (id) scrollToId(id);
  }, [route, inApp]);
  if (inApp) return <ObserverApp route={route} theme={theme} onToggle={toggle} />;
  return <Landing theme={theme} onToggle={toggle} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
