services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-harness-postgres
    environment:
      POSTGRES_DB: open_harness_hub
      POSTGRES_USER: open_harness
      POSTGRES_PASSWORD: open_harness_dev
    ports:
      - "5432:5432"
    volumes:
      - open_harness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_harness -d open_harness_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  open_harness_pgdata:
