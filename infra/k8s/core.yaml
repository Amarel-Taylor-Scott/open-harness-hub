# core: namespace · config · secret (TEMPLATE) · redis broker
apiVersion: v1
kind: Namespace
metadata:
  name: openharnesshub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ohh-config
  namespace: openharnesshub
data:
  # Swap embedding/chat models here — single place, no code change (scripts/_config reads them).
  OH_CHAT_MODEL: "gpt-oss:120b"
  OH_EMBED_MODEL: "nomic-embed-text"
  FOUNDRY_QUEUE_KEY: "ohh:foundry:jobs"
---
# TEMPLATE ONLY — replace with sealed-secrets / external-secrets in production. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: ohh-secrets
  namespace: openharnesshub
type: Opaque
stringData:
  OLLAMA_API_KEY: "set-via-sealed-secrets-or-external-secrets"
  DATABASE_URL: "postgresql://user:pass@host:5432/ohh"   # managed Postgres + pgvector
  REDIS_URL: "redis://ohh-redis:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohh-redis           # the job broker (or use managed Redis: Upstash / MemoryStore)
  namespace: openharnesshub
spec:
  replicas: 1
  selector:
    matchLabels: { app: ohh-redis }
  template:
    metadata:
      labels: { app: ohh-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ohh-redis
  namespace: openharnesshub
spec:
  selector: { app: ohh-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
