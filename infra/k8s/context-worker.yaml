# Context Fidelity worker fleet.
# Same registry as local dev; Redis/KEDA provides cloud queue scaling.
# KEDA scales on the pending queue only. Governance queues are explicit
# destinations for operators/UI:
# - ohh:context:jobs:approval-required
# - ohh:context:jobs:budget-blocked
# - ohh:context:jobs:failed-permanently
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohh-context-worker
  namespace: openharnesshub
spec:
  replicas: 0
  selector:
    matchLabels: { app: ohh-context-worker }
  template:
    metadata:
      labels: { app: ohh-context-worker }
    spec:
      containers:
        - name: context-worker
          image: ghcr.io/Amarel-Taylor-Scott/openharnesshub:latest
          command: ["python", "-m", "scripts.context_workers.runner", "--watch"]
          env:
            - name: CONTEXT_QUEUE_KEY
              value: "ohh:context:jobs"
          envFrom:
            - configMapRef: { name: ohh-config }
            - secretRef: { name: ohh-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ohh-context-worker
  namespace: openharnesshub
spec:
  scaleTargetRef:
    name: ohh-context-worker
  minReplicaCount: 0
  maxReplicaCount: 50
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: redis
      metadata:
        address: ohh-redis:6379
        listName: "ohh:context:jobs"
        listLength: "25"
