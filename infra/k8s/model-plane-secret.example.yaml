# The model-plane env contract as a Secret (mirror of .env.example — fill and apply per
# namespace; ExternalSecrets/sealed-secrets in real clusters). Single source of the
# local→cloud difference, exactly as on a laptop.
apiVersion: v1
kind: Secret
metadata: { name: model-plane }
type: Opaque
stringData:
  OH_LLM_BACKEND: "auto"
  OH_LLM_BASE_URL: "https://ollama.com/v1"      # or https://openrouter.ai/api/v1
  OH_LLM_MODEL: "qwen3-next:80b"
  OH_LLM_API_KEY: "<provider key>"
  OH_EMBED_BACKEND: "http-openai"
  OH_EMBED_BASE_URL: "http://ollama-embed:11434/v1"   # in-cluster embeddings sidecar
  OH_EMBED_MODEL: "nomic-embed-text"
  OH_EMBED_API_KEY: "local-ollama"
  OH_INFERENCE_ALLOW_NETWORK: "1"
