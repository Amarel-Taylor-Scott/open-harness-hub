# Minimal OpenTelemetry Collector for the OHH platform. Receives OTLP traces + metrics from every
# service (services/platform/_shared/telemetry.py, via OTEL_EXPORTER_OTLP_ENDPOINT) and re-exports
# metrics for Prometheus to scrape on :8889. See docs/architecture/backend-services-and-platform.md.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
exporters:
  debug: { verbosity: normal }
  prometheus: { endpoint: 0.0.0.0:8889 }
service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
