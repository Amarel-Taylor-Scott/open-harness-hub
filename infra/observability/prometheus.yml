# Prometheus scrape config for the OHH platform (infra/docker-compose.platform.yml). Each service
# exposes /metrics via the telemetry contract (services/platform/_shared/telemetry.py); the port is
# set by OH_METRICS_PORT. The OTel collector re-exports traces-derived metrics on :8889.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: harness-hub-api
    static_configs: [{ targets: ["harness-hub-api:9101"] }]
  - job_name: context-enrichment-api
    static_configs: [{ targets: ["context-enrichment-api:9102"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9103"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
