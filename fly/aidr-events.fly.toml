# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: events (kind=backend)
app = "aidr-events"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # deploy from repo root: fly deploy -c fly/aidr-events.fly.toml

[processes]
  app = "python3 -m scripts.events_local_service"

[env]
  OH_BIND_HOST = "0.0.0.0"

[[mounts]]
  source = "events_state"
  destination = "/app/dist/analytics"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9420
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
