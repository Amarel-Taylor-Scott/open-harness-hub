# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: teleon-runtime (kind=backend)
app = "aidr-teleon-runtime"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # deploy from repo root: fly deploy -c fly/aidr-teleon-runtime.fly.toml

[processes]
  app = "python3 scripts/teleon_local_runtime.py"

[env]
  AIDR_IDENTITY_BASE = "http://aidr-identity.internal:9410"
  OH_BIND_HOST = "0.0.0.0"

# secrets (never in this file): fly secrets set -a aidr-teleon-runtime OH_LLM_BASE_URL=… OH_LLM_MODEL=… OH_LLM_API_KEY=… OH_EMBED_MODE=… OH_EMBED_MODEL=… OH_EMBED_BASE_URL=… OH_INFERENCE_ALLOW_NETWORK=… FLY_API_TOKEN=…

[[mounts]]
  source = "teleon_runtime_state"
  destination = "/app/dist/local-services-state"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9430
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
