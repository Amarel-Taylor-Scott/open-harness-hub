# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: baltor-backend (kind=backend)
app = "aidr-baltor-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # deploy from repo root: fly deploy -c fly/aidr-baltor-backend.fly.toml

[processes]
  app = "python3 scripts/baltor_admin_demo_server.py --port 9301"

[env]
  ADMIN_DEMO_UPLOAD_DIR = "/app/dist/local-services-state/admin-demo-uploads"
  BALTOR_DURABLE_DB = "/app/dist/local-services-state/durable.db"
  BALTOR_QUEUE_HEALTH_HISTORY = "/app/dist/local-services-state/baltor-queue-health-history.jsonl"
  CONTEXT_WORKER_LEDGER = "/app/dist/local-services-state/context-workers-ledger.jsonl"
  OH_BIND_HOST = "0.0.0.0"

# secrets (never in this file): fly secrets set -a aidr-baltor-backend OH_LLM_BASE_URL=… OH_LLM_MODEL=… OH_LLM_API_KEY=… OH_EMBED_MODE=… OH_EMBED_MODEL=… OH_EMBED_BASE_URL=… OH_INFERENCE_ALLOW_NETWORK=… REDIS_URL=…

[[mounts]]
  source = "baltor_backend_state"
  destination = "/app/dist/local-services-state"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9301
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
