# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: worker (kind=burst)
app = "aidr-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # deploy from repo root: fly deploy -c fly/aidr-worker.fly.toml

[processes]
  app = "python -m scripts.foundry.worker --serve"

[env]
  OH_BIND_HOST = "0.0.0.0"

# secrets (never in this file): fly secrets set -a aidr-worker OH_LLM_BASE_URL=… OH_LLM_MODEL=… OH_LLM_API_KEY=… OH_EMBED_MODE=… OH_EMBED_MODEL=… OH_EMBED_BASE_URL=… OH_INFERENCE_ALLOW_NETWORK=… OLLAMA_API_KEY=… OLLAMA_HOST=… MISTRAL_API_KEY=… OPENROUTER_API_KEY=… OH_CHAT_MODEL=… OH_EMBED_MODEL=… REDIS_URL=… DATABASE_URL=…

# burst fleet: machines are managed by the worker-controller (scale 0→8 on redis list 'ohh:foundry:jobs', 10 jobs/worker). After 'fly deploy --ha=false', stop the seed machine; the controller owns the fleet.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
