openapi: 3.0.3
info:
  title: Acme Billing API (synthetic demo)
  version: 1.4.0
paths:
  /v1/payments:submit:
    post:
      operationId: submitPayment
      summary: Submit a payment for processing (idempotent; safe to retry on 429/502/503/504).
      responses:
        '202': { description: Accepted }
        '429': { description: Too Many Requests (retry-safe) }
        '503': { description: Service Unavailable (retry-safe) }
