name: Build & deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r _repos/shared-backend-components/requirements-docs.txt

      - name: Validate manifests
        run: python _repos/shared-backend-components/scripts/validate.py

      - name: Build catalog pages
        run: python _repos/shared-backend-components/scripts/build_catalog_pages.py

      - name: Build site
        run: mkdocs build --strict -f _repos/shared-backend-components/deploy/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
