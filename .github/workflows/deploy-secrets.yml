name: Deploy secrets (SOPS decrypt -> provider stores)

# Reusable workflow: decrypt the SOPS+age platform secrets vault with the ONE secret-zero
# (SOPS_AGE_KEY, a GitHub Environment secret) and hand the NAMES to the EXISTING deploy path
# (generate_provider_configs -> `fly secrets set`). The app never decrypts at runtime:
# credentials.env_value() still reads os.environ, which `sops exec-env` (local) and
# `fly secrets set` (cloud) populate. The runtime seam is untouched.
on:
  workflow_call:
    inputs:
      surface:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      surface:
        required: true
        type: string

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    environment: ${{ inputs.surface }}   # per-env protection rules + required reviewers (Path A bootstrap slice)
    steps:
      - uses: actions/checkout@v4
      - name: Install sops + age
        run: |
          curl -sSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/latest/download/sops-linux-amd64
          chmod +x /usr/local/bin/sops
          sudo apt-get update && sudo apt-get install -y age
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml jsonschema
      - name: Decrypt + verify coverage (fails on registry drift or plaintext leak)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}   # the ONE secret-zero, GH Environment secret
        run: |
          python _repos/shared-backend-components/scripts/check_sops_secrets.py --self-test
      - name: Export decrypted env + push to provider store
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # sops exec-env exports the NAMES into the process env, then hands off to the EXISTING
          # deploy path (generate_provider_configs.secret_keys -> `fly secrets set --stage`).
          sops exec-env _repos/shared-backend-components/secrets/secrets.dev.env \
            'python _repos/shared-backend-components/scripts/deploy/generate_provider_configs.py --push --surface "${{ inputs.surface }}"'
