name: Baltor proofs (context engine)

# Gates every PR (and feature-branch push) on the WHOLE Baltor proof suite — the same self-tests the
# always-on flywheel watchdog runs (single source: scripts/baltor_flywheel.py PROOF_MODULES) — plus
# the committed-dashboard drift-check. Complements validate.yml (manifests/demos); does not replace it.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyyaml jsonschema
      - name: Flywheel proof suite (every PROOF_MODULES --self-test)
        run: python scripts/baltor_flywheel.py --once
      - name: Dashboard drift-check (web/baltor/*.json in sync with the export)
        run: python scripts/demo_run_export.py --check-fresh
      - name: CI aggregate gate (flywheel + drift)
        run: python scripts/ci_check.py
