<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Baltor — Raw Feed</title>
<style>
  :root{--bg:#07090c;--panel:#0e131d;--line:#1f2734;--ink:#e6edf6;--muted:#8aa0b6;--green:#34d39a;--amber:#f5a623;--red:#ff6b6b;--blue:#5aa0ff;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  h1{font-size:17px;margin:0} h1 b{color:var(--blue)} .sub{color:var(--muted);font-size:12px}
  .bar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
  .pill b{color:var(--ink)} .pill.green b{color:var(--green)}
  button{font-family:var(--sans);font-size:12px;background:#10192a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
  button.primary{background:#123;border-color:#2a557f;color:var(--blue)}
  a{color:var(--blue);text-decoration:none}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:72vh;margin:0;
      font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .k{color:var(--blue)} .num{color:var(--amber)} .str{color:#9ece6a} .seq{color:var(--muted)}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  label{color:var(--muted);font-size:12px}
</style></head>
<body><div class="wrap">
  <header>
    <h1>Baltor — <b>Raw Feed</b></h1>
    <div class="sub">ground-truth JSON: every event on the bus + flywheel status. Pure polling (no SSE) — survives any tunnel. <a href="/hub">← hub</a> · <a href="/dashboard">ops</a> · <a href="/dev">dev</a></div>
  </header>
  <div class="bar">
    <span class="pill green">flywheel <b id="p-fly">—</b></span>
    <span class="pill">engines <b id="p-eng">—</b></span>
    <span class="pill">events on bus <b id="p-ev">0</b></span>
    <span class="pill" id="p-conn">polling…</span>
    <div class="controls">
      <button class="primary" id="run">▶ Run pipeline</button>
      <button id="clear">Clear</button>
      <label><input type="checkbox" id="pause"> pause</label>
      <label>show <select id="src"><option value="events">events</option><option value="dev">dev status</option><option value="pipelines">pipeline runs</option><option value="lineage">latest run lineage (steps+artifacts+span tree)</option></select></label>
    </div>
  </div>
  <div id="note" class="sub" style="margin-bottom:8px"></div>
  <pre id="out">loading…</pre>
</div>
<script>
const $=s=>document.querySelector(s);
const TOKEN=new URLSearchParams(location.search).get('token')||'';
const tok=u=>TOKEN?(u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN)):u;
function color(json){ // tiny JSON syntax highlight
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/"(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?/g, m=>m.endsWith(':')?`<span class="k">${m}</span>`:`<span class="str">${m}</span>`)
    .replace(/\b(-?\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
}
async function tick(){
  if($('#pause').checked) return;
  try{
    const src=$('#src').value;
    if(src==='dev'){
      const d=await (await fetch('/api/dev/status',{cache:'no-store'})).json();
      $('#out').innerHTML=color(JSON.stringify(d,null,2));
    }else if(src==='pipelines'){
      const d=await (await fetch('/api/dev/pipelines/runs',{cache:'no-store'})).json();
      $('#out').innerHTML=color(JSON.stringify(d,null,2)) || '(no runs — POST /api/dev/pipelines/run)';
    }else if(src==='lineage'){
      const runs=(await (await fetch('/api/dev/pipelines/runs',{cache:'no-store'})).json()).runs||[];
      if(!runs.length){ $('#out').innerHTML='(no runs yet — POST /api/dev/pipelines/run)'; }
      else{ const lin=await (await fetch(tok('/api/dev/pipelines/runs/'+runs[0].run_id+'/lineage'),{cache:'no-store'})).json();
            $('#out').innerHTML=color(JSON.stringify(lin,null,2)); }
    }else{
      const d=await (await fetch('/api/events?limit=500',{cache:'no-store'})).json();
      const evs=(d.events||[]).slice().reverse(); // newest first
      $('#p-ev').textContent=(d.events||[]).length;
      $('#out').innerHTML=color(evs.map(e=>JSON.stringify(e)).join('\n')) || '(no events yet — click ▶ Run pipeline)';
    }
    $('#p-conn').textContent='live · '+new Date().toLocaleTimeString();
  }catch(e){ $('#p-conn').textContent='offline'; }
  try{
    const s=await (await fetch('/api/dev/status',{cache:'no-store'})).json();
    if(s.flywheel){ $('#p-fly').textContent=`${s.flywheel.green_count}/${s.flywheel.total}`; }
    if(s.engines&&s.engines.phrase){ $('#p-eng').textContent=s.engines.phrase.replace(' modules CONNECTED',''); }
  }catch(_){}
}
$('#run').addEventListener('click',async()=>{
  $('#note').textContent='running…';
  const r=await fetch(tok('/api/demo/run-full-pipeline'),{method:'POST'});
  if(r.status===401){ $('#note').textContent='🔒 needs ?token=… to run (viewing works without it).'; return; }
  const d=await r.json(); $('#note').textContent=`pipeline ${d.ok?'OK':'failed'} — answer=${d.answer_value}, events=${d.events_emitted}`; tick();
});
$('#clear').addEventListener('click',async()=>{ const r=await fetch(tok('/api/events/clear'),{method:'POST'}); $('#note').textContent=r.status===401?'🔒 needs ?token=… to clear.':'cleared.'; tick(); });
tick(); setInterval(tick,2000);
</script></body></html>
