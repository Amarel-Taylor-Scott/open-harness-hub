id: "harness/procurement-bid-review-review"
type: harness
version: "0.1.0"
name: "Procurement Bid Review review harness"
description: "Composable review harness for procurement bid review packets using persona, grep, RAG, privacy, and evaluation layers."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["procurement", "procurement.sourcing"]
capability: ["evaluation", "retrieval", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["procurement-bid-review", "use-case-expansion"]
created: "2026-05-24"
updated: "2026-05-24"
kind: "model_harness"
tier: "primary"
applied_layers: ["persona", "grep", "rag", "privacy"]
knowledge_packs:
  - id: "frameworks"
    label: "Procurement Bid Review framework summaries"
    kind: "knowledge_pack"
    types: ["rag_doc", "checklist", "control_summary"]
    required: true
    trust_boundary: "local"
    freshness: "dated"
model_targets:
  - id: "review_model"
    label: "Local or hosted review model"
    transport: "ollama"
    role: "packet reviewer"
    capabilities: ["reasoning", "summarization"]
    required: true
    default: true
    trust_boundary: "local"
model_io:
  input: "packet text or structured packet converted to prose"
  output: "findings, score, citations, evidence gaps, and remediation checklist"
  transport: "ollama"
input_verification: ["redact direct personal identifiers before review", "normalize structured packet fields before retrieval"]
output_verification: ["high and critical findings cite packet evidence or retrieved context", "judge score meets rubric threshold"]
privacy_boundaries:
  raw_input: "Raw packet remains local unless deployment configures an external adapter."
  derived_output: "Review output may contain sensitive operational details and should be redacted before publication."
  external_calls: "No external calls are required by this harness."
contributes_to: ["pipeline/procurement-bid-review-review"]
