id: "rubric/baltor-cfo-financial-control-quality"
type: rubric
version: "0.1.0"
name: "Baltor CFO financial control quality"
description: "CFO rubric for financial discipline, pricing evidence, risk controls, and enterprise readiness."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["software", "finance", "ai_governance"]
capability: ["evaluation", "governance", "verification"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["baltor", "cfo", "financial-control", "pricing"]
created: "2026-06-02"
updated: "2026-06-02"
dimensions:
  - id: "pricing_evidence"
    label: "Pricing is grounded in paid pilots, measurable outcomes, and buyer willingness, not desk assumptions"
    weight: 0.20
    scale: "0.0-1.0"
    evidence_required: "Pilot offers, conversion criteria, ROI evidence, and buyer feedback are documented."
  - id: "margin_model"
    label: "Gross margin model accounts for cloud, model, support, connector, storage, and security review costs"
    weight: 0.18
    scale: "0.0-1.0"
    evidence_required: "Cost-of-service model and sensitivity analysis exist by pack volume, seat, source, and deployment type."
  - id: "risk_and_liability"
    label: "Financial, legal, privacy, and operational liabilities from incorrect or unauthorized context are controlled"
    weight: 0.18
    scale: "0.0-1.0"
    evidence_required: "Audit, disclaimers, policy gates, access controls, customer terms, and incident handling are defined."
  - id: "revenue_recognition_fit"
    label: "Packaging and delivery support clean enterprise contracting and revenue recognition"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "SKU boundaries, usage terms, service obligations, pilot-to-contract path, and support commitments are clear."
  - id: "financial_reporting"
    label: "Operational metrics map to finance metrics for retention, expansion, gross margin, and CAC payback"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "Usage, pack value, support load, cloud spend, and renewal signals are exportable."
  - id: "cloud_procurement_compatibility"
    label: "Hosting and security posture support enterprise procurement and preferred cloud patterns"
    weight: 0.16
    scale: "0.0-1.0"
    evidence_required: "SaaS, VPC, dedicated deployment, audit export, encryption, and data residency options are documented."
scoring_method: "weighted_sum"
