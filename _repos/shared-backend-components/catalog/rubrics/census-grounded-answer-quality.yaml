id: "rubric/census-grounded-answer-quality"
type: rubric
version: "0.1.0"
name: "Census-grounded answer quality"
description: |
  Scores whether an answer about US demographics/economics is grounded in
  authoritative Census data rather than model recall: correct geography, a real
  figure from the API, a citation, and an explicit refusal when no data exists.
  This rubric is the contract that proves the capability lift over a bare LLM.
authors:
  - name: "OpenHubForAI contributors"
license: "CC-BY-4.0"
industry: ["government", "cross_industry"]
capability: ["evaluation", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["rubric", "census", "grounding", "citation", "verification"]
created: "2026-05-27"
updated: "2026-05-27"

scoring_method: "weighted_sum"
dimensions:
  - id: "factual_accuracy"
    label: "Factual accuracy vs source"
    weight: 0.34
    scale: "0.0-1.0"
    evidence_required: "The stated figure matches the value returned by tool/us-census-acs-api for the resolved geography and variable."
  - id: "geography_correctness"
    label: "Geography correctness"
    weight: 0.22
    scale: "0.0-1.0"
    evidence_required: "The FIPS/for-in clause resolves to the place the user asked about (no state/county confusion)."
  - id: "citation_present"
    label: "Citation present"
    weight: 0.22
    scale: "0.0-1.0"
    evidence_required: "Answer cites the source_url + retrieved_at (and variable code) returned by the API."
  - id: "refusal_on_no_data"
    label: "Refuses / flags when no data"
    weight: 0.22
    scale: "0.0-1.0"
    evidence_required: "When the geography or variable is unavailable, the answer says so instead of guessing a number."
