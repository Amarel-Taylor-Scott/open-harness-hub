id: "rubric/baltor-chief-ui-ux-product-experience-quality"
type: rubric
version: "0.1.0"
name: "Baltor Chief UI/UX product experience quality"
description: "Chief UI/UX rubric for clear, low-friction, trust-building context pack experiences."
authors: [{ name: "OpenHubForAI contributors" }]
license: "MIT"
industry: ["software", "design_ops"]
capability: ["evaluation", "verification"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
tags: ["baltor", "ui-ux", "product-experience", "context-packs"]
created: "2026-06-02"
updated: "2026-06-02"
dimensions:
  - id: "workflow_embedded"
    label: "Experience is embedded in developer/reviewer tools rather than forcing a separate destination"
    weight: 0.20
    scale: "0.0-1.0"
    evidence_required: "MCP, CLI, PR checks/comments, and compact web trace views are primary surfaces."
  - id: "trust_visibility"
    label: "Users can quickly see source handles, freshness, confidence, conflicts, and policy decisions"
    weight: 0.20
    scale: "0.0-1.0"
    evidence_required: "Pack UI surfaces source links, last validated dates, risk/conflict badges, and expansion state."
  - id: "progressive_disclosure"
    label: "Context packs start compact and let users expand evidence without overwhelming them"
    weight: 0.16
    scale: "0.0-1.0"
    evidence_required: "Summary, claims, code pointers, risks, and source expansions have clear hierarchy."
  - id: "schema_complexity_hidden"
    label: "Flexible document/facet/dimension schemas do not leak as confusing UI complexity"
    weight: 0.16
    scale: "0.0-1.0"
    evidence_required: "Users see role-appropriate labels and filters, not raw JSON unless in admin/debug views."
  - id: "error_and_staleness_states"
    label: "Unavailable, stale, denied, ambiguous, and conflicting context states are legible and actionable"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "UI distinguishes missing source, denied source, stale cache, conflict, and refresh queued."
  - id: "accessibility_and_density"
    label: "UI remains accessible, scannable, and information-dense across admin and developer contexts"
    weight: 0.14
    scale: "0.0-1.0"
    evidence_required: "Keyboard access, contrast, responsive layout, table density, and readable technical labels are addressed."
scoring_method: "weighted_sum"
