id: rule-pack/grep-statute-ambiguity-flags
type: rule-pack
version: 0.1.0
name: Statute / regulation ambiguity GREP red-flag detectors
description: "Regex heuristics that fire on the most common drafting failures in\n\
  statutes, regulations, ordinances, and agency rules:\n\n - vague qualifiers (\"\
  reasonable\", \"appropriate\", \"as soon as\n   practicable\", \"substantial\")\n\
  \ - undefined enumerations with no closing catch-all\n - broken cross-references\
  \ (\"\xA7X\" with no \xA7X in the same act)\n - retroactivity ambiguity (\"applies\
  \ to all\" without effective\n   date scoping)\n - missing severability / effective-date\
  \ markers\n - circular definitions (a defined term that uses the same word in\n\
  \   its own definition)\n - scope-creep verbs (\"includes but is not limited to\"\
  \ inside\n   a definition)\n - shall/may/will inconsistency\n - English-only \"\
  as defined elsewhere\" forward-references\n\nFAST first-pass heuristics \u2014 they\
  \ flag passages for the\n`persona/legal-clarity-analyst` to interpret, never determine\n\
  interpretation themselves.\n"
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- legal
- legal.compliance
- government
- government.regulatory
capability:
- safety_gating
- classification
- extraction
modality:
- text
lifecycle: experimental
trust_boundary: local
freshness: stable
tags:
- law
- statute
- drafting
- ambiguity
- grep
created: '2026-05-24'
updated: '2026-05-25'
family: grep
language: en
rules:
- id: vague_qualifier_reasonable
  pattern: (?i)\b(reasonable|reasonably|reasonableness)\b
  severity: medium
  category: drafting.vague_qualifier
- id: vague_qualifier_appropriate
  pattern: (?i)\b(appropriate|appropriately|as appropriate)\b
  severity: medium
  category: drafting.vague_qualifier
- id: vague_qualifier_practicable
  pattern: (?i)\b(practicable|as soon as practicable|reasonably practicable|insofar
    as practicable)\b
  severity: medium
  category: drafting.vague_qualifier
- id: vague_qualifier_substantial
  pattern: (?i)\b(substantial|substantially|in substantial part|materially)\b
  severity: medium
  category: drafting.vague_qualifier
- id: vague_qualifier_undue
  pattern: (?i)\b(undue|undue hardship|undue burden|unreasonable)\b
  severity: medium
  category: drafting.vague_qualifier
- id: open_enumeration_includes_but
  pattern: (?i)\b(includes? but (is|are) not limited to|including without limitation|such
    as)\b
  severity: medium
  category: drafting.open_enumeration
- id: shall_may_inconsistency
  pattern: (?i)\b(shall|may|must|will|should)\b.{0,200}?\b(shall|may|must|will|should)\b
  severity: low
  category: drafting.modal_verb_consistency
- id: broken_section_xref
  pattern: (?i)\b(section|subsection|paragraph|clause|art\.?|article)\s+\d+(\([a-z0-9]+\))*
  severity: low
  category: drafting.cross_reference_to_verify
- id: retroactivity_ambiguity
  pattern: (?i)\bapplies?\s+to\s+(all|any)\s+(persons?|transactions?|acts?|conduct|filings?)\b(?!.{0,80}\b(after|on
    or after|prior to|before)\b)
  severity: high
  category: drafting.retroactivity_ambiguity
- id: missing_effective_date_marker
  pattern: (?i)\b(this (act|chapter|section|subchapter|title|regulation|rule))\b(?!.{0,500}\beffective\b)
  severity: high
  category: drafting.missing_effective_date
- id: missing_severability_marker
  pattern: (?i)\bif (any|a) (provision|section|subsection|clause)\b(?!.{0,200}\b(invalid|unconstitutional|unenforceable|severable)\b)
  severity: medium
  category: drafting.severability_check
- id: circular_definition_marker
  pattern: (?i)"([A-Z][a-z]+)"\\s+means.{0,200}\\b\\1\\b
  severity: high
  category: drafting.circular_definition
- id: forward_reference
  pattern: (?i)\bas defined (elsewhere|herein|below|hereinafter|in this (chapter|title|subchapter))\b
  severity: medium
  category: drafting.forward_reference
- id: deadline_unclear
  pattern: (?i)\b(promptly|immediately|forthwith|without delay|as soon as)\b
  severity: medium
  category: drafting.deadline_unclear
- id: delegation_open
  pattern: (?i)\b(the (secretary|administrator|commissioner|director|agency|authority))
    (may|shall) (issue|promulgate|adopt|make) (rules?|regulations?|standards?)\b
  severity: low
  category: drafting.delegation_to_verify
- id: scope_creep_includes
  pattern: (?i)"[A-Z][a-z]+"\\s+(means|shall mean)\\s+.{0,200}\\b(and includes any
    other|or any similar|or any related)\\b
  severity: high
  category: drafting.definitional_scope_creep
- id: unconstitutional_red_flag_prior_restraint
  pattern: (?i)\b(may not (be |)?(publish|distribute|broadcast|disseminate|post)|prohibited
    from (publishing|distributing|broadcasting|disseminating))\b
  severity: critical
  category: constitutional.prior_restraint_risk
- id: due_process_no_hearing
  pattern: (?i)\b(without (notice|a hearing|opportunity to be heard|judicial review)|summarily
    (revoked?|terminated?|forfeited?))\b
  severity: critical
  category: constitutional.due_process_risk
