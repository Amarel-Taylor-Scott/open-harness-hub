id: "pipeline/theory-vector-readiness-to-pgvector"
type: pipeline
version: "0.1.0"
name: "Theory vector readiness to pgvector"
description: "Runs local deterministic vectors for theory-derived component candidates, emits pgvector load SQL, and audits planned versus committed embedding state without mutating Postgres."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "security.defensive", "cross_industry"]
capability: ["embedding", "retrieval", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
lifecycle_position: "cross_cutting.storage"
tags: ["theory-to-components", "embeddings", "pgvector", "vector-readiness", "committed-load-audit"]
created: "2026-05-26"
updated: "2026-05-26"

task: "Convert theory-derived embedding execution plans into local stored vectors, pgvector load SQL, and committed-load audit evidence."
pipeline_kind: "research_web.theory_vector_readiness_to_pgvector"
inputs:
  - name: "embedding_execution_plan"
    type: "json"
  - name: "source_embedding_rows"
    type: "jsonl"
outputs:
  - name: "stored_vector_rows"
    type: "jsonl"
  - name: "vector_readiness_summary"
    type: "json"
  - name: "pgvector_load_sql"
    type: "sql"
  - name: "embedding_committed_load_audit"
    type: "json"
defaults:
  knowledge_packs:
    - "knowledge-pack/theory-to-component-patterns"
steps:
  - id: "run-local-vectors"
    kind: "tool"
    ref: "tool/local-hash-embedding-worker"
    inputs:
      embedding_plan: "$.inputs.embedding_execution_plan"
      limit: "$.inputs.limit"
  - id: "build-pgvector-load"
    kind: "tool"
    ref: "tool/pgvector-embedding-load-planner"
    inputs:
      stored_vectors_jsonl: "$.steps.run-local-vectors.files.stored_vector_rows"
      source_embedding_rows_jsonl: "$.inputs.source_embedding_rows"
  - id: "audit-committed-load"
    kind: "tool"
    ref: "tool/embedding-committed-load-auditor"
    inputs:
      embedding_execution_plan: "$.inputs.embedding_execution_plan"
      vector_readiness_summary: "$.steps.run-local-vectors.vector_readiness.files.summary"
      pgvector_load_plan_summary: "$.steps.build-pgvector-load.files.summary"
  - id: "emit-audit-trace"
    kind: "processor"
    ref: "processor/audit-trace-emitter"
    inputs:
      step_id: "theory-vector-readiness-to-pgvector"
      applied_layers: ["local_vector_worker", "vector_readiness", "pgvector_load_plan", "committed_load_audit"]
success_criteria:
  - kind: "deterministic"
    target: "$.steps.run-local-vectors.vector_readiness.ready_rows"
    op: ">="
    value: 1000
    severity: "high"
    label: "At least 1,000 theory-derived vectors are ready in the local worker output."
  - kind: "deterministic"
    target: "$.steps.build-pgvector-load.accepted_rows"
    op: ">="
    value: 1000
    severity: "high"
    label: "At least 1,000 theory-derived vectors are accepted by the pgvector load planner."
