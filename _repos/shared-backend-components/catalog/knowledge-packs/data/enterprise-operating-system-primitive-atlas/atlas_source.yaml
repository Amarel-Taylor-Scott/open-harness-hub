  assess: [metric-calculator, prioritization-ranker, human-review-packet]
  audit: [audit-event-emitter, decision-receipt]
  authorize: [rbac-gate, attribute-policy-gate, purpose-limit-gate]
  calculate: [metric-calculator]
  classify: [prioritization-ranker, work-queue-router]
  close: [case-state-machine, human-review-packet, decision-receipt]
  compare: [reconciliation-engine, regression-gate]
  coordinate: [work-queue-router, sla-deadline-monitor, notification-router]
  correlate: [record-linker, root-cause-traversal]
  deploy: [release-channel-resolver, canary-health-gate, rollback-controller]
  detect: [anomaly-signal-builder, exception-escalator]
  dispatch: [transactional-outbox, idempotency-gate]
  escalate: [exception-escalator, human-review-packet]
  evaluate: [eval-case-runner, regression-gate]
  execute: [approval-gate, transactional-writeback, decision-receipt]
  explain: [root-cause-traversal, human-review-packet]
  extract: [schema-validator, field-mapper, lineage-propagator]
  filter: [row-column-policy-filter, purpose-limit-gate]
  forecast: [forecast-wrapper, eval-case-runner]
  govern: [purpose-limit-gate, audit-event-emitter, retention-enforcer]
  harmonize: [field-mapper, type-coercer, entity-identity-resolver]
  import: [schema-validator, field-mapper, raw-landing-receipt]
  integrate: [connector-probe, schema-snapshot, incremental-sync, field-mapper]
  investigate: [case-state-machine, root-cause-traversal, human-review-packet]
  maintain: [anomaly-signal-builder, prioritization-ranker, work-queue-router]
  meter: [token-meter, cost-per-pass-calculator]
  mine: [event-log-normalizer, process-graph-miner]
  model: [object-mapper, link-type-validator]
  monitor: [sla-deadline-monitor, anomaly-signal-builder, exception-escalator]
  optimize: [optimizer-adapter, constraint-feasibility-checker]
  place: [allocation-engine, constraint-feasibility-checker, approval-gate]
  plan: [scenario-runner, optimizer-adapter, constraint-feasibility-checker]
  prevent: [forecast-wrapper, anomaly-signal-builder, notification-router]
  prioritize: [prioritization-ranker, work-queue-router]
  reconcile: [reconciliation-engine, decision-receipt]
  recover: [scenario-runner, work-queue-router, notification-router]
  reduce: [digital-twin-state-reducer, object-change-event]
  remediate: [work-queue-router, approval-gate, transactional-writeback]
  resolve: [entity-identity-resolver, record-linker]
  review: [governed-retriever, human-review-packet, approval-gate]
  route: [route-cost-evaluator, constraint-feasibility-checker]
  schedule: [schedule-feasibility, constraint-feasibility-checker]
  select: [governed-retriever, purpose-limit-gate]
  simulate: [scenario-runner, constraint-feasibility-checker]
  snapshot: [digital-twin-snapshot, temporal-validity-resolver]
  stage: [agent-action-policy, human-review-packet, approval-gate]
  synchronize: [incremental-sync, cdc-watermark, event-deduplicator]
  trace: [graph-reachability, lineage-propagator]
  trigger: [object-change-event, transactional-outbox]
  validate: [schema-validator, reference-integrity-checker]
  verify: [conformance-checker, decision-receipt]
  writeback: [approval-gate, idempotency-gate, transactional-writeback]

