  fault-injection: {execution: local-fault-harness, mutations: [timeout, crash, duplicate-delivery, partial-write]}
  graph: {execution: hidden-graph-fixtures, mutations: [dangling-edge, wrong-cardinality, cycle, missing-path]}
  held-out: {execution: held-out-labeled-fixtures, mutations: [near-duplicate, ambiguous-match, distribution-shift, tie-case]}
  integration: {execution: local-emulator, mutations: [unauthorized-call, dependency-timeout, duplicate-write, rollback]}
  ml: {execution: fixed-split-model-harness, mutations: [data-leakage, nondeterministic-split, artifact-mismatch, metric-regression]}
  mutation: {execution: positive-negative-mutation-suite, mutations: [remove-check, invert-decision, drop-error, accept-invalid]}
  optimization: {execution: exact-small-instance, mutations: [infeasible-plan, capacity-breach, objective-regression, unstable-tie]}
  property: {execution: property-and-metamorphic-tests, mutations: [conservation-break, roundtrip-break, order-instability, precision-loss]}
  receipt: {execution: receipt-readback, mutations: [missing-source, missing-actor, changed-payload, broken-hash]}
  replay: {execution: byte-identical-replay, mutations: [changed-order, changed-seed, missing-event, duplicate-event]}
  security: {execution: actor-resource-action-matrix, mutations: [unauthorized-read, unauthorized-write, purpose-mismatch, tenant-leak]}
