schema_version: "0.1.0"
evidence_snapshot_date: "2026-07-09"
title: Enterprise operating-system primitive atlas
scope:
  statement: >-
    Public-evidence-backed system, workflow, and primitive candidates for enterprise
    operating systems. Public company examples are breadth signals only; every
    primitive decomposition is an independent inference and candidate.
  excluded_domains: [insurance]
  excluded_actions:
    - autonomous lethal targeting
    - unreviewed clinical diagnosis or treatment
    - unreviewed public-benefit eligibility decisions
    - covert surveillance decisions
  source_use_policy: public metadata and high-level capability descriptions only; never copy vendor code, UI, schemas, or proprietary implementation details
  promotion_policy: source review plus independent implementation plus executed oracle plus measured marginal lift

quality_floors:
  min_system_families: 25
  min_workflows_per_system: 4
  min_primitive_templates: 60
  min_required_bindings_per_workflow: 1
  min_source_classes: 3
  rationale: >-
    Breadth must cover platform and industry surfaces, while every workflow must
    decompose into a non-trivial reusable route. These are validation floors,
    not claims of completeness or production readiness.

adapter_contract:
  - discover_schema
  - read_object
  - search_objects
  - subscribe_to_changes
  - map_to_canonical_object
  - validate_permission
  - stage_or_apply_writeback
  - record_source_version
  - health_check
  - emit_execution_receipt

default_error_semantics:
  - explicit_failure_receipt
  - no_silent_drop
  - rejected_input_preserved

workflow_operation_bindings:
  allocate: [allocation-engine, constraint-feasibility-checker]
  analyze: [root-cause-traversal, prioritization-ranker]
  answer: [governed-retriever, citation-span-verifier, structured-output-validator]
