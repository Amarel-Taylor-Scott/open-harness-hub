oracle_patterns:
  contract: {strength: O5, execution: local-fixture, mutations: [missing-field, wrong-type, schema-drift]}
  stateful: {strength: O6, execution: local-service, mutations: [duplicate-event, out-of-order-event, forbidden-transition, crash-replay]}
  integration: {strength: O6, execution: local-emulator, mutations: [dependency-timeout, partial-write, duplicate-write, unauthorized-write]}
  optimization: {strength: O6, execution: exact-small-instance, mutations: [infeasible-plan, capacity-breach, objective-regression]}
  ml: {strength: O6, execution: local-train-eval, mutations: [data-leakage, nondeterministic-split, metric-regression, artifact-mismatch]}
  security: {strength: O6, execution: actor-resource-action-matrix, mutations: [unauthorized-read, unauthorized-write, purpose-mismatch, tenant-leak]}
  graph: {strength: O5, execution: hidden-graph-fixtures, mutations: [dangling-edge, wrong-cardinality, hidden-cycle, missing-path]}
  receipt: {strength: O5, execution: receipt-readback, mutations: [missing-source, missing-actor, changed-payload, broken-hash]}
  process: {strength: O6, execution: hidden-event-log, mutations: [missing-event, reordered-event, bypassed-approval, bottleneck-shift]}

