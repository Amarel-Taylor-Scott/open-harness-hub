id: "tool/factory-jsonl-postgres-loader"
type: tool
version: "0.1.0"
name: "Factory JSONL Postgres loader"
description: "Emits deterministic Postgres upsert SQL from object-factory JSONL outputs, including source records, normalized objects, entities, dedupe clusters, review tickets, promotion decisions, index records, partition manifests, and index deltas."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["governance", "retrieval", "serving", "evaluation"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["postgres", "pgvector", "jsonl", "canonical-store", "sql", "million-primitives"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    output:
      type: string
    source_records:
      type: array
      items: { type: string }
    normalized_objects:
      type: array
      items: { type: string }
    entities:
      type: array
      items: { type: string }
    dedupe_clusters:
      type: array
      items: { type: string }
    review_tickets:
      type: array
      items: { type: string }
    promotion_decisions:
      type: array
      items: { type: string }
    index_records:
      type: array
      items: { type: string }
    partition_manifests:
      type: array
      items: { type: string }
    index_deltas:
      type: array
      items: { type: string }
  required: ["output"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    output_path:
      type: string
    counts:
      type: object
side_effects: "write"
examples:
  - input:
      source_records: ["catalog/knowledge-packs/data/task-marketplace-archetype-patterns/source-records.jsonl"]
      normalized_objects: ["catalog/knowledge-packs/data/task-marketplace-archetype-patterns/archetype-patterns.jsonl"]
      promotion_decisions: ["catalog/knowledge-packs/data/promotion-index-delta-patterns/promotion-decisions.jsonl"]
      output: "dist/sql/factory-load.sql"
    output:
      ok: true
      output_path: "dist/sql/factory-load.sql"
implementations:
  - kind: "callable"
    path: "scripts.db.factory_jsonl_to_postgres.emit_sql"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.factory_jsonl_to_postgres"
