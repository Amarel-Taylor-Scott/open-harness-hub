id: "tool/approved-component-promotion-planner"
type: tool
version: "0.1.0"
name: "Approved component promotion planner"
description: "Exports review-approved component candidates as active component, component version, subcomponent, and candidate-state CSV plus a psql load script."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["evaluation", "governance", "routing", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["components", "promotion", "review-gate", "postgres", "component-version", "subcomponents"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    component_candidates_path:
      type: string
    subcomponent_candidates_path:
      type: string
    promotion_decisions_path:
      type: string
    output_dir:
      type: string
    load_sql_name:
      type: string
  required: ["component_candidates_path", "subcomponent_candidates_path", "promotion_decisions_path"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    approved_component_count:
      type: integer
    approved_component_version_count:
      type: integer
    approved_subcomponent_count:
      type: integer
    candidate_state_update_count:
      type: integer
    files:
      type: object
side_effects: "write"
examples:
  - input:
      component_candidates_path: "dist/source-surface-scan-partitions/seed/component-store/component-candidates.jsonl"
      subcomponent_candidates_path: "dist/source-surface-scan-partitions/seed/component-store/subcomponent-candidates.jsonl"
      promotion_decisions_path: "dist/source-surface-scan-partitions/seed/load-plan/promotion/promotion-decisions.jsonl"
      output_dir: "dist/source-surface-scan-partitions/seed/approved-component-promotion"
    output:
      ok: true
      approved_component_count: 0
      candidate_state_update_count: 620
implementations:
  - kind: "callable"
    path: "scripts.db.approved_component_promotion_plan.create_approved_component_promotion_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.approved_component_promotion_plan"
