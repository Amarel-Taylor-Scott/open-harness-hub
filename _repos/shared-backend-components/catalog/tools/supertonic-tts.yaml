id: "tool/supertonic-tts"
type: tool
version: "0.1.0"
name: "Supertonic on-device multilingual TTS"
description: |
  Synthesize speech from text on-device, multilingual, running natively via
  ONNX with low latency and no network round-trip. Integration contract for
  Supertonic, a lightning-fast on-device TTS engine.

  Reference/integration contract only; verify the upstream license before
  bundling. Useful as the audio-synthesis leg of generate-audio pipelines and
  for privacy-sensitive, offline-first deployments (trust boundary stays local).
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry:   ["ai", "cross_industry"]
capability: ["audio_synthesis"]
modality:   ["text", "audio"]
lifecycle:  "experimental"
trust_boundary: "local"
tags: ["tts", "supertonic", "on-device", "onnx", "multilingual", "offline-first"]
created: "2026-05-26"
updated: "2026-05-26"
attribution:
  source_url: "https://github.com/supertone-inc/supertonic"
  source_kind: "github"
  author: "Supertone Inc."

parameters:
  type: object
  properties:
    text:     { type: "string", description: "Text to synthesize." }
    language: { type: "string", description: "BCP-47 language tag, e.g. en, ko, es." }
    voice:    { type: "string", description: "Voice/speaker id." }
    speed:    { type: "number", default: 1.0 }
required: ["text"]
returns:
  type: object
  properties:
    audio_path:  { type: "string", description: "Path to the synthesized audio file." }
    sample_rate: { type: "integer" }
    duration_s:  { type: "number" }
side_effects: "write"
examples:
  - input:  { text: "Your supplier disclosure is ready for review.", language: "en", speed: 1.0 }
    output: { audio_path: "/tmp/out.wav", sample_rate: 24000, duration_s: 2.6 }
implementations:
  - kind: "callable"
    path: "supertonic.tts.synthesize"
  - kind: "shell"
    path: "supertonic"
