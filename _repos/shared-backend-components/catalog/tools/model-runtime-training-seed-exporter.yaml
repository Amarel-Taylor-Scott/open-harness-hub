id: "tool/model-runtime-training-seed-exporter"
type: tool
version: "0.1.0"
name: "Model runtime training seed exporter"
description: "Exports local model runtime, Kubernetes runtime, fine-tuning, evaluation, and federated reviewed-object sharing seeds into database-ready component row families."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["generation", "planning", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.model_ops"
tags: ["components", "training", "fine-tuning", "local-models", "kubernetes", "federated-knowledge"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    seeds_path:
      type: string
    output_dir:
      type: string
    excluded_scopes:
      type: array
      items:
        type: string
  required: ["output_dir"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    seed_count:
      type: integer
    row_counts:
      type: object
    row_family_paths:
      type: object
side_effects: "write"
examples:
  - input:
      seeds_path: "catalog/knowledge-packs/data/model-runtime-training-component-patterns/patterns.jsonl"
      output_dir: "dist/model-runtime-training-seeds/2026-05-26"
    output:
      ok: true
      seed_count: 12
implementations:
  - kind: "callable"
    path: "scripts.factory.model_runtime_training_seeds.export_model_runtime_training_rows"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.factory.model_runtime_training_seeds"
