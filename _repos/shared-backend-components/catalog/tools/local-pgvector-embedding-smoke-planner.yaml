id: "tool/local-pgvector-embedding-smoke-planner"
type: tool
version: "0.1.0"
name: "Local pgvector embedding smoke planner"
description: "Emits a side-effect-free Docker pgvector smoke execution plan for applying embedding load SQL and rerunning committed-load audits locally."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["embedding", "retrieval", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["embeddings", "vector-search", "pgvector", "postgres", "docker", "daily-factory", "smoke-test"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    pgvector_load_plan_summary:
      type: string
    embedding_execution_plan:
      type: string
    vector_readiness_summary:
      type: string
    output_dir:
      type: string
    run_id:
      type: string
    compose_file:
      type: string
    schema_file:
      type: string
    count_sql:
      type: string
    database_url:
      type: string
  required: ["pgvector_load_plan_summary", "embedding_execution_plan", "vector_readiness_summary", "output_dir"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    target:
      type: string
    readiness:
      type: object
    commands:
      type: array
    files:
      type: object
side_effects: "write"
examples:
  - input:
      pgvector_load_plan_summary: "dist/pgvector-embedding-load-plan/2026-05-31/pgvector-embedding-load-plan-summary.json"
      embedding_execution_plan: "dist/daily-embedding-execution/2026-05-31/embedding-plan/embedding-execution-plan.json"
      vector_readiness_summary: "dist/local-hash-embedding-worker/2026-05-31/vector-readiness/vector-readiness-summary.json"
      output_dir: "dist/local-pgvector-embedding-smoke/2026-05-31"
    output:
      ok: true
      target: "local_docker_pgvector"
      readiness:
        accepted_load_rows: 256
        rejected_load_rows: 0
        safe_to_smoke_apply: true
implementations:
  - kind: "callable"
    path: "scripts.db.local_pgvector_embedding_smoke_plan.build_local_pgvector_embedding_smoke_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.local_pgvector_embedding_smoke_plan"
