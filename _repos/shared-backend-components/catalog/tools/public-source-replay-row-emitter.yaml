id: "tool/public-source-replay-row-emitter"
type: tool
version: "0.1.0"
name: "Public source replay row emitter"
description: "Emits canonical source_record, normalized_object, entity, dedupe, label, dimension, embedding, index, and review-ticket JSONL row families from replayed public-source jobs."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["automotive", "energy", "manufacturing", "construction", "government", "cross_industry"]
capability: ["extraction", "classification", "retrieval", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "stable"
lifecycle_position: "cross_cutting.factory"
tags: ["public-sources", "row-families", "jsonl", "bulk-load", "preflight"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    job_run_records:
      type: array
      items:
        type: object
    jobs:
      type: array
      items:
        type: object
    output_dir:
      type: string
    excluded_scopes:
      type: array
      items:
        type: string
  required: ["job_run_records"]
returns:
  type: object
  properties:
    output_dir:
      type: string
    row_counts:
      type: object
    row_family_paths:
      type: object
    warnings:
      type: array
      items:
        type: string
side_effects: "write"
examples:
  - input:
      job_run_records:
        - job_id: "job/public-source/demo/04-source_ingest/shard/demo"
          job_type: "source_ingest"
          blueprint_id: "demo-public-source-blueprint"
      excluded_scopes: ["insurance"]
    output:
      row_counts:
        normalized_object: 1
        index_record: 5
implementations:
  - kind: "callable"
    path: "scripts.factory.public_source_replay_rows.export_replay_rows"
    language: "python"
  - kind: "mcp"
    path: "mcp/factory.emit_public_source_replay_rows"
