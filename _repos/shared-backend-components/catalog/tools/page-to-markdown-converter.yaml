id: "tool/page-to-markdown-converter"
type: tool
version: "0.1.0"
name: "Page to Markdown converter"
description: "Converts web pages, PDFs, office documents, and repository pages into clean Markdown with source-span anchors, citation metadata, tables, and conversion warnings."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["format_conversion", "extraction", "research"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "stable"
lifecycle_position: "pre_api.ingest"
tags: ["markdown", "conversion", "source-spans", "object-factory", "container-worker"]
created: "2026-05-25"
updated: "2026-05-25"

parameters:
  type: object
  properties:
    source_record:
      type: object
    snapshot_pointer:
      type: string
    mime_type:
      type: string
    conversion_policy:
      type: object
  required: ["snapshot_pointer"]
returns:
  type: object
  properties:
    markdown_pointer:
      type: string
    source_spans:
      type: array
      items:
        type: object
    links:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string
side_effects: "write"
examples:
  - input:
      snapshot_pointer: "s3://hub-snapshots/example/page.html"
      mime_type: "text/html"
      conversion_policy:
        preserve_tables: true
        emit_source_spans: true
    output:
      markdown_pointer: "s3://hub-derived/example/page.md"
      source_spans:
        - id: "span-001"
          heading: "Eligibility"
          start_offset: 0
          end_offset: 240
      links: ["https://example.gov/policy"]
      warnings: []
implementations:
  - kind: "callable"
    path: "scripts.factory.object_factory_workers.convert_page_to_markdown"
    language: "python"
  - kind: "http"
    url: "https://workers.open-harness-hub.dev/page-to-markdown"
