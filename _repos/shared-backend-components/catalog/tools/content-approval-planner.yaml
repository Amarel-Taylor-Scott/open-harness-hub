id: "tool/content-approval-planner"
type: tool
version: "0.1.0"
name: "Content approval planner"
description: "Exports content approval decisions, derived promotion decisions, quality index rows, and review tickets for dedupe-resolved component candidates."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["evaluation", "governance", "routing", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["components", "content-approval", "promotion", "review-gate", "postgres", "quality-index"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    component_candidates_path:
      type: string
    normalized_objects_path:
      type: string
    dedupe_resolutions_path:
      type: string
    output_dir:
      type: string
    load_sql_name:
      type: string
  required: ["component_candidates_path", "normalized_objects_path", "dedupe_resolutions_path"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    content_approval_count:
      type: integer
    promotion_decision_count:
      type: integer
    index_record_count:
      type: integer
    review_ticket_count:
      type: integer
    files:
      type: object
side_effects: "write"
examples:
  - input:
      component_candidates_path: "dist/source-surface-scan-partitions/seed/component-store/component-candidates.jsonl"
      normalized_objects_path: "dist/source-surface-scan-partitions/seed/rows/normalized-objects.jsonl"
      dedupe_resolutions_path: "dist/source-surface-scan-partitions/seed/dedupe-resolution/dedupe-resolutions.jsonl"
      output_dir: "dist/source-surface-scan-partitions/seed/content-approval"
    output:
      ok: true
      content_approval_count: 620
      review_ticket_count: 620
implementations:
  - kind: "callable"
    path: "scripts.db.content_approval_plan.create_content_approval_plan"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.content_approval_plan"
