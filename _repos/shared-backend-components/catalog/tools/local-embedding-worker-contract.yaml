id: "tool/local-embedding-worker-contract"
type: tool
version: "0.1.0"
name: "Local embedding worker contract"
description: "Builds contract-valid stored vector metadata rows from an embedding execution plan and proves the rows pass vector readiness on a bounded sample."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["embedding", "retrieval", "governance", "evaluation"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["embeddings", "vector-search", "pgvector", "daily-factory", "worker-contract", "readiness"]
created: "2026-05-26"
updated: "2026-05-26"

parameters:
  type: object
  properties:
    embedding_plan:
      type: string
    output_dir:
      type: string
    run_id:
      type: string
    worker_id:
      type: string
    storage_backend:
      type: string
    limit:
      type: integer
  required: ["embedding_plan", "output_dir"]
returns:
  type: object
  properties:
    ok:
      type: boolean
    sampled_completion_rows:
      type: integer
    stored_vector_rows:
      type: integer
    vector_readiness:
      type: object
    files:
      type: object
side_effects: "write"
examples:
  - input:
      embedding_plan: "dist/daily-embedding-execution/2026-05-31/embedding-plan/embedding-execution-plan.json"
      output_dir: "dist/local-embedding-worker-contract/2026-05-31"
      limit: 256
    output:
      ok: true
      sampled_completion_rows: 256
      stored_vector_rows: 256
      vector_readiness:
        readiness_status: "ready"
implementations:
  - kind: "callable"
    path: "scripts.db.local_embedding_worker_contract.build_local_embedding_worker_contract"
    language: "python"
  - kind: "shell"
    command: "python3 -m scripts.db.local_embedding_worker_contract"
