name: "ktx-sl semantic query planner (deterministic SQL compiler)"
description: |
  The pip-installable Python engine from Kaelio/ktx alone (deps:
  sqlglot/pydantic/pyyaml; Python ≥3.13): a deterministic semantic-layer
  compiler with "aggregate locality" — facts pre-aggregated at their own
  grain in CTEs to make fan/chasm-trap measure inflation unrepresentable.
  Declarative measures/dimensions/filters in, dialect-transpiled SQL out;
  no CLI/daemon needed. A deterministic pipeline primitive for governed
  analytics components.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
