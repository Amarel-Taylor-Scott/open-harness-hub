name: "Exa search API (web grounding source)"
description: |
  Wraps Exa (YC S21, $85M Series B) as a retrieval-provider
  candidate: neural web search + Websets built for agents. Exa retrieves;
  it does not corroborate, sign, or take responsibility for truth — results
  enter Baltor as UNVERIFIED source_records with full provenance handles
  and only leave the rail as facts after multi-source corroboration.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
