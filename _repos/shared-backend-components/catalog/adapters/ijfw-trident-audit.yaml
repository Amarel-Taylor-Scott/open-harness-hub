capability: ["evaluation", "verification"]
modality: ["text"]
lifecycle: "experimental"
trust_boundary: "external"
tags: ["candidate", "wrap", "ijfw", "trident", "audit", "propose-only"]
created: "2026-06-11"
updated: "2026-06-11"

transport: "callable"
capabilities: ["multi_model_panel", "consensus_tagging", "caller_exclusion"]
auth: "byok"
cost_model: "self_hosted"
