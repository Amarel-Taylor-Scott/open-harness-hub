id: "adapter/ijfw-trident-audit"
type: adapter
version: "0.1.0"
name: "IJFW Trident cross-model audit (propose-only panel)"
description: |
  Wraps IJFW's "Trident" pattern — three models from three labs
  red-team the same work in parallel, caller-model excluded, findings
  tagged consensus/contested — as a candidate multi-model audit Action.
  Under our rail the panel PROPOSES findings only; deterministic gates
  dispose. Upstream uses it as the disposer (LLMs judging LLMs), which is
  the documented anti-pattern this wrap corrects.
  WRAP CANDIDATE (discovery ≠ trust): admitted from the 2026-06 YC/tool
  landscape research as a governed CANDIDATE behind a port — its output is
  never served as truth, it is sandboxed, and measured lift is PENDING
  (two-axis gate: lift AND structural durability) before any promotion.
  Landscape record: docs/strategy/yc-context-landscape-2026-06.md.
authors:
  - name: "OpenHubForAI contributors"
