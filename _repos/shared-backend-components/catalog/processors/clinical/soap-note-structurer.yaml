id: processor/soap-note-structurer
type: processor
version: 0.1.0
name: SOAP-note structurer
description: 'Structure a dictated/free-text encounter into Subjective / Objective / Assessment / Plan
  sections, each item linked to its source span. Deterministic structuring; coded diagnoses are deferred
  to the ICD grounder so codes are never invented here.


  Clinical decision-SUPPORT component — DEFENSIVE only: grounds on a governed corpus, fires a deterministic
  gate, and/or routes to a clinician; never autonomous medical advice. Lift is measured at the pipeline
  level.'
authors:
- name: OpenHubForAI contributors
license: MIT
industry:
- healthcare
capability:
- extraction
- summarization
modality:
- text
- structured
lifecycle: experimental
trust_boundary: local
tags:
- clinical
- decision-support
- deterministic-gate
- freezable
- governed
created: '2026-05-29'
updated: '2026-05-29'
process_kind: format_convert.soap_note
deterministic: true
idempotent: true
streaming: false
inputs:
- name: encounter
  type: object
outputs:
- name: soap
  type: object
side_effects: none
on_error: raise
implementations:
- kind: callable
  path: scripts.processors.clinical.soap_note_structurer.run
  language: python
