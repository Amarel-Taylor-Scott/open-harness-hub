id: processor/page-aware-chunker
type: processor
version: 0.1.0
name: Page / structure-aware chunker
description: 'Chunk on headings/tables/page anchors so citations resolve to a real location and tables
  stay intact. Needs structured source (PDF/HTML); preserves citable anchors. Deterministic.


  Retrieval/prompt taxonomy step R2 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
