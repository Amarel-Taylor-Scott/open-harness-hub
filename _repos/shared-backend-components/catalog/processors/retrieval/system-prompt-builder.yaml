id: processor/system-prompt-builder
type: processor
version: 0.1.0
name: System-prompt builder
description: 'Assemble the instruction contract — task, hard constraints, the grounding/citation requirement,
  and an explicit abstention policy (''if the corpus doesn''t support it, say so'') — SEPARATE from the
  persona. The cite-or-abstain contract is what converts retrieval into governed output.


  Retrieval/prompt taxonomy step P2 (see docs/concepts/retrieval-and-prompt-taxonomy.md). One swappable
  method-component for the governed-model-call recipe; lift is measured at the pipeline level, not on
  this component.'
