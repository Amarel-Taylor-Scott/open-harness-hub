# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: identity (kind=backend)
app = "aidr-identity"
primary_region = "iad"

[build]
  dockerfile = "shared-backend-components/deploy/Dockerfile"  # from _repos/: fly deploy -c shared-backend-components/fly/aidr-identity.fly.toml --dockerfile shared-backend-components/deploy/Dockerfile --ha=false

[processes]
  app = "python3 -m scripts.identity_local_service --serve"

[env]
  MAILBOX_INGEST_URL = "http://aidr-mailbox.internal:9428"
  OH_BIND_HOST = "0.0.0.0"

# secrets (never in this file): fly secrets set -a aidr-identity OH_LLM_BASE_URL=… OH_LLM_MODEL=… OH_LLM_API_KEY=… OH_EMBED_MODE=… OH_EMBED_MODEL=… OH_EMBED_BASE_URL=… OH_INFERENCE_ALLOW_NETWORK=… RESEND_API_KEY=… POSTMARK_API_KEY=… EMAIL_FROM=… EMAIL_ADAPTER=… AIDR_PUBLIC_BASE=…

[[mounts]]
  source = "identity_state"
  destination = "/app/dist/identity"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9410
  path = "/api/identity/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
