# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: registry (kind=backend)
app = "aidr-registry"
primary_region = "iad"

[build]
  dockerfile = "shared-backend-components/deploy/Dockerfile"  # from _repos/: fly deploy -c shared-backend-components/fly/aidr-registry.fly.toml --dockerfile shared-backend-components/deploy/Dockerfile --ha=false

[processes]
  app = "python3 -m scripts.registry_local_service"

[env]
  AIDR_IDENTITY_BASE = "http://aidr-identity.internal:9410"
  OH_BIND_HOST = "0.0.0.0"

# secrets (never in this file): fly secrets set -a aidr-registry AIDR_REGISTRY_ADMINS=…

[[mounts]]
  source = "registry_state"
  destination = "/app/dist/registry"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9423
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
