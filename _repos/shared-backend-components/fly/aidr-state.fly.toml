# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: state (kind=backend)
app = "aidr-state"
primary_region = "iad"

[build]
  dockerfile = "shared-backend-components/deploy/Dockerfile"  # from _repos/: fly deploy -c shared-backend-components/fly/aidr-state.fly.toml --dockerfile shared-backend-components/deploy/Dockerfile --ha=false

[processes]
  app = "python3 scripts/state_local_service.py"

[env]
  OH_BIND_HOST = "0.0.0.0"

[[mounts]]
  source = "state_state"
  destination = "/app/dist/local-services-state"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9427
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
