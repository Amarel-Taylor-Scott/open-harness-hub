# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: mailbox (kind=backend)
app = "aidr-mailbox"
primary_region = "iad"

[build]
  dockerfile = "shared-backend-components/deploy/Dockerfile"  # from _repos/: fly deploy -c shared-backend-components/fly/aidr-mailbox.fly.toml --dockerfile shared-backend-components/deploy/Dockerfile --ha=false

[processes]
  app = "python3 scripts/mailbox_local_service.py"

[env]
  AIDR_IDENTITY_BASE = "http://aidr-identity.internal:9410"
  OH_BIND_HOST = "0.0.0.0"

[[mounts]]
  source = "mailbox_state"
  destination = "/app/dist/email-outbox"
  initial_size = "1gb"

[checks.health]
  type = "http"
  port = 9428
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
