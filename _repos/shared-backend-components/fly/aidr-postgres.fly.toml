# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: postgres (kind=data) — phase-2: the demo plane is file/SQLite-backed; Postgres+pgvector is the staged-row load target (scripts.db.*). Provision when load plans go live.
app = "aidr-postgres"
primary_region = "iad"

[build]
  image = "pgvector/pgvector:pg16"

[env]
  OH_BIND_HOST = "0.0.0.0"
  PGDATA = "/data/pgdata"

# secrets (never in this file): fly secrets set -a aidr-postgres POSTGRES_PASSWORD=…

[[mounts]]
  source = "postgres_state"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
