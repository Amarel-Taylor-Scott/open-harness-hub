# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: redis (kind=data)
app = "aidr-redis"
primary_region = "iad"

[build]
  image = "redis:7-alpine"

[processes]
  app = "redis-server --appendonly yes --dir /data"

[env]
  OH_BIND_HOST = "0.0.0.0"

[[mounts]]
  source = "redis_state"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
