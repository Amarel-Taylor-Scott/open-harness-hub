# GENERATED by scripts/deploy/generate_provider_configs.py — edit architecture/deploy_topology.json, then re-run; do not hand-edit
# service: web-aidevobserver (kind=web)
app = "aidr-web-aidevobserver"
primary_region = "iad"

[build]
  dockerfile = "shared-backend-components/deploy/Dockerfile"  # from _repos/: fly deploy -c shared-backend-components/fly/aidr-web-aidevobserver.fly.toml --dockerfile shared-backend-components/deploy/Dockerfile --ha=false

[processes]
  app = "python3 -m scripts.showcase --port 8110"

[env]
  OH_BIND_HOST = "0.0.0.0"
  OH_PRODUCT = "aidevobserver"
  OH_SEAM_ANALYTICS_BASE = "http://aidr-events.internal:9420"
  OH_SEAM_IDENTITY_BASE = "http://aidr-identity.internal:9410"
  OH_SEAM_LIVEOPS_BASE = "http://aidr-baltor-backend.internal:9301"
  OH_SEAM_MAILBOX_BASE = "http://aidr-mailbox.internal:9428"
  OH_SEAM_OBSERVER_BASE = "http://aidr-observer.internal:9431"
  OH_SEAM_REGISTRY_BASE = "http://aidr-registry.internal:9423"
  OH_SEAM_TELEON_RUNTIME_BASE = "http://aidr-teleon-runtime.internal:9430"

# secrets (never in this file): fly secrets set -a aidr-web-aidevobserver OH_LLM_BASE_URL=… OH_LLM_MODEL=… OH_LLM_API_KEY=… OH_EMBED_MODE=… OH_EMBED_MODEL=… OH_EMBED_BASE_URL=… OH_INFERENCE_ALLOW_NETWORK=… OH_SHOWCASE_TOKEN=…

[http_service]
  internal_port = 8110
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
