services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openhubforai-postgres
    environment:
      POSTGRES_DB: openhubforai
      POSTGRES_USER: openhubforai
      POSTGRES_PASSWORD: openhubforai_dev
    ports:
      - "5432:5432"
    volumes:
      - openhubforai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhubforai -d openhubforai"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  openhubforai_pgdata:
