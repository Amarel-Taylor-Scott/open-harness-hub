# ml-engineer-role-matrix.yaml — facet lexicons distilled from the owner-supplied Machine Learning Engineer /
# Applied ML Engineer role decomposition (2026-07-07). Single source for the production-ML facet taxonomy:
# primitive_multi_index derives facet COLUMNS (one per facet) by matching these terms against a primitive's
# title/blackbox/tags, and minters may use the facets as generation axes. Terms are lowercase; multi-word
# phrases match as phrases; a `~` alias maps a surface form onto its canonical term (alias: canonical).
# Version lives here in metadata, never in names or ids. candidate-taxonomy; serves_truth: false.
