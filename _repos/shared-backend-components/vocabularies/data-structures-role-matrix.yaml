# data-structures-role-matrix.yaml — facet lexicons distilled from the owner-supplied "structured objects"
# decomposition (2026-07-07): modern software/data/LLM-assisted systems as structured objects — business
# entities, actions/events, schemas/contracts, documents/chunks/embeddings, workflows, agent traces, prompts,
# audit/permissions — plus the CRUD x transformation matrix over them. Third file on the same seam as
# ml-engineer-role-matrix.yaml / ai-assisted-engineer-role-matrix.yaml: primitive_multi_index loads EVERY
# vocabularies/*-role-matrix.yaml, so these facets become indexed/blocked columns with NO code change.
# Terms lowercase; phrases match as phrases; bare generic verbs (create/read/join/filter) are deliberately
# EXCLUDED — the `operations` column already keys those; facet terms here stay specific/discriminative.
# candidate-taxonomy; serves_truth: false.
