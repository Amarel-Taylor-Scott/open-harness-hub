# ai-assisted-engineer-role-matrix.yaml — facet lexicons distilled from the owner-supplied "AI-assisted
# Software / Platform / Data Engineer" role decomposition (2026-07-07): the mainstream engineer using LLMs
# heavily across the software lifecycle (84% adoption, 50.6% daily use per the 2025 Stack Overflow survey).
# Same contract as ml-engineer-role-matrix.yaml: primitive_multi_index loads EVERY vocabularies/
# *-role-matrix.yaml and derives one facet COLUMN per facet below — adding a role decomposition is a new
# data file, never a code change. Terms lowercase; phrases match as phrases; aliases map onto canonicals.
# candidate-taxonomy; serves_truth: false.
