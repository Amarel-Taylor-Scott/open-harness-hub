id: "pipeline/verification-packet-to-postgres-jsonl"
type: pipeline
version: "0.1.0"
name: "Verification packet to Postgres JSONL"
description: "Exports high-risk verification packets into canonical JSONL row families, validates row relationships, and prepares Postgres/pgvector bulk-load inputs."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "government", "humanitarian", "legal", "healthcare", "cross_industry"]
capability: ["verification", "format_conversion", "retrieval", "governance"]
modality: ["text", "structured"]
lifecycle: "experimental"
trust_boundary: "mixed"
freshness: "volatile"
lifecycle_position: "cross_cutting.product"
tags: ["verification-packet", "expert-review", "postgres", "pgvector", "jsonl", "bulk-load"]
created: "2026-05-25"
updated: "2026-05-25"

task: "Convert a grounded-search, model-review, and expert-review verification packet into canonical source, object, entity, dedupe, review, and index JSONL shards that can be loaded into Postgres/pgvector."
pipeline_kind: "research_web.verification_packet_persistence"
inputs:
  - name: "verification_packet"
    type: "json"
  - name: "inbound_digest"
    type: "json"
  - name: "output_dir"
    type: "string"
outputs:
  - name: "row_counts"
    type: "json"
  - name: "jsonl_files"
    type: "array"
  - name: "bulk_load_plan"
    type: "json"
defaults:
  knowledge_packs:
    - "knowledge-pack/verification-packet-record-persistence-patterns"
    - "knowledge-pack/expert-email-grounded-verification-patterns"
steps:
  - id: "govern-verification-packet"
    kind: "tool"
    ref: "tool/source-record-governance-router"
    inputs:
      source_record: "$.inputs.verification_packet"
      source_policy:
        require_privacy_boundary: true
        block_raw_personal_contact_publication: true
        default_license: "tenant-private"
  - id: "export-jsonl-row-families"
    kind: "tool"
    ref: "tool/verification-packet-jsonl-exporter"
    inputs:
      verification_packet: "$.inputs.verification_packet"
      inbound_digest: "$.inputs.inbound_digest"
      output_dir: "$.inputs.output_dir"
      include_raw_messages: false
  - id: "preflight-row-relationships"
    kind: "tool"
    ref: "tool/factory-jsonl-relationship-preflight"
    inputs:
      source_records:
        - "$.steps.export-jsonl-row-families.row_family_paths.source_record"
      normalized_objects:
        - "$.steps.export-jsonl-row-families.row_family_paths.normalized_object"
      canonical_entities:
        - "$.steps.export-jsonl-row-families.row_family_paths.canonical_entity"
      object_entity_refs:
        - "$.steps.export-jsonl-row-families.row_family_paths.object_entity_ref"
      dedupe_clusters:
        - "$.steps.export-jsonl-row-families.row_family_paths.dedupe_cluster"
      review_tickets:
        - "$.steps.export-jsonl-row-families.row_family_paths.review_ticket"
  - id: "prepare-bulk-copy"
    kind: "tool"
    ref: "tool/factory-jsonl-bulk-copy-loader"
    inputs:
      source_records:
        - "$.steps.export-jsonl-row-families.row_family_paths.source_record"
      normalized_objects:
        - "$.steps.export-jsonl-row-families.row_family_paths.normalized_object"
      canonical_entities:
        - "$.steps.export-jsonl-row-families.row_family_paths.canonical_entity"
      object_entity_refs:
        - "$.steps.export-jsonl-row-families.row_family_paths.object_entity_ref"
      dedupe_clusters:
        - "$.steps.export-jsonl-row-families.row_family_paths.dedupe_cluster"
      review_tickets:
        - "$.steps.export-jsonl-row-families.row_family_paths.review_ticket"
      index_records:
        - "$.steps.export-jsonl-row-families.row_family_paths.index_record"
success_criteria:
  - kind: "semantic"
    target: "$.row_counts"
    must_cover:
      - "source_record"
      - "normalized_object"
      - "canonical_entity"
      - "dedupe_cluster"
      - "review_ticket"
      - "index_record"
    similarity_threshold: 0.55
    severity: "high"
    label: "Verification packet is mapped to canonical row families."
  - kind: "deterministic"
    target: "$.jsonl_files"
    op: "is_truthy"
    value: true
    severity: "medium"
    label: "JSONL shard files are emitted."
