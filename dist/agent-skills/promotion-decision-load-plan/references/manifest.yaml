id: "pipeline/promotion-decision-load-plan"
type: pipeline
version: "0.1.0"
name: "Promotion decision load plan"
description: "Creates CSV and SQL load bundles for promotion decisions, quality index rows, and review tickets so component candidates can move through a database-backed review gate."
authors:
  - name: "OpenHubForAI contributors"
license: "MIT"
industry: ["ai", "software.devops", "cross_industry"]
capability: ["evaluation", "governance", "routing", "verification"]
modality: ["structured", "text"]
lifecycle: "experimental"
trust_boundary: "local"
freshness: "stable"
lifecycle_position: "cross_cutting.storage"
tags: ["components", "promotion", "review-gate", "postgres", "quality-index"]
created: "2026-05-26"
updated: "2026-05-26"

task: "Create a review-gated Postgres load plan for candidate promotion decisions, quality index rows, and review tickets."
pipeline_kind: "research_web.promotion_decision_load_plan"
inputs:
  - name: "promotion_decisions_path"
    type: "string"
  - name: "index_records_path"
    type: "string"
  - name: "review_tickets_path"
    type: "string"
  - name: "output_dir"
    type: "string"
outputs:
  - name: "promotion_decision_load_plan"
    type: "json"
  - name: "promotion_decisions_csv"
    type: "csv"
  - name: "promotion_index_records_csv"
    type: "csv"
  - name: "promotion_review_tickets_csv"
    type: "csv"
  - name: "load_sql"
    type: "sql"
defaults:
  knowledge_packs:
    - "knowledge-pack/promotion-decision-load-patterns"
steps:
  - id: "load-promotion-checks"
    kind: "knowledge_pack"
    ref: "knowledge-pack/promotion-decision-load-patterns"
    inputs:
      query: "promotion decision review gate quality index record review ticket postgres load"
      top_k: 20
  - id: "plan-promotion-decision-load"
    kind: "tool"
    ref: "tool/promotion-decision-load-planner"
    inputs:
      promotion_decisions_path: "$.inputs.promotion_decisions_path"
      index_records_path: "$.inputs.index_records_path"
      review_tickets_path: "$.inputs.review_tickets_path"
      output_dir: "$.inputs.output_dir"
  - id: "audit-staged-vs-committed"
    kind: "tool"
    ref: "tool/staged-vs-committed-load-auditor"
    inputs:
      reason: "After psql execution, compare promotion decision, index record, and review ticket counts with planned counts before promoting active components."
success_criteria:
  - kind: "deterministic"
    target: "$.promotion_decision_load_plan.promotion_decision_count"
    op: ">"
    value: 0
    severity: "high"
    label: "Promotion decision rows are exported."
  - kind: "deterministic"
    target: "$.promotion_decision_load_plan.index_record_count"
    op: ">"
    value: 0
    severity: "medium"
    label: "Quality index rows are exported."
  - kind: "semantic"
    target: "$.promotion_decision_load_plan"
    must_cover:
      - "promotion decisions"
      - "quality index records"
      - "review tickets"
      - "review gated promotion"
    similarity_threshold: 0.55
    severity: "medium"
    label: "Load plan preserves review-gated promotion flow."
